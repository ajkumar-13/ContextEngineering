outcomes:
  - id: o1
    text: "Decide when moving a coding agent to a remote server pays for the setup, from the task's length, the machine it needs and the devices that drive it."
  - id: o2
    text: "Configure a cloud server behind a security group and an instance role, with key-only SSH and the agent in a tmux session reached over SSH or VS Code."
  - id: o3
    text: "Add a chat bridge that notifies on three events and returns a reply to the running session, and keep it from becoming a way in."
  - id: o4
    text: "Price a month of remote work from an instance's hourly rate and the model's per-million rates, and say which bill dominates."
  - id: o5
    text: "Fence a remote agent box with controls enforced outside the prompt: scoped credentials, network rules, a command deny-list and an audit log."
