<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">The controls on a remote agent box, and why each one is not a prompt rule</title>
  <desc id="d">A hand-drawn table of seven controls on a remote agent box. Who can reach the box is fenced by a security group allowing inbound SSH from a known range only, because the network is the part a laptop did not have. What the box can reach is fenced by an IAM instance role scoped to exactly the workload rather than baked-in keys, which is the whole separation-of-credentials benefit. How the human logs in is fenced by key-only authentication, a non-default port, fail2ban, and multi-factor authentication. What the agent may run is fenced by a deny-list at the hook level covering destructive deletes, force-pushes to main, and sudo. What it may write is fenced by read-only mounts for vendored directories, generated code, and secrets. What it can deploy is fenced by staging credentials only, with production promoted through normal CI/CD. And what it actually did is captured by an audit log of every shell command with timestamp and user.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="480"/>
<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">What is fenced on a remote box, and by what</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">The threat model is the same as a laptop, plus the network. The agent is a mostly-trusted automated user with shell access.</text><text xml:space="preserve" x="40" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">What is fenced</text><text xml:space="preserve" x="260" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">The control</text><text xml:space="preserve" x="610" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Why it is not just a prompt rule</text><path d="M39.57 113.94C40.75 122.78 39.97 131.91 40.93 153.86M39.78 113.84C40.35 125.12 40.13 135.09 40.43 153.47" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="134.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Who can reach the box</text><text xml:space="preserve" x="260" y="125.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Security group: inbound SSH from a known CIDR only, never</text><text xml:space="preserve" x="260" y="137.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">0.0.0.0/0. Outbound 443 for the API.</text><text xml:space="preserve" x="610" y="125.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The network is the part a laptop did not have.</text><path d="M41.17 163.95C40.7 178.84 41.14 192.88 39.79 203.63M40.31 163.5C40.63 172.06 40.69 180.36 40.47 203.58" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="184.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">What the box can reach</text><text xml:space="preserve" x="260" y="175.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">An IAM instance role scoped to exactly the workload — one</text><text xml:space="preserve" x="260" y="187.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">S3 prefix, one registry — not baked-in keys.</text><text xml:space="preserve" x="610" y="175.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Scoped credentials that never touch the laptop are</text><text xml:space="preserve" x="610" y="187.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">the whole separation-of-credentials benefit.</text><path d="M40.38 213.96C40.11 226.91 39.39 237.85 41.04 253.4M39.63 214.35C40.38 228.21 39.52 241.64 40.51 253.7" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="234.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">How the human logs in</text><text xml:space="preserve" x="260" y="225.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Key-based auth only, no passwords, non-default port,</text><text xml:space="preserve" x="260" y="237.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">fail2ban, MFA on the human side.</text><text xml:space="preserve" x="610" y="225.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The agent runs with elevated trust; the door to it</text><text xml:space="preserve" x="610" y="237.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">should not be weaker than the agent.</text><path d="M39.59 263.97C40.06 274.97 40.56 282.82 39.9 303.17M40.15 264.01C40.66 275.16 40.07 286.92 40.55 303.82" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="284.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">What the agent may run</text><text xml:space="preserve" x="260" y="275.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">A deny-list at the hook level: no rm -rf /, no force-push</text><text xml:space="preserve" x="260" y="287.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">to main, no sudo.</text><text xml:space="preserve" x="610" y="275.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Post 26, section 6: a hook is enforcement, a rule in</text><text xml:space="preserve" x="610" y="287.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">the prompt is a suggestion.</text><path d="M41.19 313.97C39.47 328.63 38.8 346.19 41.16 352.95M39.47 313.66C40.41 323.31 40.1 333.4 40.59 353.94" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="334.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">What it may write</text><text xml:space="preserve" x="260" y="325.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Read-only mounts for vendored directories, generated</text><text xml:space="preserve" x="260" y="337.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">code, and secrets.</text><text xml:space="preserve" x="610" y="325.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The filesystem enforces this whether or not the agent</text><text xml:space="preserve" x="610" y="337.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">agrees.</text><path d="M40.4 363.98C39.42 376.7 39.97 391.16 40.02 405.12M39.99 364.52C39.48 379.45 39.46 394.68 39.43 404.05" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="384.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">What it can deploy</text><text xml:space="preserve" x="260" y="375.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Staging credentials only. Production is promoted through</text><text xml:space="preserve" x="260" y="387.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">the normal CI/CD path.</text><text xml:space="preserve" x="610" y="375.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The agent should never be the shortest route to</text><text xml:space="preserve" x="610" y="387.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">production.</text><path d="M39.6 413.99C38.84 424.76 40.61 436.13 38.87 454.89M40.51 414.17C39.76 426.4 40.02 439.96 39.46 454.17" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="434.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">What it actually did</text><text xml:space="preserve" x="260" y="425.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">An audit log of every shell command, with timestamp and</text><text xml:space="preserve" x="260" y="437.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">user.</text><text xml:space="preserve" x="610" y="425.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">This is the one that saves the on-call engineer's</text><text xml:space="preserve" x="610" y="437.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">evening.</text><text xml:space="preserve" x="40" y="481.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">No production credentials on the dev box. The controls are standard server hygiene, plus the thought that the agent is a user too.</text>
</svg>
