<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-00-hero-remote-agentic-workflow-title" aria-describedby="ctx-00-hero-remote-agentic-workflow-desc">
<title id="ctx-00-hero-remote-agentic-workflow-title">Only SSH comes in; everything else goes out</title>
<desc id="ctx-00-hero-remote-agentic-workflow-desc">Four boxes from left to right. Thin clients: a laptop with SSH or VS Code, and a phone with an SSH app and a chat app. A dashed security-group boundary admits one inbound connection, SSH on port 52222. Inside it a cloud VM with a scoped instance role holds a tmux session running the coding agent with the repository and the toolchain, and a chat bridge that types replies into the session with send-keys. Both reach out: the agent to the model API, Claude Opus 4.6 or a peer, over HTTPS on port 443, and the bridge to a chat service such as the Telegram Bot API, which it polls. The chat service carries notifications to the phone and replies back.</desc>
