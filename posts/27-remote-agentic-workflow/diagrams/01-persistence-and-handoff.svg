<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">What persists across a disconnect, and how a reply reaches a running agent</title>
  <desc id="d">A hand-drawn figure in two halves. On the left, three things that survive a disconnect: the tmux session, which outlives SSH so reattaching finds whatever was running still running; the conversation history, kept in the agent's own state file; and the shell history, working directory, and in-flight processes. A caption notes the user can switch device and resume exactly, and that one tmux session per project keeps each context focused. On the right, the reply path: because a running agent is usually mid-turn, a bridge cannot write to its standard input, so it either drives the terminal directly with tmux send-keys, typing the reply exactly as a human would, or exposes the reply as a tool result the agent reads next turn. A final panel restricts notifications to three events — task complete, blocked on a question, and an error needing a human — because notifying on every step trains the user to ignore the channel.</desc>

