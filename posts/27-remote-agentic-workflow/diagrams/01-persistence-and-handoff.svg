<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-persistence-and-handoff-title" aria-describedby="ctx-01-persistence-and-handoff-desc">
<title id="ctx-01-persistence-and-handoff-title">One session, three clients, no restart</title>
<desc id="ctx-01-persistence-and-handoff-desc">A time line from left to right with no clock times. Three client lanes sit above two bars. Laptop: attached from the start, when it creates the session and starts the task, until the lid closes. Phone: a notification that the agent is blocked, sent up from the session by the Notification hook, then a reply sent through the chat bridge, which types it into the session, then a notification that the task is complete, sent by the Stop hook. Second computer: VS Code attaches after that and stays attached. Below, the tmux session on the server runs from start to end without a break, and the agent's task runs inside it from the start until it completes.</desc>
<style>
