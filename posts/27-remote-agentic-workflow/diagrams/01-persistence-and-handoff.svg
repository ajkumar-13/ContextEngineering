 51 108 51 108M51 108C51 108 51 108 51 108" fill="none" stroke="var(--ctx-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M45.37 117.54C45 134.72 46.32 153.69 45.01 164.32M44.65 116.63C44.98 135.32 44.7 153.65 44.82 165.34" fill="none" stroke="var(--ctx-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="125.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink)">The tmux session</text><text xml:space="preserve" x="60" y="143.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">Outlives SSH entirely. Reattach with tmux attach and whatever was</text><text xml:space="preserve" x="60" y="155.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">running is still running.</text><path d="M49.59 180.83C178.23 182.23 306.84 183.59 459.77 180.98C465.41 180.53 468.49 184.23 471.75 190.72C469.41 211.26 467.47 227.88 470.15 236.48C470.96 243.96 463.82 250.35 461.27 246.29C337.48 249.37 213.3 248.87 51.15 246.61C43.91 249.07 37.67 242.84 41.38 238.07C38.14 223.78 40.86 213.21 37.7 192.25C37.61 185.47 45.82 183.26 48.54 183.65C51 182 51 182 51 182" fill="var(--ctx-surface)" stroke="none"/><path d="M51.34 183.06C169.7 180.25 287.58 180.27 459.33 182.87M51.04 182.25C148.03 180.19 244.63 180.42 459.42 182.11M459 182C466.12 181.99 468.46 184.38 470.17 193.56M458.57 182.43C467.8 179.78 471.4 187.76 472.11 191.31M471.43 194.12C471.3 203.16 471.23 213.08 468.43 236.6M470.11 192.7C469.35 206.78 468.91 219.18 470.7 237.67M470 237C470.34 244.86 466.79 249.98 458.23 247.12M470.58 236.53C469.47 246.27 467.45 246.69 460.22 246.8M459.85 248.16C343.88 249.04 230.05 250.44 51.72 247.3M458.74 248.39C305.93 249.12 153.87 250.