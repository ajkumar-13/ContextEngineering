11 470.17 268.75M469.26 268.11C469.7 283.08 470.67 298.81 471.52 310.15M470.92 267.95C470.56 281.78 470.65 295.64 469.09 311.28M470 311C471.39 320.31 466.09 323.62 458.27 323.41M470.93 309.46C471.06 318.14 467.71 320.75 459.58 321.65M458.67 322.26C364.78 319.71 268.51 321.41 51.4 322.48M459.24 321.75C312.57 324.2 166.52 323.72 51.02 321.87M51 322C45.33 321.9 39.81 317.78 41.33 310.29M52.33 321.3C45.19 321.35 40.89 317.45 40.4 309.14M38.03 311.99C41.38 293.72 39.92 278.85 38.44 267.5M40.61 310.66C39.82 293.75 39.62 276.16 40.4 267.74M40 267C41 259.7 41.87 254.68 51.94 254.9M40.14 267.46C38.41 260.06 45.58 257.08 49.23 257.17M51 256C51 256 51 256 51 256M51 256C51 256 51 256 51 256" fill="none" stroke="var(--ctx-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M46.18 265.56C44.36 277.93 45.73 289.79 45.13 311.86M44.5 265.14C44.99 277.5 45.26 290.36 44.9 313.57" fill="none" stroke="var(--ctx-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="273.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink)">Shell, cwd, processes</text><text xml:space="preserve" x="60" y="291.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">Shell history, the working directory, and every in-flight process</text><text xml:space="preserve" x="60" y="303.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">stay alive.</text><text xml:space="preserve" x="40" y="346.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">The user disconnects, switches device, reconnects from anywhere, and resumes exactly. The agent does not know it switched users.</text><text xml:space="preserve" x="40" y="366.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink-muted)">One tmux session per active project. Switching projects means switching sessions, so each one's context stays focused.</text><text xml:space="preserve" x="490" y="99.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ctx-ink)">The reply path</text><path d="M514.63 106.71C615.69 108.11 717.66 107.04 895.17 108.69C911.11 108.25 917.95 118.22 919.82 134.29C919.53 174.12 920.37 216.13 922.48 296.12C919.45 307.46 910.65 320.17 894.55 317.74C819.57 319.66 739.72 318.2 514.34 319.16C498.71 318.32 491.19 307.5 492.5 292.75C489.38 236.6 491.49 176.32 490.97 133.35C488.34 113.7 497.48 107.88 514.95 105.73C514 108 514 108 514 108" fill="var(--ctx-surface)" stroke="none"/><path d="M515.18 107.37C622.36 106.08 728.08 106.32 896.81 107.72M514.28 108.22C658.69 107.59 802.92 108.08 895.96 108.15M896 108C913.47 106.76 921.06 117.21 920.34 130.32M896.13 109.93C910.43 107.76 922.25 117.24 920.22 134.02M919.47 131.1C920.08 189.68 916.86 248.84 921.92 294.35M919.85 132.63C920.58 167.29 921.09 202.99 920.26 294.09M920 294C921.22 310.51 910.54 317.98 895.34 318.41M920.53 293.57C921.55 310.67 912.67 319.14 894.3 319.14M895.21 319.07C743.77 315.95 593.8 315.95 513.83 318.95M895.41 318.01C788.59 319.59 681.61 320.31 514.38 317.67M514 318C496.55 318.5 490.05 310.47 491.7 293.42M514.85 317.34C499.34 315.75 490.12 311.4 489.29 292.19M489.96 294.5C490.81 231.7 489.47 167.51 491.76 133.84M490.54 294.1C491.37 233.46 490.03 172.52 490.98 132.66M490 132C490.89 117.34 496.54 106.51 513.78 106.27M488.11 131.76C488.5 116.7 498.76 109.61 512.09 108.89M514 108C514 108 514 108 514 108M514 108C514 108 514 108 514 108" fill="none" stroke="var(--ctx-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M495.39 118.17C494.71 177.91 495.82 238.72 494.33 309.26M495.41 117.44C496.66 168.04 496.22 218.58 495.57 309.48" fill="none" stroke="var(--ctx-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="510" y="125.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">A running agent is usually mid-turn, so a bridge cannot write to its</text><text xml:space="preserve" x="510" y="137.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">stdin and expect the text to land in the right place.</text><text xml:space="preserve" x="510" y="177.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">In practice the bridge does one of two things:</text><text xml:space="preserve" x="510" y="201.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">1  drives the terminal directly, typing the reply into</text><text xml:space="preserve" x="510" y="217.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">   the pane exactly as a human would:</text><text xml:space="preserve" x="524" y="237.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ctx-accent)">tmux send-keys -t acme-api &quot;$reply&quot; Enter</text><text xml:space="preserve" x="510" y="263.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">2  exposes the reply as a tool result the agent reads</text><text xml:space="preserve" x="510" y="279.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">   on its next turn.</text><text xml:space="preserve" x="510" y="302.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-subtle)">claude-code-remote and OpenClaude ship the first shape.</text><path d="M505.38 332.89C644.99 330.3 784.95 331.91 904.59 333.39C913.52 329.56 917.46 336.53 918.06 345.83C919.36 367.36 920.36 390.01 918.92 403.69C921.39 413.92 916.46 418 906.37 415.16C794.39 413.84 681.21 413.8 503.41 415.9C497.22 415.64 488.24 409.82 492.57 401.01C488.58 388.7 489.67 378.86 490.62 343.58C490.41 335.3 492.19 333.47 503.32 332.79C504 332 504 332 504 332" fill="var(--ctx-surface)" stroke="none"/><path d="M504.38 332.55C599.5 328.96 693.86 329.58 906.34 332.32M504.36 331.96C598.65 333.15 693.37 332.28 906.05 331.85M906 332C915.78 330.37 919.43 336.14 920.49 344.82M906.27 330.92C913.51 333.13 918.83 337.96 922.27 345.11M918.05 345.08C919.75 362.01 919.13 375.26 919.63 401.21M920.88 346.75C921.18 367.96 920.01 388.5 920.23 402.11M920 402C919.83 411.46 916.14 417.07 905.44 416.14M919.38 400.88C920.92 411.26 914.34 417.28 904.99 414.67M905.63 416.15C756.13 415.58 606.66 416.33 503.03 416.51M905.58 416.07C768.58 413.69 632.24 413.63 503.89 415.75M504 416C495.06 416.2 490.96 410.41 490.51 402.76M504.17 417.69C496.4 416.72 490.99 413.37 490.99 403.54M490.44 403.52C491.63 384.5 491.61 366.39 491.37 344.04M490.14 402.16C489.67 391.27 490.44 379.2 490.1 345.11M490 346C490.17 336.45 496.55 331.99 503.27 331.07M488.06 347.63C489.27 337.14 495.76 331.73 505.83 331.17M504 332C504 332 504 332 504 332M504 332C504 332 504 332 504 332" fill="none" stroke="var(--ctx-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.6 340.99C493.73 358.85 495.51 377.3 493.87 407.89M495.51 341.17C494.92 361.74 495.18 383.64 494.46 407.17" fill="none" stroke="var(--ctx-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="510" y="351.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink)">Notify on three events, and no others</text><text xml:space="preserve" x="510" y="371.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">task complete · blocked on a question · an error needing a human</text><text xml:space="preserve" x="510" y="394.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">Notifying on every step trains the user to ignore the channel, which costs</text><text xml:space="preserve" x="510" y="405.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">more than the notifications saved.</text><text xml:space="preserve" x="40" y="459.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink)">Persistence is what makes the remote box worth the setup. The bridge is what makes the persistence worth having while you are away from it.</text>
</svg>
