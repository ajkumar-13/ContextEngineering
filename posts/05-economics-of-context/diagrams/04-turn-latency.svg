<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-04-turn-latency-title" aria-describedby="ctx-04-turn-latency-desc">
<title id="ctx-04-turn-latency-title">A cache hit shortens the wait for the first token</title>
<desc id="ctx-04-turn-latency-desc">Two rows show one agent turn. On a cache miss, prefill computes all 10,500 input tokens in one parallel pass before the first token appears, then decode runs 400 forward passes in sequence, one per output token. On a cache hit, the 4,600 prefix tokens are read from the cache and prefill computes only 5,900, so the first token comes sooner; decode is the same 400 passes. Below, total time is prefill time plus the number of output tokens times the time per decode step.</desc>
