<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">The economics of prompt caching</title>
  <desc id="d">Two hand-drawn bars of identical width price the same 10,500-token input. The upper bar is a cache miss: the 4,600-token stable prefix bills at full price plus a 1.25 times write premium, the volatile suffix bills at full price, and the input costs about three and a sixth cents. The lower bar is a cache hit: the same prefix is re-read at roughly a tenth of the price while the suffix is unchanged, and the input costs about one and nine tenths cents. A dashed line marks the cache breakpoint between the frozen system-and-tools prefix and the volatile suffix carrying this turn's message and retrieval. A caption notes the hit also cuts latency, because skipping prefill of the cached prefix collapses time-to-first-token toward the small-prompt case.</desc>

