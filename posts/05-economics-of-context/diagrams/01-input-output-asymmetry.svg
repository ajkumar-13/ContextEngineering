So</text><text xml:space="preserve" x="500" y="119.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Short prompt, long answer</text><g opacity="0.4"><path d="M502.84 129.63C519.63 128.62 535.45 130.53 546.28 127.46C546.82 129.04 548 130.75 549.99 132.46C549.35 137.22 547.93 142.23 551.44 147.24C547.7 150.22 548.63 154.18 544.89 149.71C531.11 150.81 514.36 152.28 502.65 152.59C503.42 152.39 499.92 150.15 501.46 149.33C498.07 144.51 499.42 135.72 502.05 132.55C499.69 130.06 501.53 125.65 505.11 127.51C504 128 504 128 504 128" fill="var(--ce-primary)" stroke="none"/><path d="M503.31 127.94C514.2 129.6 525.33 126.33 545.84 126.62M504.25 128.01C517.21 126.89 528.56 126.94 546.91 127.7M546 128C547.44 127.6 550.83 130.32 550.32 133.07M545.71 129.43C549.88 127.16 547.99 131.49 549.56 132.01M550.01 132.88C549.14 138.67 551.16 141.75 550.12 146.77M549.32 131.86C549.9 135.66 549.81 139.95 550.53 148.55M550 148C548.96 150.81 547.38 151.07 545.33 150.84M549.44 146.84C548.85 151.87 548.12 150.83 547.91 152.93M544.2 150.75C535.92 149.84 525.12 153.71 503.86 150.06M545.78 152.81C535.27 152.52 525.56 152.86 503.13 152.64M504 152C500.9 150.13 501.16 149.28 498.22 149.69M504.92 151.91C499.41 151.29 499.57 151.09 501.42 148.15M499.29 148C500.66 142.81 501.41 135.68 499.2 130.57M499.98 148.72C499.72 143.07 499.93 138.06 499.57 131.85M500 132C499.76 127.63 501.54 129.96 502.24 129.78M500.11 133.58C499.8 128.67 501.6 128.87 505.39 126.3M504 128C504 128 504 128 504 128M504 128C504 128 504 128 504 128" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text xml:space="preserve" x="558" y="142.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">2,000 in</text><g opacity="0.4"><path d="M502.08 157.26C515.3 156.56 522.17 156.28 536.13 155.64C536.72 157.