<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Why output tokens cost about five times what input tokens cost</title>
  <desc id="d">A hand-drawn figure in two halves. The left half explains the mechanism: prefill processes every prompt token in a single parallel pass that fills the KV-cache, while decode needs one full forward pass per output token, each depending on the one before it, so parallel work is cheap and sequential work is not. The right half shows the consequence with two calls drawn on one token scale. A short prompt of two thousand input tokens with a fifteen hundred token answer costs about two point nine cents; a long prompt of twelve thousand input tokens with a two hundred token answer costs about three point nine cents. Six times the input, a comparable bill, because the first call generated seven times as much text on the five-times-priced side. A caption advises setting max_tokens deliberately.</desc>

