mic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">seven times as much text, on the five-times-priced side.</text><text xml:space="preserve" x="40" y="361.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Trimming the prompt saves input dollars. Trimming the answer saves output dollars,</text><text xml:space="preserve" x="40" y="381.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">and output dollars are worth five of the other kind. Set max_tokens deliberately.</text><text xml:space="preserve" x="40" y="404.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Illustrative, at the mid-tier rates in section 2: $3 per 1M input, $15 per 1M output (early 2026).</text>
