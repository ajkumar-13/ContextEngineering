irst token</text><text xml:space="preserve" x="210" y="369.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">A cache read skips prefill for the cached prefix, so the warm turn behaves like the short one.</text><text xml:space="preserve" x="210" y="389.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Caching buys the same move twice: cheaper and faster on every hit.</text>
