<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">The latency budget of an agent turn, cold and warm</title>
  <desc id="d">Three hand-drawn timelines on one scale. The first is a cold turn with a forty-thousand-token prompt: a long prefill segment precedes a decode segment, and the time-to-first-token arrow spans the whole prefill. The second is a warm turn over the same context, with thirty-nine and a half thousand tokens cached and five hundred fresh: the prefill segment shrinks almost to nothing while decode is unchanged, so the time-to-first-token arrow is tiny. The third is a cold turn with a five-hundred-token prompt, which looks almost identical to the warm one. Captions explain that a cache read skips prefill for the cached prefix, so a warm long-context turn behaves like a short-prompt turn, and that caching therefore buys the same move twice: cheaper and faster on every hit.</desc>

