<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-write-premium-break-even-title" aria-describedby="ctx-03-write-premium-break-even-desc">
<title id="ctx-03-write-premium-break-even-title">One cache read repays the five-minute write premium</title>
<desc id="ctx-03-write-premium-break-even-desc">A line chart of the cumulative cost of the 4,600-token prefix over five calls on Claude Sonnet 4.5. Without caching it rises by $0.01380 a call, to $0.06900. A five-minute cache costs $0.01725 on call 1, more than no caching, and is already cheaper on call 2 at $0.01863, ending at $0.02277. A one-hour cache costs $0.02760 on call 1, is still dearer on call 2 and cheaper from call 3, ending at $0.03312. A cache that expires between calls is written again every time and ends at $0.08625, the most expensive line.</desc>
