<marker id="ctx-02-output-asymmetry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="526">A sixth of the input, and still the dearer call</text>
<text x="40" y="76" class="t-subtitle" data-w="767">Claude Sonnet 4.5: $3 per million input tokens, $15 per million output tokens (Anthropic, 12 October 2026).</text>
<text x="232" y="144" class="t-head" data-w="123">Tokens per call</text>
<text x="584" y="144" class="t-head" data-w="122">Dollars per call</text>
<text x="40" y="188" class="t-head" data-w="115">Short prompt,</text>
<text x="40" y="208" class="t-head" data-w="99">long answer</text>
