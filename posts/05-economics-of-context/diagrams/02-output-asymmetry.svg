<text x="40" y="444" class="t-label" data-w="550">At 5 times the price, the 2,500 output tokens cost as much as 12,500 input tokens.</text>
<text x="40" y="504" class="t-note" data-w="655">The bill follows the answer: trimming output saves five times what trimming input does, per token.</text>
