      --ctx-purple-soft: #331F2E;
      --ctx-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--ctx-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ctx-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--ctx-ink); }
