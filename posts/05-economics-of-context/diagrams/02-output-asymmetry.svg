<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-output-asymmetry-title" aria-describedby="ctx-02-output-asymmetry-desc">
<title id="ctx-02-output-asymmetry-title">A sixth of the input, and still the dearer call</title>
<desc id="ctx-02-output-asymmetry-desc">Two calls on Claude Sonnet 4.5, drawn in tokens on the left and in dollars on the right. The short prompt sends 2,000 input tokens and gets 2,500 output tokens; the long prompt sends 12,000 input tokens and gets 200. In dollars the short prompt costs $0.00600 for input plus $0.03750 for output, $0.04350, and the long prompt $0.03600 plus $0.00300, $0.03900, because an output token costs 5 times an input token.</desc>
<style>
