outcomes:
  - id: o1
    text: "Price a call at any tier from its input and output tokens, and predict how prompt caching changes the bill."
  - id: o2
    text: "Explain why output tokens cost more than input tokens and why a long prompt delays the first token, in terms of prefill and decode."
  - id: o3
    text: "Design a stable-prefix layout that maximises cache hits, and name the changes that silently invalidate it."
  - id: o4
    text: "Decide whether caching a prefix pays for its write premium, from how often the prefix is reused within the cache lifetime."
  - id: o5
    text: "Set cost guardrails before launch: per-call budgets, model routing, a capped output length and cache-hit monitoring."
