<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Tokens, windows, and budgets</title>
  <desc id="d">A hand-drawn figure in two bars and three cards. The upper bar is the full context window, an example two hundred thousand tokens. The lower bar, drawn to the same scale, is the input token budget: segments for retrieval, conversation history, and an output reserve fill roughly the left half, and the remainder is drawn as a dashed, deliberately unspent region, with a note that the ceiling is not a target. Below, three cards define the terms: a token is about three quarters of an English word and code tokenises far worse; the window is a hard architectural ceiling past which quality degrades first; the budget is the set of per-layer caps you enforce yourself, trading cost, latency, and quality.</desc>

