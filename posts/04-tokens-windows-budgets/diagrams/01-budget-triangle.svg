<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
  <title id="t">The cost, latency, quality triangle</title>
  <desc id="d">A hand-drawn triangle with a labelled node at each vertex: quality at the top, cost at the lower left, latency at the lower right. Each edge is annotated with the pair it keeps, what that costs, and a concrete workload. Cheap plus high quality means slow, which suits nightly batch summarisation. Fast plus high quality means expensive, which suits a user-facing chat on the critical path. Cheap plus fast means lower quality, which suits high-volume classification. A caption notes that cascade and plan-and-execute patterns let one product occupy two corners at once.</desc>

