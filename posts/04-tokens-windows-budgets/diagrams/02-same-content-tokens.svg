<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-same-content-tokens-title" aria-describedby="ctx-02-same-content-tokens-desc">
<title id="ctx-02-same-content-tokens-title">The same content, a different number of tokens</title>
<desc id="ctx-02-same-content-tokens-desc">Two bar charts of token counts measured with OpenAI's cl100k_base and o200k_base encodings. Left, one support ticket written three ways: prose 87 tokens, a Python dictionary 148 (1.70 times the prose) and indented JSON 183 (2.10 times), the same under both encodings. Right, one 57-character customer message: English 14 tokens under both encodings, Hindi 61 under cl100k_base and 22 under o200k_base.</desc>
