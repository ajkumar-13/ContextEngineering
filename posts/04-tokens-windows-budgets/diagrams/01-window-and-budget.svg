<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-window-and-budget-title" aria-describedby="ctx-01-window-and-budget-desc">
<title id="ctx-01-window-and-budget-title">One call spends 10,900 of a 200,000-token window</title>
<desc id="ctx-01-window-and-budget-desc">A long bar for the context window of Claude Sonnet 4.5, 200,000 tokens, with a thin slice at its left end for one call of the support agent, 10,900 tokens, and 189,100 tokens left unused. Dashed connectors enlarge the slice into a strip of the six layers and the output, each drawn to scale with a dashed outline: 01 System prompt 3,000, 02 Tools and MCP descriptions 1,600, 03 Memory and state 1,200, 04 Retrieved chunks 2,500, 05 Conversation history 2,000, 06 User instruction 200, and the output 400. Brackets mark layers 01 and 02 as the stable prefix of 4,600 tokens and the six layers as the input of 10,500 tokens.</desc>
<style>
