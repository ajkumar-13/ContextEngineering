<text x="40" y="76" class="t-subtitle" data-w="663">Window of Claude Sonnet 4.5 (Anthropic, consulted October 2026); token counts illustrative.</text>
<text x="40" y="128" class="t-head" data-w="265">Context window: 200,000 tokens</text>
