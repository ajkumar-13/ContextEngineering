<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">Per-layer token budget allocation</title>
  <desc id="d">A hand-drawn horizontal bar divided into six proportional segments summing to one hundred per cent of the input budget: system prompt ten per cent, tools ten per cent, memory eight, retrieval thirty-two, conversation history thirty-five, and the user message five. A bracket under the retrieval and history segments marks them as the two shares that move while the rest are fixed. Captions explain that system and tools take hard caps because they form the cache prefix, that retrieval and history each need an explicit ceiling enforced in code, that the output reserve sits outside this hundred per cent at ten to twenty per cent of the window, and that without per-layer caps retrieval or history will consume every other layer's share within weeks.</desc>

