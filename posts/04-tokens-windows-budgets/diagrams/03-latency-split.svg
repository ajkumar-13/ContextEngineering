<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-latency-split-title" aria-describedby="ctx-03-latency-split-desc">
<title id="ctx-03-latency-split-title">Decode outlasts prefill at every model class</title>
<desc id="ctx-03-latency-split-desc">Three horizontal bars on a seconds axis from 0 to 20, one per model class, for one call of 10,500 input and 400 output tokens at illustrative per-token rates, each split into prefill and decode: cheap, 0.1 and 8 ms per token, 1.05 plus 3.20 seconds, 4.25 in all; mid, 0.2 and 16 ms, 2.10 plus 6.40, 8.50; frontier, 0.4 and 32 ms, 4.20 plus 12.80, 17.00. Every bar has a dashed outline because the rates are illustrative.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
    --ctx-accent: #D98E5F;
    --ctx-success: #5C9E78;
    --ctx-warn: #B8895A;
    --ctx-alert: #C66B5E;
    --ctx-neutral-1: #EAEAE4;
    --ctx-neutral-2: #CFCFC8;
    --ctx-neutral-3: #8E8E88;
    --ctx-on-fill: #FFFDF9;
    --ctx-on-accent: #1A1A1A;
    --ctx-grid: rgba(26, 26, 26, 0.06);
    --ctx-rule: #8E8E88;
    --ctx-arrow: #6E6E68;
    --ctx-neutral-soft: #F2F2EE;
    --ctx-blue: #0072B2;
    --ctx-blue-ink: #005A8C;
    --ctx-blue-soft: #E3F0F8;
    --ctx-blue-line: #9CC6E0;
    --ctx-orange: #C98500;
    --ctx-orange-ink: #8A5B00;
    --ctx-orange-soft: #FBF0D9;
    --ctx-orange-line: #E5C27A;
    --ctx-green: #008F68;
    --ctx-green-ink: #006B4E;
    --ctx-green-soft: #DFF3EC;
    --ctx-green-line: #8FCDB8;
    --ctx-red: #A8322A;
    --ctx-red-ink: #8F2A23;
    --ctx-red-soft: #F8E3E1;
    --ctx-red-line: #DDA49F;
    --ctx-purple: #A14D8C;
    --ctx-purple-ink: #833E72;
    --ctx-purple-soft: #F4E4EF;
    --ctx-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ctx-bg: #0E0F12;
      --ctx-surface: #16181C;
      --ctx-ink: #F2F2EE;
      --ctx-ink-muted: #B4B4AE;
      --ctx-ink-subtle: #6E6E68;
      --ctx-border: #2A2D33;
      --ctx-primary: #8BA8E0;
      --ctx-accent: #E8B088;
      --ctx-success: #7FBF9B;
      --ctx-warn: #D4B58A;
      --ctx-alert: #D88880;
      --ctx-neutral-1: #1F2229;
      --ctx-neutral-2: #2C3038;
      --ctx-neutral-3: #6E6E68;
      --ctx-on-fill: #14161A;
      --ctx-on-accent: #1A1A1A;
      --ctx-grid: rgba(241, 238, 232, 0.08);
      --ctx-rule: #6A6D74;
      --ctx-arrow: #9A9A94;
      --ctx-neutral-soft: #1C1E23;
      --ctx-blue: #5AA8E0;
      --ctx-blue-ink: #7DBBE8;
      --ctx-blue-soft: #14283A;
      --ctx-blue-line: #2E5878;
      --ctx-orange: #E8B040;
      --ctx-orange-ink: #F0C060;
      --ctx-orange-soft: #33260F;
      --ctx-orange-line: #6E5222;
      --ctx-green: #3CC497;
      --ctx-green-ink: #62D1AC;
      --ctx-green-soft: #10302A;
      --ctx-green-line: #2A6A55;
      --ctx-red: #E8796E;
      --ctx-red-ink: #F09A90;
      --ctx-red-soft: #3A1A18;
      --ctx-red-line: #7A3A34;
      --ctx-purple: #D58CC4;
      --ctx-purple-ink: #E2A6D3;
      --ctx-purple-soft: #331F2E;
      --ctx-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--ctx-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ctx-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--ctx-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--ctx-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--ctx-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--ctx-surface); stroke: var(--ctx-rule); stroke-width: 1; }
  .card { fill: var(--ctx-neutral-soft); stroke: var(--ctx-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--ctx-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--ctx-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--ctx-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--ctx-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--ctx-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--ctx-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-border { fill: var(--ctx-border); }
  .s-border { stroke: var(--ctx-border); }
  .s-grid { stroke: var(--ctx-grid); }
  .s-ink-muted { stroke: var(--ctx-ink-muted); }
  .w075 { stroke-width: 0.75; }
</style>
<defs>
<marker id="ctx-03-latency-split-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="533">Decode outlasts prefill at every model class</text>
<text x="40" y="76" class="t-subtitle" data-w="646">One call of 10,500 input and 400 output tokens; per-token rates illustrative, not measured.</text>
<rect x="40" y="116" width="16" height="16" class="s-ink-muted w15 nofill d-proj"/>
<text x="72" y="128" class="t-label" data-w="254">prefill: reads the 10,500-token prompt</text>
<rect x="368" y="116" width="16" height="16" class="f-border s-border w1"/>
<text x="400" y="128" class="t-label" data-w="247">decode: writes the 400-token answer</text>
<g data-grid="skip">
<path d="M216,160 L216,408" class="s-grid w075 nofill"/>
<text x="216" y="428" text-anchor="middle" class="t-tick" data-w="8">0</text>
<path d="M346,160 L346,408" class="s-grid w075 nofill"/>
<text x="346" y="428" text-anchor="middle" class="t-tick" data-w="8">5</text>
<path d="M476,160 L476,408" class="s-grid w075 nofill"/>
<text x="476" y="428" text-anchor="middle" class="t-tick" data-w="16">10</text>
<path d="M606,160 L606,408" class="s-grid w075 nofill"/>
<text x="606" y="428" text-anchor="middle" class="t-tick" data-w="16">15</text>
<path d="M736,160 L736,408" class="s-grid w075 nofill"/>
<text x="736" y="428" text-anchor="middle" class="t-tick" data-w="16">20</text>
<rect x="243.3" y="168" width="83.2" height="40" class="f-border" data-fit="skip"/>
<rect x="216" y="168" width="27.3" height="40" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
<rect x="243.3" y="168" width="83.2" height="40" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
<text x="40" y="186" class="t-label" data-w="137">cheap, ms per token</text>
<text x="40" y="204" class="t-note" data-w="132">prefill 0.1, decode 8</text>
<text x="338.5" y="194" class="t-value" data-w="138">1.05 + 3.20 = 4.25 s</text>
<rect x="270.6" y="256" width="166.4" height="40" class="f-border" data-fit="skip"/>
<rect x="216" y="256" width="54.6" height="40" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
<rect x="270.6" y="256" width="166.4" height="40" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
<text x="40" y="274" class="t-label" data-w="121">mid, ms per token</text>
<text x="40" y="292" class="t-note" data-w="140">prefill 0.2, decode 16</text>
<text x="449" y="282" class="t-value" data-w="138">2.10 + 6.40 = 8.50 s</text>
<rect x="325.2" y="344" width="332.8" height="40" class="f-border" data-fit="skip"/>
<rect x="216" y="344" width="109.2" height="40" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
<rect x="325.2" y="344" width="332.8" height="40" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
<text x="40" y="362" class="t-label" data-w="145">frontier, ms per token</text>
<text x="40" y="380" class="t-note" data-w="140">prefill 0.4, decode 32</text>
<text x="670" y="370" class="t-value" data-w="155">4.20 + 12.80 = 17.00 s</text>
<path d="M216,160 L216,408" class="s-ink-muted w1 nofill"/>
</g>
<text x="476" y="452" text-anchor="middle" class="t-note" data-w="56">seconds</text>
<text x="40" y="504" class="t-note" data-w="596">The prompt is 26 times longer than the answer, yet the answer takes three times as long.</text>
</svg>
