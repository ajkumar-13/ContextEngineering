<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-04-layer-shares-title" aria-describedby="ctx-04-layer-shares-desc">
<title id="ctx-04-layer-shares-title">The agent breaks the defaults of layers 01 to 03</title>
<desc id="ctx-04-layer-shares-desc">One row per layer on a percent axis from 0 to 40. A dashed band in the layer's colour shows its default share of the input budget, and a mark shows the support agent's share of its 10,500 input tokens. Outside the band, as red diamonds: 01 System prompt 28.6 percent against 5 to 15, 02 Tools and MCP descriptions 15.2 against 5 to 15, 03 Memory and state 11.4 against 5 to 10. Inside, as circles: 04 Retrieved chunks 23.8 against 20 to 40, 05 Conversation history 19.0 against 10 to 30, 06 User instruction 1.9 against 1 to 5.</desc>
<style>
