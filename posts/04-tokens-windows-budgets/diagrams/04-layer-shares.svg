      --ctx-grid: rgba(241, 238, 232, 0.08);
      --ctx-rule: #6A6D74;
      --ctx-arrow: #9A9A94;
      --ctx-neutral-soft: #1C1E23;
      --ctx-blue: #5AA8E0;
      --ctx-blue-ink: #7DBBE8;
