<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="597">The log stays on disk; five fields reach the model</text>
<text x="40" y="76" class="t-subtitle" data-w="712">One sandboxed run of a stand-in install. Lines and tokens (o200k_base) from snippets/sandbox.py.</text>
<rect x="40" y="120" width="552" height="208" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="120" width="552" height="208" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="152" class="t-head" data-w="245">Child process: stand-in install</text>
<text x="56" y="176" class="t-code13" xml:space="preserve" data-w="429">fetch  pkg-000@1.0.0  resolved from the registry cache</text>
<text x="56" y="200" class="t-code13" data-w="357">warn deprecated pkg-000@1.0.0: upgrade to 2.x</text>
<text x="56" y="224" class="t-code13" xml:space="preserve" data-w="429">fetch  pkg-001@1.1.1  resolved from the registry cache</text>
<text x="56" y="248" class="t-code13" xml:space="preserve" data-w="429">fetch  pkg-002@1.2.2  resolved from the registry cache</text>
<text x="56" y="272" class="t-code13" data-w="175">... 128 more lines ...</text>
<text x="56" y="296" class="t-code13" data-w="191">added 120 packages in 8s</text>
<rect x="656" y="120" width="264" height="96" rx="8" class="f-neutral-soft" data-fit="skip"/>
