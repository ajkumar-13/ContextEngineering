<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-sandbox-wrapper-title" aria-describedby="ctx-03-sandbox-wrapper-desc">
<title id="ctx-03-sandbox-wrapper-title">The log stays on disk; five fields reach the model</title>
<desc id="ctx-03-sandbox-wrapper-desc">A child process running a stand-in install command prints a log of 133 lines and 2,385 tokens; its first four lines and its last line are shown. The whole log goes to install.log on disk. A wrapper reads the run and passes five fields to the model's window: ok true, exit_code 0, warnings 12, the summary line and the log file name, 38 tokens, 63 times fewer than the full log.</desc>
