<rect x="656" y="272" width="264" height="56" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="656" y="272" width="264" height="56" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="672" y="304" class="t-label" data-w="59">wrapper:</text>
<text x="736" y="304" class="t-code" data-w="112">run_sandboxed</text>
<path d="M788,216 L788,269" class="flow" marker-end="url(#ctx-03-sandbox-wrapper-arrow)"/>
<rect x="40" y="376" width="552" height="96" rx="8" class="f-green-soft" data-fit="skip"/>
<rect x="40" y="376" width="552" height="96" rx="8" class="w1 nofill s-green-line" data-fit="skip"/>
<text x="56" y="408" class="t-head" data-w="289">Into the model's window: 38 tokens</text>
<text x="56" y="432" class="t-code13" data-w="349">{"ok": true, "exit_code": 0, "warnings": 12,</text>
<text x="72" y="456" class="t-code13" data-w="476">"summary": "added 120 packages in 8s", "log": "install.log"}</text>
<path d="M788,328 L788,424 L595,424" class="flow" marker-end="url(#ctx-03-sandbox-wrapper-arrow)"/>
<text x="776" y="364" text-anchor="end" class="t-note" data-w="147">63 times fewer tokens</text>
<text x="40" y="504" class="t-note" data-w="551">For the model the rest of the output does not exist; for a human it is one file away.</text>
