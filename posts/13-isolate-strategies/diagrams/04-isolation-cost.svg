<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-04-isolation-cost-title" aria-describedby="ctx-04-isolation-cost-desc">
<title id="ctx-04-isolation-cost-title">Isolation adds tokens to one shot and saves them in a loop</title>
<desc id="ctx-04-isolation-cost-desc">Two panels of horizontal bars of input tokens, illustrative sizes. One shot, five 8,000-token documents and no tool calls: one agent reads 42,000 tokens; the orchestrator and workers read 57,000, 50,000 in the five workers and 7,000 in the merge call; 0.1410 against 0.2610 dollars. Agent loop, four tool calls per piece returning 2,000 tokens each: one agent reads 483,000 tokens; the orchestrator and workers read 173,000, 155,000 in the workers and 18,000 in the orchestrator; 1.4940 against 0.5940 dollars.</desc>
