<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-three-topologies-title" aria-describedby="ctx-02-three-topologies-desc">
<title id="ctx-02-three-topologies-title">Only the supervisor lets the model pick the next step</title>
<desc id="ctx-02-three-topologies-desc">Three panels of neutral boxes. Sequential pipeline: A parse, B analyse and C format in a chain, each output the next input; risk, the latency adds up. Fan-out and fan-in: a parent sends the same kind of task to workers 1, 2 and N in parallel, and a merge step combines their results; risk, the merge step. Supervisor and workers: a supervisor exchanges calls and results with three workers in a loop; risk, it does the work itself. The first two are marked as workflows, control flow in code; the supervisor as the next step chosen by the model.</desc>
