<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-subagent-isolation-title" aria-describedby="ctx-01-subagent-isolation-desc">
<title id="ctx-01-subagent-isolation-title">Only the structured result crosses back to the parent</title>
<desc id="ctx-01-subagent-isolation-desc">Two context windows drawn as lists of messages with their token counts. The parent window, on the left, holds a system prompt and the user question, 26 tokens before the call. A typed task goes right to a worker window, which holds its own system prompt, the task, three run_tests calls and three verbose test logs, and a JSON reply: 9 messages and 1418 tokens. Only the validated result returns to the parent, which grows by 33 tokens to 59; none of the 85 log lines reaches it.</desc>
