<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-00-hero-modern-agentic-workflow-title" aria-describedby="ctx-00-hero-modern-agentic-workflow-desc">
<title id="ctx-00-hero-modern-agentic-workflow-title">The repository configures the window</title>
<desc id="ctx-00-hero-modern-agentic-workflow-desc">Left, five files of a repository in Claude Code's names. Right, the six-layer window, 01 System prompt at the top to 06 User instruction at the bottom. AGENTS.md or CLAUDE.md is selected into layer 01 every session. The skills' SKILL.md files reach layer 01 as descriptions, with each body loaded on demand. The MCP servers in .mcp.json reach layer 02 through tool search. Sub-agent definitions start a separate sub-agent window, which returns only a summary to layer 05. Hook settings run hooks as code outside the window; only their messages reach layer 05. Layer 05 is marked compress, for compaction.</desc>
