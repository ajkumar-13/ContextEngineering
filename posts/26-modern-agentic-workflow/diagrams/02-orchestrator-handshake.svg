<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-orchestrator-handshake-title" aria-describedby="ctx-02-orchestrator-handshake-desc">
<title id="ctx-02-orchestrator-handshake-title">The parent sees the brief and the summary, nothing else</title>
<desc id="ctx-02-orchestrator-handshake-desc">Two lanes, the parent's window above and the sub-agent's window below, across four steps. Step 1, parent: frame the task and the shape of the result. Step 2, parent: spawn with a fresh window, scoped tools and a turn cap. Step 3, sub-agent: its own loop in isolation, drawn as read, search, run tests, read log and edit, none of which reaches the parent. Step 4, parent: fold in the summary only. Arrows: the brief from step 2 down to step 3, the summary from step 3 up to step 4. The caption says to review sub-agent transcripts on a sample, because a summary can hide a skipped test.</desc>
<style>
