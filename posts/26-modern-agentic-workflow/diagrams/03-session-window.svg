<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-session-window-title" aria-describedby="ctx-03-session-window-desc">
<title id="ctx-03-session-window-title">Without compaction, every call reads more</title>
<desc id="ctx-03-session-window-desc">A line chart of the window in tokens at each of 120 model calls of one illustrative session. Without compaction, in red, the window climbs in a straight line from 18,000 to 315,500 tokens. With compaction at 100,000 tokens, in ink, it climbs to 95,500, falls back to 23,000 and climbs again, three times. A dotted line marks the 100,000-token limit. The caption gives the session's input: 20,010,000 tokens without compaction and 7,254,000 with it. Values computed by snippets/session_cost.py.</desc>
