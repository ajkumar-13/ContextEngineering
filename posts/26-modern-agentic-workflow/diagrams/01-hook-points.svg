<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">The hook points in an agent loop, and what each is for</title>
  <desc id="d">A hand-drawn table of seven hook points with what teams attach to each and why it is a hook rather than a rule in the project prompt. Pre-tool-call validates arguments and rejects dangerous combinations, because a rule is followed most of the time and a hook every time. Post-tool-call formats output, clips noisy logs, and records a trace span, because clipping in the prompt asks the model to ignore tokens already paid for. Pre-edit checks the target is not generated or vendored. Post-edit runs the formatter and the relevant test and surfaces failures back to the agent, so it self-corrects unprompted. Pre-commit runs the linter and typechecker and blocks on either, because gates belong in code. Session-start loads state and pins a goal. Session-end compresses, journals, and archives. A caption states that security controls enforce here rather than in the prompt.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="480"/>
<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">Hooks are where a team's culture actually gets enforced</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">A script fires on an event in the loop and can inspect, modify, or block what happens next.</text><text xml:space="preserve" x="40" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Hook point</text><text xml:space="preserve" x="214" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">What teams attach to it</text><text xml:space="preserve" x="560" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Why not a rule in AGENTS.md</text><path d="M39.57 109.94C40.75 118.78 39.97 127.91 40.93 149.86M39.78 109.84C40.35 121.12 40.13 131.09 40.43 149.47" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="131.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Pre-tool-call</text><text xml:space="preserve" x="214" y="121.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Validate the arguments; reject dangerous combinations,</text><text xml:space="preserve" x="214" y="133.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">such as a delete on a path outside the project.</text><text xml:space="preserve" x="560" y="121.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">A rule is followed most of the time. A hook is followed every</text><text xml:space="preserve" x="560" y="133.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">time.</text><path d="M41.17 159.95C40.7 174.84 41.14 188.88 39.79 199.63M40.31 159.5C40.63 168.06 40.69 176.36 40.47 199.58" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="181.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Post-tool-call</text><text xml:space="preserve" x="214" y="171.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Format the output, clip noisy logs down to what matters,</text><text xml:space="preserve" x="214" y="183.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">record a structured trace span.</text><text xml:space="preserve" x="560" y="171.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Clipping in the prompt asks the model to ignore tokens it has</text><text xml:space="preserve" x="560" y="183.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">already paid for.</text><path d="M40.38 209.96C40.11 222.91 39.39 233.85 41.04 249.4M39.63 210.35C40.38 224.21 39.52 237.64 40.51 249.7" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="231.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Pre-edit</text><text xml:space="preserve" x="214" y="221.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Check the target is not in a generated or vendored</text><text xml:space="preserve" x="214" y="233.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">directory.</text><text xml:space="preserve" x="560" y="221.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The agent cannot reliably know which paths are off-limits from</text><text xml:space="preserve" x="560" y="233.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">prose.</text><path d="M39.59 259.97C40.06 270.97 40.56 278.82 39.9 299.17M40.15 260.01C40.66 271.16 40.07 282.92 40.55 299.82" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="281.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Post-edit</text><text xml:space="preserve" x="214" y="271.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Run the formatter and the relevant test; surface either</text><text xml:space="preserve" x="214" y="283.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">failure back to the agent.</text><text xml:space="preserve" x="560" y="271.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The failure lands in context on the next turn, so it</text><text xml:space="preserve" x="560" y="283.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">self-corrects unprompted.</text><path d="M41.19 309.97C39.47 324.63 38.8 342.19 41.16 348.95M39.47 309.66C40.41 319.31 40.1 329.4 40.59 349.94" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="331.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Pre-commit</text><text xml:space="preserve" x="214" y="321.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Run the linter and the typechecker; block on either.</text><text xml:space="preserve" x="560" y="321.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">This is a gate, and gates belong in code.</text><path d="M40.4 359.98C39.42 372.7 39.97 387.16 40.02 401.12M39.99 360.52C39.48 375.45 39.46 390.68 39.43 400.05" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="381.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Session-start</text><text xml:space="preserve" x="214" y="371.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Print the day's task, load project status, pin a goal</text><text xml:space="preserve" x="214" y="383.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">cell into memory.</text><text xml:space="preserve" x="560" y="371.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Loading state is an action, not an instruction.</text><path d="M39.6 409.99C38.84 420.76 40.61 432.13 38.87 450.89M40.51 410.17C39.76 422.4 40.02 435.96 39.46 450.17" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="431.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Session-end</text><text xml:space="preserve" x="214" y="421.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Compress the conversation, write a summary to a journal,</text><text xml:space="preserve" x="214" y="433.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">archive the trace.</text><text xml:space="preserve" x="560" y="421.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The agent will not reliably remember to do housekeeping.</text><text xml:space="preserve" x="40" y="477.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Security controls enforce here, not in the prompt: &quot;do not let the agent overwrite production config&quot; is a hook, not a rule in AGENTS.md.</text>
</svg>
