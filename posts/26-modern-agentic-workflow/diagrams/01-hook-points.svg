<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-hook-points-title" aria-describedby="ctx-01-hook-points-desc">
<title id="ctx-01-hook-points-title">Only a hook in front of an action can stop it</title>
<desc id="ctx-01-hook-points-desc">The agent loop left to right: session start, user prompt, then a loop of a model call and the tool it runs, with the tool call going right and the result coming back, then session end. Hook events attached by dashed leaders. Above, emphasised: UserPromptSubmit, which can block the prompt, and PreToolUse, on the tool call, which can block the call. Below: SessionStart, whose output enters the context; PreCompact, on the model call, emphasised, which can block compaction; PostToolUse, on the result, which reports to the model after the tool has run; SessionEnd, which cannot block. A note says exit code 2 blocks where the event can block and any other non-zero code does not.</desc>
<style>
