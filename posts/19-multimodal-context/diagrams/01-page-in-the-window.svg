<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-page-in-the-window-title" aria-describedby="ctx-01-page-in-the-window-desc">
<title id="ctx-01-page-in-the-window-title">A page image is 1,551 tokens in the same window</title>
<desc id="ctx-01-page-in-the-window-desc">On the left, the six layers of post 04's support agent as bars drawn to one scale with dashed outlines, because the sizes are illustrative: 01 System prompt 3,000 tokens, 02 Tools and MCP descriptions 1,600, 03 Memory and state 1,200, 04 Retrieved chunks 2,500 of text, 05 Conversation history 2,000, 06 User instruction 200. On the right, an A4 page scanned at 130 dpi, 1,075 by 1,520 pixels, resized to 924 by 1,307 and cut into a grid of 33 by 47 patches of 28 by 28 pixels, one token each, 1,551 tokens. An arrow carries the page into layer 04, where a solid segment of 1,551 tokens follows the 2,500 tokens of text. The input of the call grows from 10,500 to 12,051 tokens.</desc>
