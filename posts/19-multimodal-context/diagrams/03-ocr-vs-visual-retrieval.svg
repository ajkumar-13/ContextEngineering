</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="417">OCR first, or retrieve on the pixels</text>
<text x="40" y="76" class="t-subtitle" data-w="490">Values cited from Faysse et al., ColPali (ICLR 2025), Tables 2 and 4.</text>
<text x="40" y="136" class="t-head" data-w="162">OCR, then text RAG</text>
<rect x="40" y="152" width="160" height="88" rx="8" class="card"/>
<text x="56" y="184" class="t-head" data-w="95">Page image</text>
<text x="56" y="216" class="t-note" data-w="39">pixels</text>
<rect x="220" y="152" width="160" height="88" rx="8" class="card"/>
<text x="236" y="184" class="t-head" data-w="122">OCR and parse</text>
<text x="236" y="216" class="t-note" data-w="58">text only</text>
<rect x="400" y="152" width="160" height="88" rx="8" class="card"/>
<text x="416" y="184" class="t-head" data-w="53">Chunk</text>
<text x="416" y="216" class="t-note" data-w="77">text chunks</text>
<rect x="580" y="152" width="160" height="88" rx="8" class="card"/>
<text x="596" y="184" class="t-head" data-w="112">Embed, score</text>
<text x="596" y="216" class="t-note" data-w="127">one vector a chunk</text>
<rect x="760" y="152" width="160" height="88" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="776" y="184" class="t-head" data-w="111">Top-k chunks</text>
<text x="776" y="216" class="t-note" data-w="83">into layer 04</text>
<path d="M200,196 L217,196" class="flow" marker-end="url(#ctx-03-ocr-vs-visual-retrieval-arrow)"/>
<path d="M380,196 L397,196" class="flow" marker-end="url(#ctx-03-ocr-vs-visual-retrieval-arrow)"/>
<path d="M560,196 L577,196" class="flow" marker-end="url(#ctx-03-ocr-vs-visual-retrieval-arrow)"/>
<path d="M740,196 L757,196" class="flow" marker-end="url(#ctx-03-ocr-vs-visual-retrieval-arrow)"/>
<text x="220" y="268" class="t-note f-red-ink" data-w="174">layout and charts are lost,</text>
<text x="220" y="288" class="t-note f-red-ink" data-w="167">misread characters enter</text>
<text x="40" y="344" class="t-head" data-w="196">Visual retrieval (ColPali)</text>
<rect x="40" y="360" width="160" height="88" rx="8" class="card"/>
<text x="56" y="392" class="t-head" data-w="95">Page image</text>
<text x="56" y="424" class="t-note" data-w="39">pixels</text>
<rect x="220" y="360" width="340" height="88" rx="8" class="card"/>
<text x="236" y="392" class="t-head" data-w="157">Embed the patches</text>
<text x="236" y="424" class="t-note" data-w="187">one vector a patch, no OCR</text>
<rect x="580" y="360" width="160" height="88" rx="8" class="card"/>
<text x="596" y="392" class="t-head" data-w="67">MaxSim</text>
<text x="596" y="424" class="t-note" data-w="148">query tokens, patches</text>
<rect x="760" y="360" width="160" height="88" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="776" y="392" class="t-head" data-w="101">Top-k pages</text>
<text x="776" y="424" class="t-note" data-w="83">into layer 04</text>
<path d="M200,404 L217,404" class="flow" marker-end="url(#ctx-03-ocr-vs-visual-retrieval-arrow)"/>
<path d="M560,404 L577,404" class="flow" marker-end="url(#ctx-03-ocr-vs-visual-retrieval-arrow)"/>
<path d="M740,404 L757,404" class="flow" marker-end="url(#ctx-03-ocr-vs-visual-retrieval-arrow)"/>
<text x="40" y="504" class="t-head" data-w="169">Cited from the paper</text>
<rect x="40" y="520" width="320" height="32" class="nofill"/>
<rect x="360" y="520" width="240" height="32" class="nofill"/>
<rect x="600" y="520" width="200" height="32" class="nofill"/>
<rect x="40" y="552" width="320" height="32" class="nofill"/>
<rect x="360" y="552" width="240" height="32" class="nofill"/>
<rect x="600" y="552" width="200" height="32" class="nofill"/>
<rect x="40" y="584" width="320" height="32" class="nofill"/>
<rect x="360" y="584" width="240" height="32" class="nofill"/>
<rect x="600" y="584" width="200" height="32" class="nofill"/>
<path d="M40,520H800M40,616H800" class="axis"/>
<path d="M40,552H800" class="rule1"/>
<text x="48" y="540" class="t-head" data-w="49">Route</text>
<text x="592" y="540" text-anchor="end" class="t-head" data-w="237">nDCG@5, average on ViDoRe</text>
<text x="792" y="540" text-anchor="end" class="t-head" data-w="130">Embedding size</text>
<text x="48" y="572" class="t-label" data-w="216">OCR text, BGE-M3 embeddings</text>
<text x="592" y="572" text-anchor="end" class="t-label" data-w="29">66.1</text>
<text x="792" y="572" text-anchor="end" class="t-label" data-w="111">8.60 KB a vector</text>
<text x="48" y="604" class="t-label" data-w="147">ColPali, patch vectors</text>
<text x="592" y="604" text-anchor="end" class="t-label" data-w="29">81.3</text>
<text x="792" y="604" text-anchor="end" class="t-label" data-w="111">257.5 KB a page</text>
<text x="40" y="684" class="t-note" data-w="527">The visual route keeps the layout that OCR drops, and pays for it in index size.</text>
</svg>
