<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-03-ocr-vs-visual-retrieval-title" aria-describedby="ctx-03-ocr-vs-visual-retrieval-desc">
<title id="ctx-03-ocr-vs-visual-retrieval-title">OCR first, or retrieve on the pixels</title>
<desc id="ctx-03-ocr-vs-visual-retrieval-desc">Two pipelines from left to right. OCR then text RAG: page image, OCR and parse (where layout and charts are lost and misread characters enter, marked in red), chunk the text, embed one vector per chunk and score, top-k chunks into layer 04. Visual retrieval with ColPali: page image, embed the patches with one vector per patch and no OCR, score with MaxSim between query tokens and patches, top-k pages into layer 04. A table of cited values from the ColPali paper: average nDCG@5 on ViDoRe is 66.1 for OCR text with BGE-M3 and 81.3 for ColPali; an embedding takes 8.60 KB a vector with BGE-M3 and 257.5 KB a page with ColPali.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
