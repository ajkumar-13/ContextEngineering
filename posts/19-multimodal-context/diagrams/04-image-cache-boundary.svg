<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-04-image-cache-boundary-title" aria-describedby="ctx-04-image-cache-boundary-desc">
<title id="ctx-04-image-cache-boundary-title">Stable pixels before the breakpoint, live pixels after</title>
<desc id="ctx-04-image-cache-boundary-desc">Two layouts of one call of a computer-use agent, drawn as strips of seven entries with cache breakpoints after layer 02 and after a reference page image. Top: this turn's screenshot sits in layer 03, before the reference page; it changes every call, so only 01 System prompt and 02 Tools and MCP descriptions are read from the cache, and the reference page is processed again every call, marked in red. Bottom: the reference page follows layer 02 and the live screenshot travels with 06 User instruction, last; 01, 02 and the reference page are read from the cache, and 03 to 06 are new on every call.</desc>
