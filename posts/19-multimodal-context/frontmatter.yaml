outcomes:
  - id: o1
    text: "Estimate how many tokens an image or a rendered page adds to a call from its pixel size, with the provider's published patch or tile rule."
  - id: o2
    text: "Decide, per document or per page, whether to send pixels or extracted text, from whether the layout carries meaning and what each route costs."
  - id: o3
    text: "Choose between visual retrieval and OCR-then-text RAG for a page-image corpus, and name what each keeps, loses and costs."
  - id: o4
    text: "Lay out a multimodal request so that stable images stay in the cached prefix and per-turn screenshots are downscaled, sent last and pruned in batches."
