<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-capstone-email-reply-agent-title" aria-describedby="ctx-00-hero-capstone-email-reply-agent-desc">
<title id="ctx-00-hero-capstone-email-reply-agent-title">The agent drafts; a person and a gate decide what is sent</title>
<desc id="ctx-00-hero-capstone-email-reply-agent-desc">A pipeline. A mailbox, the fake mailbox on disk in the companion or the Gmail driver as a live step, feeds the triager, which sorts each thread into four buckets with no tools; info_only, promotional and automated threads get no draft. reply_needed threads go to the drafter, which reads three stores: the system prompt file for layer 01, the memory store for layer 03 and the prior replies index for layer 04, and writes a draft. The draft goes to human review, a live step; approved drafts go to the send gate in code and then to send, a live step; a blocked draft goes back to review with its reason. Solid outlines are in the companion, dashed outlines are live steps.</desc>
