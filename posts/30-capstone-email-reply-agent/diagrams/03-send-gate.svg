<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-03-send-gate-title" aria-describedby="ctx-03-send-gate-desc">
<title id="ctx-03-send-gate-title">Three patterns block what they match, and only that</title>
<desc id="ctx-03-send-gate-desc">Left, the companion's three checks in order: a URL allow-list of the operator's known_urls only; no money term (a currency sign or code with digits) unless the thread has one; times written as hours and minutes from 09:00 to before 18:00. Right, nine drafts from the post's snippet. The gate passes the clean reply at 14:00 IST and blocks a new docs.example link, a new $5,000 fee, 21:30 IST and the injected email's own link, all right. It passes 9 pm IST, five thousand dollars, a 30-minute call at 17:45 IST and $50,000 in a thread that mentions $500, four harmful drafts marked missed in red.</desc>
