<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">The nine context-engineering layers the capstone exercises</title>
  <desc id="d">A hand-drawn table of the nine layers this build touches, each with what it does here and where the series covers it. The system prompt carries identity, rules, and format, including a rule that the agent never sends. Tools are read, draft, and send, typed and narrowly scoped with the dangerous one gated. Memory holds what was said to this recipient before and the user's stylistic preferences. Retrieval selects prior replies on similar topics for tone transfer. Compression summarises long threads before drafting. Isolation puts the &quot;should this get a reply&quot; decision in a sub-agent, separate from drafting. Observability gives one trace per thread and an audit row per send. Security puts the send-email guard in code, because it is the most dangerous tool in an inbox. Evaluation uses held-out replies as ground truth with an LLM judge for tone fidelity.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="500"/>
<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">Every lever in the series, in one build</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">This is the capstone's actual claim: nine layers, each present because not having it bites in production.</text><text xml:space="preserve" x="40" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Layer</text><text xml:space="preserve" x="224" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">What it does here</text><text xml:space="preserve" x="700" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Covered in</text><path d="M39.57 109.94C40.78 116.6 40 123.55 40.93 139.86M39.78 109.84C40.35 118.46 40.13 125.77 40.43 139.47" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="127.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">System prompt</text><text xml:space="preserve" x="224" y="125.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Identity, rules, format. &quot;You never send&quot; is a rule the gate then enforces.</text><text xml:space="preserve" x="700" y="125.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 14</text><path d="M40.23 144.99C357.35 145.06 674.68 144.99 919.96 144.93M40.06 144.9C223.31 144.61 406.54 144.61 920.09 144.92" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.38 149.35C39.14 163 39.89 174.3 40.7 180.17M40.44 149.71C39.83 158.96 39.96 168.21 39.88 179.91" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="167.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Tools</text><text xml:space="preserve" x="224" y="165.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Read, draft, send — typed, narrowly scoped, with the dangerous one gated.</text><text xml:space="preserve" x="700" y="165.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 15</text><path d="M39.92 184.87C337.68 185.74 635.96 185.95 919.91 184.99M39.95 185.11C247.98 186.2 456.06 186.17 919.98 185.01" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.18 191.16C40.29 201 40.17 213.05 40.47 220.49M39.89 189.58C40.51 199.47 39.79 209.44 40.53 220.36" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="207.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Memory</text><text xml:space="preserve" x="224" y="205.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">What was said to this recipient before, and the user's stylistic preferences.</text><text xml:space="preserve" x="700" y="205.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 16</text><path d="M40.08 225.23C318.48 224.58 597.23 224.59 919.87 225.05M40.08 225.09C272.89 225.22 505.59 225.17 920.11 225.1" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.59 230.57C41.04 241.4 40.06 251.8 40.24 260.8M40.54 229.45C40 239.97 39.62 250.68 39.98 259.61" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="247.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Retrieval</text><text xml:space="preserve" x="224" y="245.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Prior replies on similar topics, selected for tone transfer.</text><text xml:space="preserve" x="700" y="245.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Posts 09, 11</text><path d="M40.24 265.12C299.29 265.27 558.5 265.56 919.82 265.11M39.97 265.06C297.57 264.24 555.11 264.16 920 264.94" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.4 269.98C39.39 279.4 39.94 290.55 40.02 301.12M39.99 270.52C39.48 281.67 39.45 293.11 39.43 300.05" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="287.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Compression</text><text xml:space="preserve" x="224" y="285.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Long threads are summarised before drafting, or the budget goes to quoting.</text><text xml:space="preserve" x="700" y="285.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 12</text><path d="M39.92 305C279.61 304.11 519.78 304.2 919.77 305.18M40.1 305.03C322.24 305.58 604.63 305.72 919.89 305.03" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M38.81 309.39C40.14 319.8 39.83 329.31 39.79 339.03M39.44 310.39C40.16 316.17 40.48 322.35 40.07 340.5" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="327.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Isolation</text><text xml:space="preserve" x="224" y="325.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">&quot;Should this get a reply?&quot; is a different task from &quot;draft it&quot;, so a sub-agent</text><text xml:space="preserve" x="224" y="337.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">does the first.</text><text xml:space="preserve" x="700" y="325.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 13</text><path d="M40.08 344.88C260.41 345.27 481.05 345.16 920.21 344.76M39.99 345.01C347.15 344.84 654.15 344.72 920.02 344.88" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.61 348.8C40.9 357.8 39.72 368.06 39.56 379.35M40.1 350.26C39.64 356.68 40.31 363.58 39.52 379.75" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="367.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Observability</text><text xml:space="preserve" x="224" y="365.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">One trace per thread; every send is an audit row.</text><text xml:space="preserve" x="700" y="365.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 22</text><path d="M39.76 384.76C241.22 385.95 442.32 386.13 920.16 384.82M39.88 384.98C371.83 383.86 703.67 383.96 919.91 384.97" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.42 390.61C39.25 398.2 39.6 406.81 39.33 419.66M39.55 390.13C40.32 398.38 40.14 406.02 40.17 420.19" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="407.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Security</text><text xml:space="preserve" x="224" y="405.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">send_email is the most dangerous tool in an inbox, so it is the one in code.</text><text xml:space="preserve" x="700" y="405.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 23</text><path d="M39.93 425.12C221.54 424.79 403.6 424.77 920.12 424.89M40.01 424.96C220.74 425.2 401.44 425.28 920.04 425.06" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M38.83 430.02C40 436.19 39.49 445.56 39.1 459.97M40.2 430C39.8 438.88 39.97 447.25 39.62 459.44" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="447.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Evaluation</text><text xml:space="preserve" x="224" y="445.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Held-out replies as ground truth; an LLM judge for tone fidelity.</text><text xml:space="preserve" x="700" y="445.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Post 20</text><text xml:space="preserve" x="40" y="491.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">A capstone that hits all nine is also realistic, which is the point: every box is there because not having it bites in production.</text>
</svg>
