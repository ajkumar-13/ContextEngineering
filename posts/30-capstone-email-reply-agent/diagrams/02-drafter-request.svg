<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-drafter-request-title" aria-describedby="ctx-02-drafter-request-desc">
<title id="ctx-02-drafter-request-title">The drafter reads 601 tokens, not the mailbox</title>
<desc id="ctx-02-drafter-request-desc">Six horizontal bars, one per layer, of the tokens in the drafter's request for thread t-001 as the companion assembles it, counted with tiktoken o200k_base: 01 System prompt 313, 02 Tools and MCP descriptions 0 because the skeleton's drafter has no tools, 03 Memory and state 62, 04 Retrieved chunks 144, 05 Conversation history 72, 06 User instruction 10; 601 in all. A bracket marks 01 as the system message of 313 tokens and 03 to 06 as one user message of 289 tokens.</desc>
