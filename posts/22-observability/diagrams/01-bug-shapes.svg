<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">Four common bug shapes as they appear in a trace</title>
  <desc id="d">A hand-drawn field guide of four rows, each pairing what the trace shows with what the prompt reveals on drilling in and where the fix belongs. Context bloat shows as an LLM span carrying eighty thousand input tokens, of which history holds sixty thousand because tool results were never cleared; the fix is the compression policy. A retrieval miss shows the right chunks returned with high scores and a wrong fact still cited, because the chunks were packed into the middle where attention is weakest; the fix is bookend packing. A tool storm shows fifteen calls to the same search tool with slightly different queries, because the descriptions are near-identical and the model is brute-forcing; the fix is tool selection or name disambiguation. A silent regression shows cost and quality both dropping the same week, because a cleanup pull request removed an instruction the model relied on; the fix is a revert plus a fixture. A caption notes that not instrumenting means paying engineering time to reconstruct what was already visible.</desc>

  <style><![CDATA[
    :root{--ctx-bg:#FAFAF7;--ctx-surface:#FFFFFF;--ctx-ink:#1A1A1A;--ctx-ink-muted:#5C5C5C;--ctx-ink-subtle:#9A9A9A;--ctx-border:#D9D9D4;--ctx-primary:#5B7FBF;--ctx-accent:#D98E5F;--ctx-success:#5C9E78;--ctx-warn:#B8895A;--ctx-alert:#C66B5E;--ctx-neutral-1:#EAEAE4;--ctx-neutral-2:#CFCFC8;--ctx-neutral-3:#8E8E88;--ctx-on-fill:#FFFDF9;--ctx-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ctx-bg:#0E0F12;--ctx-surface:#16181C;--ctx-ink:#F2F2EE;--ctx-ink-muted:#B4B4AE;--ctx-ink-subtle:#6E6E68;--ctx-border:#2A2D33;--ctx-primary:#8BA8E0;--ctx-accent:#E8B088;--ctx-success:#7FBF9B;--ctx-warn:#D4B58A;--ctx-alert:#D88880;--ctx-neutral-1:#1F2229;--ctx-neutral-2:#2C3038;--ctx-neutral-3:#6E6E68;--ctx-on-fill:#14161A;--ctx-on-accent:#1A1A1A;}}
    .bg{fill:var(--ctx-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="500"/>
<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ctx-ink)">Four bug shapes, as they look in a trace</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ctx-ink-muted)">Most LLM bugs are visible in the trace once the right things are instrumented. Not one of these is fixed in the model.</text><text xml:space="preserve" x="40" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-subtle)">Shape</text><text xml:space="preserve" x="232" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-subtle)">What the trace shows</text><text xml:space="preserve" x="500" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-subtle)">What the prompt shows when you drill in</text><text xml:space="preserve" x="736" y="97.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-subtle)">Where the fix lives</text><path d="M41.17 115.34C39.74 136.03 39.26 155.52 39.44 192.4M39.91 116.06C39.36 142.4 39.21 168.9 39.84 191.79" fill="none" stroke="var(--ctx-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="131.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ctx-ink)">Context bloat</text><text xml:space="preserve" x="232" y="129.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">The LLM span carries 80 000 input tokens.</text><text xml:space="preserve" x="500" y="129.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">History holds 60 000 of them: tool</text><text xml:space="preserve" x="500" y="141.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">results were never cleared, and a</text><text xml:space="preserve" x="500" y="154.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">forty-turn session accumulated.</text><text xml:space="preserve" x="736" y="129.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">The compression policy. Post</text><text xml:space="preserve" x="736" y="141.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">12, section 4.</text><path d="M39.92 199.23C243.98 199.24 447.61 199.56 919.84 199.14M40.11 198.99C374.02 199.34 707.76 199.28 920.1 199.05" fill="none" stroke="var(--ctx-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.18 208.56C39.5 228.41 40.86 247.75 40.13 282.86M39.5 208.14C40.07 227.92 40.34 248.21 39.9 284.57" fill="none" stroke="var(--ctx-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="223.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ctx-ink)">Retrieval miss</text><text xml:space="preserve" x="232" y="221.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">The retrieval span returned the right</text><text xml:space="preserve" x="232" y="233.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">chunks, with high scores. The answer still</text><text xml:space="preserve" x="232" y="246.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">cites a wrong fact.</text><text xml:space="preserve" x="500" y="221.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">The chunks were packed into the middle</text><text xml:space="preserve" x="500" y="233.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">of the context, where attention is</text><text xml:space="preserve" x="500" y="246.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">weakest.</text><text xml:space="preserve" x="736" y="221.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">Bookend the packing. Post 09,</text><text xml:space="preserve" x="736" y="233.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">section 5.</text><path d="M39.92 290.99C255.86 290.41 471.83 290.01 919.98 290.83M40.03 291C298.18 290.49 556.13 290.49 920.11 290.96" fill="none" stroke="var(--ctx-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.19 299.37C40.66 320.8 39.06 342.39 40.82 375.72M40.28 300.22C39.78 328.64 39.27 357.92 39.96 376.15" fill="none" stroke="var(--ctx-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="315.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ctx-ink)">Tool storm</text><text xml:space="preserve" x="232" y="313.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">Fifteen tool calls in one turn, all to the</text><text xml:space="preserve" x="232" y="325.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">same search tool with slightly different</text><text xml:space="preserve" x="232" y="338.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">queries.</text><text xml:space="preserve" x="500" y="313.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">The tool descriptions are</text><text xml:space="preserve" x="500" y="325.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">near-identical, so the model is</text><text xml:space="preserve" x="500" y="338.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">brute-forcing its way through them.</text><text xml:space="preserve" x="736" y="313.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">Tool selection, or</text><text xml:space="preserve" x="736" y="325.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">disambiguating the names. Post</text><text xml:space="preserve" x="736" y="338.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">15, section 4.</text><path d="M39.92 383.24C267.73 383.42 495.56 383.27 920.12 383.01M39.95 383.02C222.09 381.87 404.5 381.95 919.88 383.12" fill="none" stroke="var(--ctx-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.2 392.58C40.42 413.18 40.67 437.02 39.1 468.57M39.86 392.3C40.49 414.15 40.4 436.03 40.02 467.72" fill="none" stroke="var(--ctx-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="407.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ctx-ink)">Silent regression</text><text xml:space="preserve" x="232" y="405.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">Cost dropped a week ago. So did quality,</text><text xml:space="preserve" x="232" y="417.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink)">the same week.</text><text xml:space="preserve" x="500" y="405.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">A cleanup PR removed an instruction</text><text xml:space="preserve" x="500" y="417.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">the model had been quietly relying on.</text><text xml:space="preserve" x="736" y="405.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">Revert, then add a fixture.</text><text xml:space="preserve" x="736" y="417.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ctx-ink-muted)">This is what replays catch.</text><text xml:space="preserve" x="40" y="475.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink)">The cost of not instrumenting is paying engineering time to reconstruct what was already happening in front of you.</text>
</svg>
