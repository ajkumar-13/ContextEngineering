<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The replay loop: capture, re-run, diff</title>
  <desc id="d">A hand-drawn three-step loop. Capture: sample real traces spanning the common intents and freeze their inputs, with any triaged failure becoming a permanent fixture. Re-run: on every prompt or model change, replay the frozen inputs through the new configuration, checking deterministic sub-steps exactly and sending generative ones to the judge. Diff: compare against the recorded baseline, where a drop on any fixture blocks the change, the same gate CI already applies to code. A dashed return path notes the corpus grows for free as triaged failures join it. Two panels contrast the offline eval set — curated in advance, small and human-reviewed — with the replay corpus, harvested from production traffic and covering what users actually do rather than what was predicted. A caption states that replays turn silent regression from a next-quarter surprise into a pull-request check.</desc>

