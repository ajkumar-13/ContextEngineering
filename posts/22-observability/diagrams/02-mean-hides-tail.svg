<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-mean-hides-tail-title" aria-describedby="ctx-02-mean-hides-tail-desc">
<title id="ctx-02-mean-hides-tail-title">The p95 doubles while the median holds</title>
<desc id="ctx-02-mean-hides-tail-desc">Two dot plots for two weeks of 1,000 synthetic sessions each; week A has 2% of sessions on a slow path and week B 8%. Circles are week A, diamonds week B. Latency per session in seconds: mean 4.63 and 5.03, median 4.55 and 4.59, p95 5.58 and 11.18. Cost per session in dollars: median 0.100 and 0.102, p95 0.169 and 0.184.</desc>
