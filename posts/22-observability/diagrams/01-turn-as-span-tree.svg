<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-01-turn-as-span-tree-title" aria-describedby="ctx-01-turn-as-span-tree-desc">
<title id="ctx-01-turn-as-span-tree-title">One turn is a tree of timed, priced spans</title>
<desc id="ctx-01-turn-as-span-tree-desc">Left: one support-agent turn as a span tree, one row per span, indented by depth, with a dashed bar on a time axis from 0 to 4,500 milliseconds and its duration and cost at the right. turn 4,500 ms, 0.02558 dollars; assemble_context 40 ms; load_memory 30; select_tools 10; retrieve 560; query_rewrite 350 ms, 0.00050 dollars; hybrid_search 90; rerank 120; llm_call 3,800 ms, 0.02508 dollars; tool_call issue_refund 100; db_query 60. Right: four dashboard cards fed by every trace: cost per session at the median and p95, latency at p95, quality as the evaluation score of sampled traffic, and errors by kind.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
