<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-bug-shapes-title" aria-describedby="ctx-03-bug-shapes-desc">
<title id="ctx-03-bug-shapes-title">Four bug shapes, and where each fix lives</title>
<desc id="ctx-03-bug-shapes-desc">A four-row table with columns shape, in the trace, in the prompt, and fix. Context bloat: input tokens climb; layer 05 conversation history keeps old tool results; compress by clearing tool results. Buried evidence: the right chunk retrieved but a wrong answer; layer 04 retrieved chunks has the best chunk in the middle; select by bookend packing. Tool-storm: 15 calls to one tool; layer 02 tools and MCP descriptions overlap with no stop rule; select and isolate by trimming the catalogue and adding a budget rule. Silent regression: cost and quality fall; layer 01 system prompt lost a line it relied on; restore it and add a replay fixture.</desc>
<style>
