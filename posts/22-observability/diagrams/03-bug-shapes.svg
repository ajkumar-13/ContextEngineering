<marker id="ctx-03-bug-shapes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="510">Four bug shapes, and where each fix lives</text>
<text x="40" y="76" class="t-subtitle" data-w="670">Read each row left to right: what the trace shows, what the prompt shows, where the fix lives.</text>
<text x="40" y="128" class="t-head" data-w="51">Shape</text>
<text x="216" y="128" class="t-head" data-w="93">In the trace</text>
<text x="432" y="128" class="t-head" data-w="111">In the prompt</text>
<text x="688" y="128" class="t-head" data-w="25">Fix</text>
<path d="M40,144 L920,144" class="s-ink-muted w1 nofill"/>
<text x="40" y="176" class="t-label b" data-w="97">Context bloat</text>
<text x="216" y="176" class="t-label" data-w="123">input tokens climb</text>
<text x="432" y="176" class="t-label" data-w="159"><tspan class="f-green-ink">05 Conversation history</tspan></text>
<text x="432" y="200" class="t-note" data-w="133">old tool results kept</text>
<text x="688" y="176" class="t-label" data-w="66">compress</text>
<text x="688" y="200" class="t-note" data-w="112">clear tool results</text>
<path d="M40,220 L920,220" class="s-border w1 nofill"/>
<text x="40" y="252" class="t-label b" data-w="115">Buried evidence</text>
<text x="216" y="252" class="t-label" data-w="176">right chunk, wrong answer</text>
<text x="432" y="252" class="t-label" data-w="137"><tspan class="f-orange-ink">04 Retrieved chunks</tspan></text>
<text x="432" y="276" class="t-note" data-w="164">best chunk in the middle</text>
<text x="688" y="252" class="t-label" data-w="40">select</text>
<text x="688" y="276" class="t-note" data-w="115">bookend packing</text>
<path d="M40,296 L920,296" class="s-border w1 nofill"/>
<text x="40" y="328" class="t-label b" data-w="80">Tool-storm</text>
<text x="216" y="328" class="t-label" data-w="128">15 calls to one tool</text>
<text x="432" y="328" class="t-label" data-w="211"><tspan class="f-blue-ink">02 Tools and MCP descriptions</tspan></text>
<text x="432" y="352" class="t-note" data-w="138">overlap, no stop rule</text>
<text x="688" y="328" class="t-label" data-w="93">select, isolate</text>
<text x="688" y="352" class="t-note" data-w="220">trim the catalogue, add a budget</text>
<path d="M40,372 L920,372" class="s-border w1 nofill"/>
<text x="40" y="404" class="t-label b" data-w="121">Silent regression</text>
<text x="216" y="404" class="t-label" data-w="131">cost and quality fall</text>
<text x="432" y="404" class="t-label" data-w="124"><tspan class="f-blue-ink">01 System prompt</tspan></text>
<text x="432" y="428" class="t-note" data-w="129">lost a relied-on line</text>
<text x="688" y="404" class="t-label" data-w="76">replay gate</text>
<text x="688" y="428" class="t-note" data-w="193">restore the line, add a fixture</text>
<path d="M40,448 L920,448" class="s-border w1 nofill"/>
<text x="40" y="504" class="t-note" data-w="253">None of the four is fixed in the model.</text>
</svg>
