title: "22 - Observability, tracing, and cost"
summary: "Every model, retrieval and tool call is recorded as a span in a trace store. This post reads four bug shapes off a trace, builds the four dashboard numbers, monitors the cache-hit rate and replays traces to block a regression."
date: 2026-05-20
updated: 2026-10-13
status: complete
part: "Part IV - Production-grade practice"
level: intermediate
reading_time: 17
tags: [context-engineering, observability, tracing, opentelemetry, cost-engineering, prompt-caching, regression-testing]
hero: diagrams/01-turn-as-span-tree.svg
prerequisites: [ctx-005, ctx-020]
code: optional
outcomes:
  - id: o1
    text: "Wire trace and span instrumentation into an LLM application so that every model, retrieval and tool call is recorded with its prompt, tokens, cost and latency."
  - id: o2
    text: "Read a trace and identify the four common bug shapes: context bloat, buried evidence, tool-storm and silent regression."
  - id: o3
    text: "Set up a dashboard that surfaces cost, quality, latency and error trends, reading the 95th percentile rather than the mean."
  - id: o4
    text: "Replay captured traces against a changed prompt or model and block the change when the diff shows a regression."
  - id: o5
    text: "Compute a call's cost and cache-hit rate from its usage fields, and trace a falling hit rate to the change that broke the prefix."
