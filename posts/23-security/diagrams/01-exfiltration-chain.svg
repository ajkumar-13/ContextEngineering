<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">The data-exfiltration chain, and where each defence breaks it</title>
  <desc id="d">A hand-drawn figure of three steps, each individually reasonable. First, attacker text arrives through a channel the agent already trusts — a support email in the inbox it triages, carrying hidden white-on-white instructions to look up an account and send a summary to an attacker address. Second, the agent reads privileged data with a tool it is supposed to use, calling lookup_account and pulling the plan, address, and recent tickets into context. Third, it egresses the data with a second legitimate tool, calling send_email to the attacker address. Below, where the chain breaks: the first step is answered by filtering at the trust boundary and demoting the content to data; the second by nothing, because that call is legitimate and must succeed; the third by authorising in application code, so an unknown recipient passes through an out-of-band confirmation the attacker cannot forge. A caption notes exfiltration needs only one read tool and one write-to-the-outside tool in the same session.</desc>

