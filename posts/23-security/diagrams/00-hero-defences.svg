<rect x="480" y="556" width="272" height="8" rx="4" class="f-orange" data-fit="skip"/>
<text x="488" y="592" class="t-head" data-w="144">Memory write, D4</text>
<text x="488" y="616" class="t-label" data-w="223">a rule from external text: refused,</text>
<text x="488" y="640" class="t-label" data-w="171">never back in 03 as a rule</text>
<path d="M588,440 L588,541" class="flow" marker-end="url(#ctx-00-hero-defences-arrow)"/>
<text x="600" y="496" class="t-note" data-w="33">write</text>
<text x="40" y="684" class="t-note" data-w="576">Text from any author reaches an action only through checks the model cannot rewrite.</text>
