<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-defences-title" aria-describedby="ctx-00-hero-defences-desc">
<title id="ctx-00-hero-defences-title">The model proposes; code decides what runs</title>
<desc id="ctx-00-hero-defences-desc">Left, a card of external text: web pages, emails, documents, tool results and unvetted MCP servers. Red arrows carry it across a dashed trust boundary, where D3 wraps it and tags it external, into three bands of the six-layer window: 02 Tools and MCP descriptions, 04 Retrieved chunks and 05 Conversation history. The window, 01 System prompt to 06 User instruction, feeds the model, which only proposes. Its proposed calls go to a gate in application code, D1 and D2: is the call in scope, is the recipient allowed; if not, it is blocked or held for a person. Only what passes reaches the action. Its proposed memory writes go to D4, which refuses a rule written from external text, so the rule never returns in 03 Memory and state.</desc>
