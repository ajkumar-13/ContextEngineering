<text x="40" y="48" class="t-title" data-w="553">The model proposes; code decides what runs</text>
<text x="40" y="76" class="t-subtitle" data-w="760">Where the four defences sit: D3 where external text enters, D4 at memory, D1 and D2 before every action.</text>
