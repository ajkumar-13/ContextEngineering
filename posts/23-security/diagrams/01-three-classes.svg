  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-soft { fill: var(--ctx-blue-soft); }
  .f-green-soft { fill: var(--ctx-green-soft); }
  .f-neutral-soft { fill: var(--ctx-neutral-soft); }
  .f-orange-soft { fill: var(--ctx-orange-soft); }
  .f-purple-soft { fill: var(--ctx-purple-soft); }
  .f-surface { fill: var(--ctx-surface); }
  .s-blue-line { stroke: var(--ctx-blue-line); }
  .s-border { stroke: var(--ctx-border); }
  .s-green-line { stroke: var(--ctx-green-line); }
  .s-ink-muted { stroke: var(--ctx-ink-muted); }
  .s-orange-line { stroke: var(--ctx-orange-line); }
  .s-purple-line { stroke: var(--ctx-purple-line); }
  .s-rule { stroke: var(--ctx-rule); }
</style>
<defs>
<marker id="ctx-01-three-classes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="631">The class every demo shows has the smallest reach</text>
<text x="40" y="76" class="t-subtitle" data-w="670">Three classes of prompt injection: who writes the text, where it enters, and how far it reaches.</text>
<rect x="40" y="112" width="880" height="364" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="112" width="880" height="364" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="144" class="t-head" data-w="153">Memory poisoning</text>
<text x="56" y="168" class="t-label" data-w="341">A rule planted in the memory store, read back later</text>
<text x="56" y="192" class="t-label" data-w="390"><tspan class="b">Reaches: </tspan>later sessions, and other users of a shared store</text>
<text x="592" y="144" text-anchor="end" class="t-note" data-w="43">enters</text>
<rect x="608" y="120" width="248" height="32" rx="4" class="f-orange-soft" data-fit="skip"/>
<rect x="608" y="120" width="248" height="32" rx="4" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="620" y="144" class="t-label" data-w="143">03 Memory and state</text>
<rect x="64" y="208" width="832" height="244" rx="8" class="f-surface" data-fit="skip"/>
<rect x="64" y="208" width="832" height="244" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="80" y="240" class="t-head" data-w="138">Indirect injection</text>
<text x="80" y="264" class="t-label" data-w="389">Text a third party planted in a page, an email, a tool result</text>
<text x="80" y="288" class="t-label" data-w="274"><tspan class="b">Reaches: </tspan>everything the agent can reach</text>
<text x="592" y="240" text-anchor="end" class="t-note" data-w="43">enters</text>
<rect x="608" y="216" width="248" height="32" rx="4" class="f-blue-soft" data-fit="skip"/>
<rect x="608" y="216" width="248" height="32" rx="4" class="w1 nofill s-blue-line" data-fit="skip"/>
<text x="620" y="240" class="t-label" data-w="211">02 Tools and MCP descriptions</text>
<rect x="608" y="256" width="248" height="32" rx="4" class="f-orange-soft" data-fit="skip"/>
<rect x="608" y="256" width="248" height="32" rx="4" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="620" y="280" class="t-label" data-w="137">04 Retrieved chunks</text>
<rect x="608" y="296" width="248" height="32" rx="4" class="f-green-soft" data-fit="skip"/>
<rect x="608" y="296" width="248" height="32" rx="4" class="w1 nofill s-green-line" data-fit="skip"/>
<text x="620" y="320" class="t-label" data-w="159">05 Conversation history</text>
<rect x="88" y="344" width="784" height="92" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="88" y="344" width="784" height="92" rx="8" class="w15 nofill s-ink-muted" data-fit="skip"/>
<text x="104" y="376" class="t-head" data-w="125">Direct injection</text>
<text x="104" y="400" class="t-label" data-w="129">Text the user types</text>
<text x="104" y="424" class="t-label" data-w="440"><tspan class="b">Reaches: </tspan>the user's own session, with the user's own permissions</text>
<text x="592" y="376" text-anchor="end" class="t-note" data-w="43">enters</text>
<rect x="608" y="352" width="248" height="32" rx="4" class="f-purple-soft" data-fit="skip"/>
<rect x="608" y="352" width="248" height="32" rx="4" class="w1 nofill s-purple-line" data-fit="skip"/>
<text x="620" y="376" class="t-label" data-w="127">06 User instruction</text>
<text x="40" y="504" class="t-note" data-w="711">A user who attacks the session acts with only their own permissions; a third party's text needs no account.</text>
</svg>
