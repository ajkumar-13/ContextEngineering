<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-three-classes-title" aria-describedby="ctx-01-three-classes-desc">
<title id="ctx-01-three-classes-title">The class every demo shows has the smallest reach</title>
<desc id="ctx-01-three-classes-desc">Three nested rounded regions, each with the layers its text enters as coloured chips. The outermost is memory poisoning: a rule planted in the memory store and read back later into 03 Memory and state; it reaches later sessions and other users of a shared store. Inside it is indirect injection: text a third party planted in a page, an email or a tool result, entering 02 Tools and MCP descriptions, 04 Retrieved chunks or 05 Conversation history; it reaches everything the agent can reach. Innermost is direct injection: text the user types into 06 User instruction; it reaches the user's own session.</desc>
<style>
