  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-red-soft { fill: var(--ctx-red-soft); }
  .s-red-line { stroke: var(--ctx-red-line); }
</style>
<defs>
<marker id="ctx-00-hero-response-control-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="448">Validate, retry with a cap, then guard</text>
<text x="40" y="76" class="t-subtitle" data-w="609">The loop of snippets/validate_retry.py, then the checks of snippets/output_guard.py.</text>
<rect x="40" y="168" width="136" height="136" rx="8" class="card"/>
<text x="56" y="200" class="t-head" data-w="51">Model</text>
<text x="56" y="232" class="t-label" data-w="63">reply and</text>
<text x="56" y="256" class="t-label" data-w="80">stop reason</text>
<rect x="232" y="168" width="200" height="136" rx="8" class="card"/>
<text x="248" y="200" class="t-head" data-w="150">Parse and validate</text>
<text x="248" y="232" class="t-label" data-w="99">JSON Schema</text>
<text x="248" y="256" class="t-label" data-w="88">and the rules</text>
<rect x="488" y="168" width="200" height="136" rx="8" class="card"/>
<text x="504" y="200" class="t-head" data-w="144">Output guardrails</text>
<text x="504" y="232" class="t-label" data-w="77">moderation</text>
<text x="504" y="256" class="t-label" data-w="70">leak check</text>
<text x="504" y="280" class="t-label" data-w="86">PII redaction</text>
<rect x="744" y="168" width="176" height="136" rx="8" class="card"/>
