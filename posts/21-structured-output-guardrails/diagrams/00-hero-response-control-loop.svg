<text x="124" y="128" class="t-note" data-w="388">invalid: the reply and its error go back, at most 3 attempts</text>
<rect x="208" y="352" width="248" height="128" rx="8" class="f-red-soft s-red-line w1"/>
<text x="224" y="384" class="t-head" data-w="129">Leaves the loop</text>
<text x="224" y="416" class="t-label" data-w="170">refusal: fallback message</text>
<text x="224" y="440" class="t-label" data-w="169">cut off: raise max_tokens</text>
<text x="224" y="464" class="t-label" data-w="176">3 failed attempts: counted</text>
<path d="M332,304 L332,349" class="flow" marker-end="url(#ctx-00-hero-response-control-loop-arrow)"/>
<rect x="488" y="352" width="200" height="104" rx="8" class="f-red-soft s-red-line w1"/>
<text x="504" y="384" class="t-head" data-w="66">Blocked</text>
<text x="504" y="416" class="t-label" data-w="127">moderation or leak</text>
<text x="504" y="440" class="t-label" data-w="149">draft goes to a human</text>
<path d="M588,304 L588,349" class="flow" marker-end="url(#ctx-00-hero-response-control-loop-arrow)"/>
<text x="40" y="504" class="t-note" data-w="611">A retry repairs what rewording can fix; a refusal, a cut-off or a block leaves by another path.</text>
</svg>
