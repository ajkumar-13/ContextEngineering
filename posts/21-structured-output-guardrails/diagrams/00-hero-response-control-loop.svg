<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-00-hero-response-control-loop-title" aria-describedby="ctx-00-hero-response-control-loop-desc">
<title id="ctx-00-hero-response-control-loop-title">Validate, retry with a cap, then guard</title>
<desc id="ctx-00-hero-response-control-loop-desc">A chain of four boxes. The model returns a reply and a stop reason; parse and validate checks it against the JSON Schema and the rules; output guardrails run moderation, a leak check and PII redaction; the reply is sent as is (pass) or redacted (fix). An arrow from validate back to the model carries an invalid reply with its error appended, at most 3 attempts. Below validate, a red box: the reply leaves the loop on a refusal (fallback message), a cut-off at max_tokens (raise max_tokens) or 3 failed attempts (counted). Below the guardrails, a red box: a reply flagged by moderation or the leak check is blocked and the draft goes to a human.</desc>
<style>
