<title id="ctx-02-token-mask-title">The mask lets only the grammar's tokens through</title>
<desc id="ctx-02-token-mask-desc">A table of the eight steps of a toy constrained decoder: step, number of allowed tokens, the model's first choice and the emitted token. Step 1: 1 allowed, first choice Sure, here is the JSON:, emitted {, masked. Step 2: 1 allowed, first choice "category":, emitted "category":. Step 3: 4 allowed, first choice "Refund", emitted "refund", masked. Step 4: 1 allowed, first choice ,, emitted ,. Step 5: 1 allowed, first choice "priority":, emitted "priority":. Step 6: 5 allowed, first choice 7, emitted 5, masked. Step 7: 1 allowed, first choice ,, emitted }, masked. Step 8: 1 allowed, first choice \n~~~, emitted end of output, masked. The output {"category": "refund", "priority": 5} parses. With max_tokens = 5 the output stops at {"category": "refund", "priority": and does not parse.</desc>
