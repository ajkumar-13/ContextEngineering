<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Structured output and guardrails: the response control loop</title>
  <desc id="d">A hand-drawn control loop. Raw model output enters a validate-against-schema step checking types, required fields, and enums. Valid output passes to a moderation and redaction step covering content, personal data, and leaked system detail, and is returned as a typed record safe to store. Invalid output follows a path back to the model with the validation error appended to the messages, because the error names the wrong field and so is itself the repair instruction; the loop is capped at three attempts before raising a hard error the dashboard counts. Captions note that constrained decoding removes the syntactic retry while a semantic retry still earns its place, and that a loop which silently swallows exhaustions hides a real regression.</desc>

