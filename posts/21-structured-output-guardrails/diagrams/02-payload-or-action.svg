325.01" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="116.72" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="16" fill="var(--ce-ink)">response_format</text><text xml:space="preserve" x="60" y="139.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">The answer is the payload.</text><text xml:space="preserve" x="60" y="161.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Use it when there is exactly one shape you want back, and you want</text><text xml:space="preserve" x="60" y="173.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">it every time. There is no decision about whether to respond in</text><text xml:space="preserve" x="60" y="186.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">this shape — only what goes in the fields.</text><text xml:space="preserve" x="60" y="231.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">Typical:</text><text xml:space="preserve" x="60" y="249.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">· a classification label a router branches on</text><text xml:space="preserve" x="60" y="267.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">· an extraction result a database stores</text><text xml:space="preserve" x="60" y="285.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">· a filled form</text><text xml:space="preserve" x="60" y="303.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">· a graded rubric</text><path d="M518.88 93.85C615.37 96.37 713.12 96.12 894.93 94.85C910.62 93.78 918.24 104.59 920.87 119.69C922.14 164.62 917.68 215.49 918.38 309.26C919.33 325.59 913.33 336.26 896.58 332C805.65 334.72 716.43 334.89 519.67 333.42C502.56 334.73 494.8 325 497.42 308.6C495.56 271.68 495.17 233.99 496.13 120.57C497.25 102.26 502.58 96.06 521.93 91.98C520 94 520 94 520 94" fill="var(--ce-surface)" stroke="none"/><path d="M521.19 94.56C619.63 95.28 721.51 94.3 896.13 92.85M519.49 94.14C619.54 94.88 719.49 95.02 895.9 94.58M896 94C913.28 93.8 919.64 101.85 920.24 116.81M897.64 92.93C913.34 94.77 919.69 104.13 920.83 117.16M918.72 117.11C917.83 188.39 921.06 260.41 919.29 311.03M919.63 117.76C922.37 170.54 921.1 225.78 920.68 309.68M920 310C919.65 324.34 911.59 332.52 895.28 332.98M918.01 309.19C919.16 325.27 909.99 335.06 897.57 333.86M895.92 333.71C755.88 332 618.67 331.52 520.35 334.24M895.79 334.46C819.26 335.64 742.78 335.64 519.73 334.35M520 334C504.65 332.27 494.7 327.31 496.81 311.02M521.26 332.73C504.18 331.8 497.43 326.1 494.27 310.77M494.87 311.49C495.11 234.49 495.38 161.9 497.2 118.12M495.18 310.87C493.71 257.31 493.91 203.99 495.91 117.59M496 118C494.12 101.07 504.54 93.23 518.49 93.38M494.14 116.64C497.71 103.75 501.8 95.81 519.52 93.16M520 94C520 94 520 94 520 94M520 94C520 94 520 94 520 94" fill="none" stroke="var(--ce-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M501.33 102.96C500.56 170.93 499.93 237.16 501.9 324.48M500.68 103.3C500.93 181.02 500.19 258.37 501.44 324.74" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="516" y="116.72" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="16" fill="var(--ce-ink)">tools + tool_choice</text><text xml:space="preserve" x="516" y="139.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">The model is choosing an action.</text><text xml:space="preserve" x="516" y="161.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Use it when the model decides whether and which action to take,</text><text xml:space="preserve" x="516" y="173.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">possibly among several, possibly none. The menu — and the option</text><text xml:space="preserve" x="516" y="186.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">to call nothing — is the signal.</text><text xml:space="preserve" x="516" y="231.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">tool_choice, three settings:</text><text xml:space="preserve" x="516" y="249.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-accent)">auto</text><text xml:space="preserve" x="626" y="249.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">the model decides whether to call anything</text><text xml:space="preserve" x="516" y="267.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-accent)">required / any</text><text xml:space="preserve" x="626" y="267.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">it must call one of them</text><text xml:space="preserve" x="516" y="285.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-accent)">a named tool</text><text xml:space="preserve" x="626" y="285.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">it must call that specific one</text><text xml:space="preserve" x="40" y="367.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">One always-required shape means response_format. A menu of optional capabilities the model selects among means tools.</text><text xml:space="preserve" x="40" y="394.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Forcing a single structured answer through a dummy tool works, but it muddies the trace: the span reads as though the model called</text><text xml:space="preserve" x="40" y="410.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">something when it merely answered.</text><text xml:space="preserve" x="40" y="434.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">The reverse is legitimate: pinning tool_choice to a named tool gives schema-constrained output on providers whose response_format</text><text xml:space="preserve" x="40" y="450.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">support is thinner than their tool support. A forced named call is a schema-constrained object by another name.</text>
</svg>
