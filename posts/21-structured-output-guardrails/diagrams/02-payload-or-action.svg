<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">Choosing between response_format and a tool call</title>
  <desc id="d">A hand-drawn comparison of two output mechanisms. On the left, response_format: the answer is the payload, used when there is exactly one shape you want back every time, with no decision about whether to respond in that shape — only what goes in the fields. Typical cases are a classification label a router branches on, an extraction result a database stores, a filled form, and a graded rubric. On the right, tools with tool_choice: the model is choosing an action, used when it decides whether and which action to take, possibly among several and possibly none, with the menu and the option to call nothing being the signal. Three tool_choice settings are listed: auto lets the model decide whether to call anything, required forces one of them, and a named tool forces that specific one. Captions give the rule of thumb and note that forcing structured output through a dummy tool muddies the trace, while pinning a named tool is a legitimate way to get schema-constrained output.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="460"/>
