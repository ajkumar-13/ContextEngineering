<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-payload-or-action-title" aria-describedby="ctx-03-payload-or-action-desc">
<title id="ctx-03-payload-or-action-title">Is the answer the payload, or an action?</title>
<desc id="ctx-03-payload-or-action-desc">Two cards. Left, structured response format: the answer is the payload, one shape every time, such as a label, an extraction, a form or a grade; the field is response_format in Chat Completions, text.format in Responses and output_config.format in Anthropic Messages. Right, tools steered by tool_choice: the model chooses an action among several, or none. OpenAI auto and Anthropic auto: may call none; required and any: must call one; a named function and tool: must call that one; none and none: calls nothing.</desc>
