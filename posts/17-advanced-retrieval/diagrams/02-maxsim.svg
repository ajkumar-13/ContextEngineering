<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-maxsim-title" aria-describedby="ctx-02-maxsim-desc">
<title id="ctx-02-maxsim-title">MaxSim counts the rare-term match in full</title>
<desc id="ctx-02-maxsim-desc">Two grids of cosine similarities between the query tokens fix, error and E-4012 (rows) and the tokens of a chunk (columns), each row's maximum outlined and printed at the right. Chunk A, which holds the answer (invoice export stops with E-4012 when currency missing): maxima 0.45 (stops), 0.98 (stops) and 1.00 (E-4012), MaxSim 2.43, single-vector score 0.51. Chunk B, a generic page (how to fix common error messages): maxima 1.00 (fix), 1.00 (error) and 0.28 (error), MaxSim 2.28, single-vector score 0.55. The single vector ranks B first; MaxSim ranks A first.</desc>
