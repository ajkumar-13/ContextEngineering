<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-router-title" aria-describedby="ctx-00-hero-router-desc">
<title id="ctx-00-hero-router-title">Route each question to the retriever its shape needs</title>
<desc id="ctx-00-hero-router-desc">A routing diagram in four columns. On the left, five question shapes with the cue words the post's toy router reads: multi-hop (downstream of, depend on), whole document (summarise, main themes), structured data (how many, average), rare exact term (identifiers such as E-4012 and AX-7731), and anything else (local lookups). Each enters one router box, which checks its rules in order. The router sends them to GraphRAG, which packs the chunks behind the edges walked; a long-context load of the whole document, cached; text-to-SQL, which returns rows; late interaction, which ranks chunks by MaxSim; and the default, hybrid RAG with fused, reranked top-k chunks. All five routes fill one box, 04 Retrieved chunks, drawn in the per-turn colour.</desc>
