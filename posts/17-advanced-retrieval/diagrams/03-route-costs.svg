<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-route-costs-title" aria-describedby="ctx-03-route-costs-desc">
<title id="ctx-03-route-costs-title">Some routes pay offline, others on every question</title>
<desc id="ctx-03-route-costs-desc">A table of five retrieval routes, with the work each does offline for a 1,000,000-token corpus and the cost it adds per question, computed at illustrative sizes on Claude Sonnet 4.5 rates as of early 2026. Hybrid RAG: one vector per chunk, 7.68 MB; 2,000 tokens, 0.006 dollars. GraphRAG: 2,000 extraction calls, 18.60 dollars; a walk that grows with hop depth. Late interaction: one vector per token, 256 MB, or 36 MB compressed; MaxSim over the candidates. Text-to-SQL: schema descriptions indexed; 0.0087 dollars a call, 0.0174 dollars with a repair. Long-context load: nothing offline; 0.075 dollars uncached, 0.0075 dollars on a cache read.</desc>
<style>
