<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">Four question shapes vanilla RAG cannot serve, and what each one needs</title>
  <desc id="d">A hand-drawn table of four rows. A multi-hop question, such as which suppliers are downstream of vendors that failed an audit, fails because the answer is a join across documents that no single chunk holds, and needs GraphRAG. A long-document question, such as summarising the risks in a two-hundred-page filing, fails because the answer needs the whole document rather than the best five chunks, and needs a long-context load. A structured question, such as counting tickets a team closed last quarter, fails because the data is a table and embeddings are the wrong tool, and needs text-to-SQL. A question carrying a rare exact term such as a gene, SKU, or contract id fails because one vector per chunk washes out a strong match on a single rare token, and needs late-interaction retrieval. A caption notes none of the four replaces vanilla RAG; a router picks between them per query.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="500"/>
<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">Four shapes vanilla RAG cannot serve</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">Chunk, embed, retrieve, rerank, pack handles most traffic. These four are the residue, and each has its own answer.</text><text xml:space="preserve" x="40" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Question shape</text><text xml:space="preserve" x="232" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">What it sounds like</text><text xml:space="preserve" x="554" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Why vanilla fails</text><text xml:space="preserve" x="776" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">What it needs</text><path d="M41.17 111.34C39.71 128.48 39.24 144.42 39.44 174.4M39.91 112.06C39.43 133.48 39.29 155.06 39.84 173.79" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="127.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Multi-hop</text><text xml:space="preserve" x="232" y="126.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">&quot;Which suppliers are downstream of vendors</text><text xml:space="preserve" x="232" y="139.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">that failed our 2024 audit?&quot;</text><text xml:space="preserve" x="554" y="125.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The answer is a join across</text><text xml:space="preserve" x="554" y="137.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">documents. No single chunk holds</text><text xml:space="preserve" x="554" y="150.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">it.</text><text xml:space="preserve" x="776" y="126.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">GraphRAG</text><path d="M39.92 182.23C243.98 182.24 447.61 182.56 919.84 182.14M40.11 181.99C374.02 182.34 707.76 182.28 920.1 182.05" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.18 190.56C39.43 206.67 40.8 222.27 40.13 250.86M39.5 190.14C40.03 206.21 40.3 222.79 39.9 252.57" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="205.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Long-document</text><text xml:space="preserve" x="232" y="204.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">&quot;Summarise the key risks raised in this</text><text xml:space="preserve" x="232" y="217.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">200-page filing.&quot;</text><text xml:space="preserve" x="554" y="203.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The answer needs the whole</text><text xml:space="preserve" x="554" y="215.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">document, not the best five</text><text xml:space="preserve" x="554" y="228.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">chunks.</text><text xml:space="preserve" x="776" y="204.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Long-context load</text><path d="M39.92 259.99C255.86 259.41 471.83 259.01 919.98 259.83M40.03 260C298.18 259.49 556.13 259.49 920.11 259.96" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.19 267.37C40.73 284.87 39.14 302.52 40.82 329.72M40.28 268.22C39.81 291.33 39.3 315.31 39.96 330.15" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="283.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Structured</text><text xml:space="preserve" x="232" y="282.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">&quot;How many tickets did the Bangalore team close</text><text xml:space="preserve" x="232" y="295.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">last quarter?&quot;</text><text xml:space="preserve" x="554" y="281.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The data is a table. Embeddings</text><text xml:space="preserve" x="554" y="293.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">are the wrong tool for it.</text><text xml:space="preserve" x="776" y="282.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Text-to-SQL</text><path d="M39.92 338.24C267.73 338.42 495.56 338.27 920.12 338.01M39.95 338.02C222.09 336.87 404.5 336.95 919.88 338.12" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.2 346.58C40.45 363.06 40.7 382.77 39.1 408.57M39.86 346.3C40.41 364.06 40.32 381.84 40.02 407.72" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="361.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Rare exact term</text><text xml:space="preserve" x="232" y="360.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">A gene, a SKU, a contract id the embedding</text><text xml:space="preserve" x="232" y="373.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">model has never seen.</text><text xml:space="preserve" x="554" y="359.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">One vector per chunk washes out a</text><text xml:space="preserve" x="554" y="371.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">strong match on one rare token.</text><text xml:space="preserve" x="776" y="360.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Late interaction</text><text xml:space="preserve" x="40" y="447.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">None of the four replaces vanilla RAG. They augment it, and a router picks between them per query.</text><text xml:space="preserve" x="40" y="469.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Query-shape patterns — rewriting, decomposition, HyDE, and the agentic loops — sit on the other side of the pipeline, in Post 11.</text>
</svg>
