<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">The four priority classes and the two compression triggers</title>
  <desc id="d">A hand-drawn figure in two halves. On the left, four priority classes stacked from most to least protected: P0 holds the system prompt, identity, and hard rules and is never trimmed; P1 holds the last three user turns and the current goal and is never trimmed until the budget is impossible to meet; P2 holds older history and retrieved chunks past the top three and is trimmed first; P3 holds stale tool results and expired memory and is trimmed eagerly. On the right, a vertical budget gauge filled to roughly eighty-eight per cent, marked with three dashed lines: a hard trigger at ninety-five per cent that summarises or semantically chunks the older conversation and surfaces a notice, a soft trigger at eighty per cent that runs tool-result clearing and P3 pruning, and sixty per cent as the level the soft pass aims to reach. Captions note the thresholds are illustrative defaults and that compressing on every turn is an anti-pattern.</desc>

