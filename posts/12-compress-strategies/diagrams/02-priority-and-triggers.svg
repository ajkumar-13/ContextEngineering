oin="round" stroke-dasharray="9 7"/><text xml:space="preserve" x="640" y="122.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">95% · hard trigger</text><text xml:space="preserve" x="640" y="138.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Summarise or semantically chunk the</text><text xml:space="preserve" x="640" y="150.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">older conversation. Surface a brief</text><text xml:space="preserve" x="640" y="163.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">notice; keep the originals in a log.</text><path d="M552.2 162.6C578.92 161.31 606.41 161.35 632.35 161.79M551.79 161.7C575.14 161.95 598.71 161.57 631.74 161.81" fill="none" stroke="var(--ce-warn)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text xml:space="preserve" x="640" y="161.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">80% · soft trigger</text><text xml:space="preserve" x="640" y="177.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Tool-result clearing and P3 pruning.</text><text xml:space="preserve" x="640" y="189.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">If that lands under 60%, stop.</text><path d="M552.21 213.7C571.94 214.48 592.44 214.22 632.52 213.4M551.98 214.02C580.01 214.16 607.64 213.86 632.06 213.71" fill="none" stroke="var(--ce-success)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text xml:space="preserve" x="640" y="213.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">60% · where the soft pass aims</text><text xml:space="preserve" x="640" y="229.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Far enough below the ceiling to give</text><text xml:space="preserve" x="640" y="241.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">the next few turns headroom.</text><text xml:space="preserve" x="40" y="445.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Both numbers are illustrative defaults. Move them down when token-usage variance is high, up when it is low.</text><text xml:space="preserve" x="40" y="467.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Anti-pattern: compressing on every turn. Compress on triggers, not on a schedule.</text>
</svg>
