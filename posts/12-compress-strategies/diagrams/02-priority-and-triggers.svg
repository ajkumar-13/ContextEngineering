text><text xml:space="preserve" x="40" y="414.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Tag every entry with its class as it lands in the budget; sort by class, then by recency; pop from the bottom until it fits.</text><text xml:space="preserve" x="560" y="99.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">The two triggers</text><path d="M571.32 112.54C582.47 108.64 597.1 112.19 614.17 112.59C619.1 109.93 619.61 110.9 620.58 119.86C620.26 213.45 623.22 311.63 623.73 357.71C623.33 365.01 618.42 372.05 613.05 368.29C597.74 369.68 577.03 370.98 568.74 370.98C564.92 369.85 559.64 365.79 559.43 361.2C559.44 277.56 559.31 197.62 560.17 120.99C559.27 115.96 563.11 109.95 570.14 110.91C570.33 110 570.33 110 570.33 110" fill="var(--ce-surface)" stroke="none"/><path d="M571 109.97C582.83 109.43 597.39 111.52 611.69 111.86M570.32 110.86C585.06 110.35 600.66 110.51 610.71 110.09M611.67 110C618.91 110.89 620.72 112.24 622.44 119.4M610.69 111.42C620.49 109.34 621.86 112.88 622.28 122.62M621.73 121.24C621.68 208.62 622.17 299.67 620.59 360.96M622.64 120.6C621.01 196.93 620.12 271.64 621.53 359.59M622 359.67C623.05 365.6 619.88 368.34 611.08 369.42M622.13 360.35C624.03 368.09 618.52 368.94 612.29 368.03M613.6 369.13C596.01 370.59 583.57 371.53 569.05 368.31M611.25 370.49C602.98 369.83 595.05 371.13 569.58 369.12M570.33 370C562.88 371.09 560.29 368.05 558.06 359.23M570.7 369.39C564.6 370.75 559.35 365.64 558.18 357.9M561.59 359.68C559.65 304.48 558.64 250.8 560.91 119.65M560.38 360.12C557.98 274.97 559.26 189.89 559.63 120.81M560 120.33C560.78 112.09 562.33 108.34 568.96 111.63M560.07 119.4C558.58 114.44 563.06 112.13 568.28 110.6M570.33 110C570.33 110 570.33 110 570.33 110M570.33 110C570.33 110 570.33 110 570.33 110" fill="none" stroke="var(--ce-ink)" stroke-width="1.5" stroke-li