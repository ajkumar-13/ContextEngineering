<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-usage-and-triggers-title" aria-describedby="ctx-01-usage-and-triggers-desc">
<title id="ctx-01-usage-and-triggers-title">Clearing tool results first postpones the lossy summary</title>
<desc id="ctx-01-usage-and-triggers-desc">A line chart of input-budget usage, in percent of 180,000 tokens, over 110 turns of one simulated agent session, with dotted lines at the 95 percent hard trigger, the 80 percent soft trigger and the 60 percent soft target. Without compression usage climbs steadily and passes the budget at turn 31. Summarising alone drops it at turns 30, 56, 83 and 108, four summaries. The two-trigger policy clears stale tool results at 80 percent, back under 60 percent at turns 25, 32, 38, 46, 53 and 61; later passes fall short, and its only summary comes at turn 98, from 95.1 to 17.8 percent.</desc>
