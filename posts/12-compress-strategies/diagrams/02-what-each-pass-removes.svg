<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-what-each-pass-removes-title" aria-describedby="ctx-02-what-each-pass-removes-desc">
<title id="ctx-02-what-each-pass-removes-title">The soft pass removes tool bodies; the summary, the rest</title>
<desc id="ctx-02-what-each-pass-removes-desc">Four stacked bars of the input, in percent of the 180,000-token budget, with dotted lines at 60, 80 and 95 percent. Each bar is split into layers 01 and 02 (4,600 tokens), layers 03 and 04 (3,700), the messages, notes and summary of layer 05, and the tool results of layer 05 kept verbatim. At turn 25 the soft pass takes the input from 81.8 percent (35,000 and 104,000 tokens in layer 05) to 59.1 percent (35,600 and 62,400), replacing old tool results with notes. At turn 98 the summary takes it from 95.1 percent (142,840 and 20,000) to 17.8 percent (7,200 and 16,500).</desc>
<style>
