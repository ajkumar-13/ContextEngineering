<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-six-layer-stack-title" aria-describedby="ctx-01-six-layer-stack-desc">
<title id="ctx-01-six-layer-stack-title">One call, six layers, four lifetimes</title>
<desc id="ctx-01-six-layer-stack-desc">A stack of six horizontal bands, sent from the top. 01 System prompt: identity, rules, output format. 02 Tools and MCP descriptions: the schema of every callable tool. 03 Memory and state: facts kept beyond this call. 04 Retrieved chunks: evidence fetched for this turn. 05 Conversation history: the earlier turns of this session. 06 User instruction: what the user just asked. Brackets on the right group them by lifetime: 01 and 02 the stable prefix, the same on every call; 03 and 04 the per-turn injection, assembled for this call; 05 the growing tail, longer every turn; 06 the trigger, small and sent last. An arrow on the left runs from sent first at the top to sent last at the bottom.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
    --ctx-accent: #D98E5F;
    --ctx-success: #5C9E78;
    --ctx-warn: #B8895A;
    --ctx-alert: #C66B5E;
    --ctx-neutral-1: #EAEAE4;
    --ctx-neutral-2: #CFCFC8;
    --ctx-neutral-3: #8E8E88;
    --ctx-on-fill: #FFFDF9;
    --ctx-on-accent: #1A1A1A;
    --ctx-grid: rgba(26, 26, 26, 0.06);
    --ctx-rule: #8E8E88;
    --ctx-arrow: #6E6E68;
    --ctx-neutral-soft: #F2F2EE;
    --ctx-blue: #0072B2;
    --ctx-blue-ink: #005A8C;
    --ctx-blue-soft: #E3F0F8;
    --ctx-blue-line: #9CC6E0;
    --ctx-orange: #C98500;
    --ctx-orange-ink: #8A5B00;
    --ctx-orange-soft: #FBF0D9;
    --ctx-orange-line: #E5C27A;
    --ctx-green: #008F68;
    --ctx-green-ink: #006B4E;
    --ctx-green-soft: #DFF3EC;
    --ctx-green-line: #8FCDB8;
    --ctx-red: #A8322A;
    --ctx-red-ink: #8F2A23;
    --ctx-red-soft: #F8E3E1;
    --ctx-red-line: #DDA49F;
    --ctx-purple: #A14D8C;
    --ctx-purple-ink: #833E72;
    --ctx-purple-soft: #F4E4EF;
    --ctx-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ctx-bg: #0E0F12;
      --ctx-surface: #16181C;
      --ctx-ink: #F2F2EE;
      --ctx-ink-muted: #B4B4AE;
      --ctx-ink-subtle: #6E6E68;
      --ctx-border: #2A2D33;
      --ctx-primary: #8BA8E0;
      --ctx-accent: #E8B088;
      --ctx-success: #7FBF9B;
      --ctx-warn: #D4B58A;
      --ctx-alert: #D88880;
      --ctx-neutral-1: #1F2229;
      --ctx-neutral-2: #2C3038;
      --ctx-neutral-3: #6E6E68;
      --ctx-on-fill: #14161A;
      --ctx-on-accent: #1A1A1A;
      --ctx-grid: rgba(241, 238, 232, 0.08);
      --ctx-rule: #6A6D74;
      --ctx-arrow: #9A9A94;
      --ctx-neutral-soft: #1C1E23;
      --ctx-blue: #5AA8E0;
      --ctx-blue-ink: #7DBBE8;
      --ctx-blue-soft: #14283A;
      --ctx-blue-line: #2E5878;
      --ctx-orange: #E8B040;
      --ctx-orange-ink: #F0C060;
      --ctx-orange-soft: #33260F;
      --ctx-orange-line: #6E5222;
      --ctx-green: #3CC497;
      --ctx-green-ink: #62D1AC;
      --ctx-green-soft: #10302A;
      --ctx-green-line: #2A6A55;
      --ctx-red: #E8796E;
      --ctx-red-ink: #F09A90;
      --ctx-red-soft: #3A1A18;
      --ctx-red-line: #7A3A34;
      --ctx-purple: #D58CC4;
      --ctx-purple-ink: #E2A6D3;
      --ctx-purple-soft: #331F2E;
      --ctx-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--ctx-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ctx-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--ctx-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--ctx-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--ctx-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--ctx-surface); stroke: var(--ctx-rule); stroke-width: 1; }
  .card { fill: var(--ctx-neutral-soft); stroke: var(--ctx-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--ctx-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--ctx-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--ctx-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--ctx-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--ctx-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--ctx-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-ink { fill: var(--ctx-blue-ink); }
  .f-blue-soft { fill: var(--ctx-blue-soft); }
  .f-green-ink { fill: var(--ctx-green-ink); }
  .f-green-soft { fill: var(--ctx-green-soft); }
  .f-orange-ink { fill: var(--ctx-orange-ink); }
  .f-orange-soft { fill: var(--ctx-orange-soft); }
  .f-purple-ink { fill: var(--ctx-purple-ink); }
  .f-purple-soft { fill: var(--ctx-purple-soft); }
  .s-blue { stroke: var(--ctx-blue); }
  .s-blue-line { stroke: var(--ctx-blue-line); }
  .s-green { stroke: var(--ctx-green); }
  .s-green-line { stroke: var(--ctx-green-line); }
  .s-orange { stroke: var(--ctx-orange); }
  .s-orange-line { stroke: var(--ctx-orange-line); }
  .s-purple { stroke: var(--ctx-purple); }
  .s-purple-line { stroke: var(--ctx-purple-line); }
</style>
<defs>
<marker id="ctx-01-six-layer-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="406">One call, six layers, four lifetimes</text>
<text x="40" y="76" class="t-subtitle" data-w="450">The window the model reads on one call, in the order it is sent.</text>
<rect x="112" y="104" width="568" height="52" rx="8" class="f-blue-soft" data-fit="skip"/>
<rect x="112" y="104" width="568" height="52" rx="8" class="w1 nofill s-blue-line" data-fit="skip"/>
<text x="132" y="136" class="t-head" data-w="150">01 System prompt</text>
<text x="404" y="136" class="t-label" data-w="191">identity, rules, output format</text>
<rect x="112" y="168" width="568" height="52" rx="8" class="f-blue-soft" data-fit="skip"/>
<rect x="112" y="168" width="568" height="52" rx="8" class="w1 nofill s-blue-line" data-fit="skip"/>
<text x="132" y="200" class="t-head" data-w="254">02 Tools and MCP descriptions</text>
<text x="404" y="200" class="t-label" data-w="221">the schema of every callable tool</text>
<rect x="112" y="232" width="568" height="52" rx="8" class="f-orange-soft" data-fit="skip"/>
<rect x="112" y="232" width="568" height="52" rx="8" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="132" y="264" class="t-head" data-w="172">03 Memory and state</text>
<text x="404" y="264" class="t-label" data-w="175">facts kept beyond this call</text>
<rect x="112" y="296" width="568" height="52" rx="8" class="f-orange-soft" data-fit="skip"/>
<rect x="112" y="296" width="568" height="52" rx="8" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="132" y="328" class="t-head" data-w="166">04 Retrieved chunks</text>
<text x="404" y="328" class="t-label" data-w="196">evidence fetched for this turn</text>
<rect x="112" y="360" width="568" height="52" rx="8" class="f-green-soft" data-fit="skip"/>
<rect x="112" y="360" width="568" height="52" rx="8" class="w1 nofill s-green-line" data-fit="skip"/>
<text x="132" y="392" class="t-head" data-w="195">05 Conversation history</text>
<text x="404" y="392" class="t-label" data-w="207">the earlier turns of this session</text>
<rect x="112" y="424" width="568" height="52" rx="8" class="f-purple-soft" data-fit="skip"/>
<rect x="112" y="424" width="568" height="52" rx="8" class="w1 nofill s-purple-line" data-fit="skip"/>
<text x="132" y="456" class="t-head" data-w="156">06 User instruction</text>
<text x="404" y="456" class="t-label" data-w="163">what the user just asked</text>
<path d="M696,108 H704 V216 H696" class="s-blue w1 nofill"/>
<text x="720" y="160" class="t-head f-blue-ink" data-w="104">Stable prefix</text>
<text x="720" y="180" class="t-note" data-w="125">same on every call</text>
<path d="M696,236 H704 V344 H696" class="s-orange w1 nofill"/>
<text x="720" y="288" class="t-head f-orange-ink" data-w="143">Per-turn injection</text>
<text x="720" y="308" class="t-note" data-w="151">assembled for this call</text>
<path d="M696,364 H704 V408 H696" class="s-green w1 nofill"/>
<text x="720" y="384" class="t-head f-green-ink" data-w="99">Growing tail</text>
<text x="720" y="404" class="t-note" data-w="114">longer every turn</text>
<path d="M696,428 H704 V472 H696" class="s-purple w1 nofill"/>
<text x="720" y="448" class="t-head f-purple-ink" data-w="59">Trigger</text>
<text x="720" y="468" class="t-note" data-w="101">small, sent last</text>
<text x="40" y="136" class="t-note" data-w="26">first</text>
<text x="40" y="456" class="t-note" data-w="25">last</text>
<path d="M60,152 L60,433" class="flow" marker-end="url(#ctx-01-six-layer-stack-arrow)"/>
<text x="40" y="504" class="t-note" data-w="570">The order runs from the layers that rarely change to the one that is new on every call.</text>
</svg>
