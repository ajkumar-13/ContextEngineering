<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="596">Layers 03 to 06 share one messages list, in order</text>
<text x="40" y="76" class="t-subtitle" data-w="592">The body printed by snippets/context_inspector.py, in Anthropic Messages shape.</text>
<text x="40" y="128" class="t-code13" data-w="8">{</text>
<text x="56" y="152" class="t-code13" data-w="397">"system": "You are a helpful research assistant.",</text>
<text x="56" y="176" class="t-code13" data-w="80">"tools": [</text>
<text x="72" y="200" class="t-code13" data-w="8">{</text>
<text x="88" y="224" class="t-code13" data-w="175">"name": "search_docs",</text>
<text x="88" y="248" class="t-code13" data-w="334">"description": "Search the product docs.",</text>
<text x="88" y="272" class="t-code13" data-w="135">"input_schema": {</text>
<text x="104" y="296" class="t-code13" data-w="127">"type": "object"</text>
<text x="88" y="320" class="t-code13" data-w="8">}</text>
<text x="72" y="344" class="t-code13" data-w="8">}</text>
<text x="56" y="368" class="t-code13" data-w="16">],</text>
<text x="56" y="392" class="t-code13" data-w="104">"messages": [</text>
<text x="72" y="416" class="t-code13" data-w="548">{"role": "user", "content": "&lt;memory&gt;User prefers Python.&lt;/memory&gt;"},</text>
<text x="72" y="440" class="t-code13" data-w="397">{"role": "assistant", "content": "Acknowledged."},</text>
<text x="72" y="464" class="t-code13" data-w="595">{"role": "user", "content": "&lt;chunk&gt;Webhooks are HTTP callbacks.&lt;/chunk&gt;"},</text>
<text x="72" y="488" class="t-code13" data-w="421">{"role": "user", "content": "How do webhooks work?"},</text>
<text x="72" y="512" class="t-code13" data-w="532">{"role": "assistant", "content": "A webhook is an HTTP callback."},</text>
<text x="72" y="536" class="t-code13" data-w="603">{"role": "user", "content": "Now show me how to rotate the signing secret."}</text>
<text x="56" y="560" class="t-code13" data-w="16">],</text>
<text x="56" y="584" class="t-code13" data-w="230">"model": "claude-sonnet-4-5",</text>
<text x="56" y="608" class="t-code13" data-w="143">"max_tokens": 1024</text>
<text x="40" y="632" class="t-code13" data-w="8">}</text>
<path d="M692,138 H700 V156 H692" class="s-blue w1 nofill"/>
<text x="712" y="152" class="t-label f-blue-ink" data-w="124">01 System prompt</text>
<path d="M692,186 H700 V348 H692" class="s-blue w1 nofill"/>
<text x="712" y="272" class="t-label f-blue-ink" data-w="211">02 Tools and MCP descriptions</text>
<path d="M692,402 H700 V444 H692" class="s-orange w1 nofill"/>
<text x="712" y="428" class="t-label f-orange-ink" data-w="143">03 Memory and state</text>
<path d="M692,450 H700 V468 H692" class="s-orange w1 nofill"/>
<text x="712" y="464" class="t-label f-orange-ink" data-w="137">04 Retrieved chunks</text>
<path d="M692,474 H700 V516 H692" class="s-green w1 nofill"/>
<text x="712" y="500" class="t-label f-green-ink" data-w="159">05 Conversation history</text>
<path d="M692,522 H700 V540 H692" class="s-purple w1 nofill"/>
<text x="712" y="536" class="t-label f-purple-ink" data-w="127">06 User instruction</text>
<path d="M692,570 H700 V612 H692" class="brace"/>
<text x="712" y="600" class="t-note" data-w="159">call settings, not a layer</text>
<text x="40" y="684" class="t-note" data-w="643">Layers 01 and 02 have top-level fields of their own; the order inside messages is the layer order.</text>
</svg>
