<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-request-xray-title" aria-describedby="ctx-02-request-xray-desc">
<title id="ctx-02-request-xray-title">Layers 03 to 06 share one messages list, in order</title>
<desc id="ctx-02-request-xray-desc">The request body that snippets/context_inspector.py prints, in Anthropic Messages shape, with a bracket from each entry to its layer. The system field is 01 System prompt. The one tool object in the tools list is 02 Tools and MCP descriptions. In the messages list, the memory message and the assistant reply Acknowledged are 03 Memory and state, the chunk message is 04 Retrieved chunks, the earlier question about webhooks and its answer are 05 Conversation history, and the last user message, asking how to rotate the signing secret, is 06 User instruction. The model and max_tokens fields are call settings, not a layer.</desc>
