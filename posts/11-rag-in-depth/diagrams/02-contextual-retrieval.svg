  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-border { fill: var(--ctx-border); }
  .f-ink-muted { fill: var(--ctx-ink-muted); }
  .s-ink { stroke: var(--ctx-ink); }
  .s-ink-muted { stroke: var(--ctx-ink-muted); }
  .s-rule { stroke: var(--ctx-rule); }
</style>
<defs>
<marker id="ctx-02-contextual-retrieval-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="697">Chunk context plus reranking cut failed retrievals by 67%</text>
<text x="40" y="76" class="t-subtitle" data-w="744">Cited: Anthropic, "Introducing Contextual Retrieval" (September 2024). Values as the page states them.</text>
<text x="40" y="128" class="t-head" data-w="216">The page's example chunk</text>
<rect x="40" y="144" width="312" height="156" rx="8" class="card"/>
<text x="56" y="176" class="t-head" data-w="55">Before</text>
<text x="56" y="208" class="t-label" data-w="216">The company's revenue grew by</text>
<text x="56" y="232" class="t-label" data-w="199">3% over the previous quarter.</text>
<rect x="384" y="144" width="536" height="156" rx="8" class="card"/>
<text x="400" y="176" class="t-head" data-w="271">After: model-written context first</text>
<rect x="392" y="188" width="520" height="76" rx="4" class="f-border" data-fit="skip"/>
<text x="400" y="208" class="t-label" data-w="327">This chunk is from an SEC filing on ACME corp's</text>
<text x="400" y="232" class="t-label" data-w="316">performance in Q2 2023; the previous quarter's</text>
<text x="400" y="256" class="t-label" data-w="173">revenue was $314 million.</text>
<text x="400" y="280" class="t-label" data-w="419">The company's revenue grew by 3% over the previous quarter.</text>
<text x="40" y="360" class="t-head" data-w="438">Top-20 retrieval failure rate (1 minus recall@20), cited</text>
<circle cx="48" cy="388" r="5" class="nofill s-ink-muted w15"/>
<text x="72" y="392" class="t-label" data-w="98">baseline, 5.7%</text>
<path d="M208,382 L214,388 L208,394 L202,388 Z" class="nofill s-ink w15"/>
<text x="232" y="392" class="t-label" data-w="123">with the technique</text>
<g data-grid="skip">
<path d="M312,416V576M496,416V576M680,416V576M864,416V576" class="gridline"/>
<text x="312" y="596" text-anchor="middle" class="t-tick" data-w="20">0%</text>
<text x="496" y="596" text-anchor="middle" class="t-tick" data-w="20">2%</text>
<text x="680" y="596" text-anchor="middle" class="t-tick" data-w="20">4%</text>
<text x="864" y="596" text-anchor="middle" class="t-tick" data-w="20">6%</text>
<path d="M312,576H864" class="axis"/>
<path d="M652.4,442.67H836.4" class="s-rule w15 nofill"/>
<circle cx="836.4" cy="442.67" r="5" class="nofill s-ink-muted w15"/>
<path d="M652.4,436.67 L658.4,442.67 L652.4,448.67 L646.4,442.67 Z" class="nofill s-ink w15"/>
<text x="40" y="447.67" class="t-label" data-w="208">Contextual embeddings, −35%</text>
<text x="846.4" y="447.67" class="t-value f-ink-muted" data-w="35">5.7%</text>
<text x="642.4" y="447.67" text-anchor="end" class="t-value f-ink-muted" data-w="35">3.7%</text>
<path d="M578.8,496H836.4" class="s-rule w15 nofill"/>
<circle cx="836.4" cy="496" r="5" class="nofill s-ink-muted w15"/>
<path d="M578.8,490 L584.8,496 L578.8,502 L572.8,496 Z" class="nofill s-ink w15"/>
<text x="40" y="501" class="t-label" data-w="176">+ contextual BM25, −49%</text>
<text x="846.4" y="501" class="t-value f-ink-muted" data-w="35">5.7%</text>
<text x="568.8" y="501" text-anchor="end" class="t-value f-ink-muted" data-w="35">2.9%</text>
<path d="M486.8,549.33H836.4" class="s-rule w15 nofill"/>
<circle cx="836.4" cy="549.33" r="5" class="nofill s-ink-muted w15"/>
<path d="M486.8,543.33 L492.8,549.33 L486.8,555.33 L480.8,549.33 Z" class="nofill s-ink w15"/>
<text x="40" y="554.33" class="t-label" data-w="125">+ reranking, −67%</text>
<text x="846.4" y="554.33" class="t-value f-ink-muted" data-w="35">5.7%</text>
<text x="476.8" y="554.33" text-anchor="end" class="t-value f-ink-muted" data-w="35">1.9%</text>
</g>
<text x="588" y="620" text-anchor="middle" class="t-note" data-w="435">failure rate: percent of relevant chunks not retrieved in the top 20</text>
<text x="40" y="684" class="t-note" data-w="465">Each reduction is from the same 5.7% baseline: the techniques stack.</text>
</svg>
