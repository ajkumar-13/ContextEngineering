text><text xml:space="preserve" x="40" y="361.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">The contextual-embeddings step alone is the largest single offline improvement most teams will ever ship.</text><text xml:space="preserve" x="40" y="383.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">It runs once per chunk at index time, and the call is cacheable — so the cost does not recur on any user turn.</text><text xml:space="preserve" x="40" y="405.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Reaching for a newer embedding model before doing this is the most common premature optimisation in the space.</text>
