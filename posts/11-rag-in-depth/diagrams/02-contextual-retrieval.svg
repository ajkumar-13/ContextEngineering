<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-contextual-retrieval-title" aria-describedby="ctx-02-contextual-retrieval-desc">
<title id="ctx-02-contextual-retrieval-title">Chunk context plus reranking cut failed retrievals by 67%</title>
<desc id="ctx-02-contextual-retrieval-desc">Two parts, cited from Anthropic's page Introducing Contextual Retrieval (September 2024). Top, the page's example: the chunk 'The company's revenue grew by 3% over the previous quarter.' and the same chunk with a model-written context prepended, naming a U.S. Securities and Exchange Commission (SEC) filing on ACME corp's performance in Q2 2023 and a previous-quarter revenue of $314 million. Bottom, a dumbbell chart of the top-20 retrieval failure rate, 1 minus recall@20, each row from the 5.7% baseline, hollow circle, to the rate with the technique, hollow diamond: contextual embeddings 3.7% (minus 35%), plus contextual BM25 2.9% (minus 49%), plus reranking 1.9% (minus 67%).</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
