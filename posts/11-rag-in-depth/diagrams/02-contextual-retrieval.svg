<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">Contextual retrieval, and the measured reduction in retrieval failures</title>
  <desc id="d">A hand-drawn figure in two halves. The left half shows what a chunk looks like after contextual retrieval: a bracketed document and section header, then a bracketed summary naming what the document defines, then the chunk text itself, with notes that the title and section path are free while the summary costs one cheap call per chunk, once. The right half shows three bars on one scale for the reduction in retrieval failures reported by Anthropic in 2024: thirty-five per cent from contextual embeddings alone, forty-nine per cent once a contextual BM25 index is added, and sixty-seven per cent once a reranker is added on top. Captions state that the contextual-embeddings step alone is the largest single offline improvement most teams will ship, that it runs once at index time and is cacheable, and that reaching for a newer embedding model first is the most common premature optimisation in the space.</desc>

