<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-chunking-title" aria-describedby="ctx-01-chunking-desc">
<title id="ctx-01-chunking-title">A fixed-length split cuts a fact; whole sentences keep it</title>
<desc id="ctx-01-chunking-desc">One 38-word section of the post's toy corpus, drawn to scale at one width per word, split two ways. Top, its four sentences of 11, 10, 11 and 6 words. Middle, a fixed-length split every 30 words: a piece of 30 words and one of 8, with the cut, marked in red, inside sentence 3 between 8:00 and to 18:00. Bottom, the companion's sentence-aware chunker with a 30-word target and 8 words of overlap: chunk 1 holds sentences 1 and 2, 21 words, and chunk 2 holds sentences 2 to 4, 27 words; sentence 2, 10 words, is in both.</desc>
