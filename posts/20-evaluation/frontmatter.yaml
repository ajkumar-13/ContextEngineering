  - id: o1
    text: "Place a check on the four-tier evaluation pyramid and pick its metric family (deterministic, LLM judge or human) and its scoring shape (absolute or pairwise)."
  - id: o2
    text: "Wire a regression gate on a golden set that blocks a pull request when a metric drops by more than its tolerance, and read which cases flipped."
  - id: o3
    text: "Define faithfulness, answer relevancy, context precision and context recall, and say which inputs each needs and what failure each catches."
