 x="372" y="199.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">noisier than a regex.</text><text xml:space="preserve" x="372" y="227.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The workhorse of tier-3 eval. Has its own</text><text xml:space="preserve" x="372" y="239.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">biases — see the next figure.</text><path d="M690.19 94.19C779.68 93.28 870.78 91.08 920.08 91.65C936.51 90.2 942.15 99 944.52 116.16C941.3 161.1 942.07 210.73 943.74 260.21C941.64 276.61 934.7 286.23 919.9 286.05C853.32 285.15 786.07 283.16 686.39 285.47C673.01 284.6 665.33 276.23 662.31 258.65C662.4 225.67 662.84 189.07 666.14 114.69C662.54 99.41 674.35 93.33 689.6 91.63C688 92 688 92 688 92" fill="var(--ce-surface)" stroke="none"/><path d="M687.41 91.1C765.08 92.43 846.41 93.89 919.38 91.92M687.66 92.8C742.69 94.84 798.1 94.64 919.89 92.04M920 92C934.68 90.12 944.12 100.3 944.28 117.31M918.47 91.93C936.37 93.97 943.01 100.3 946.16 114.58M945.64 115.11C944.8 148.96 944.54 183.5 942.83 260.8M943.03 115.38C944.83 172.43 944.82 228.8 943.88 260.49M944 260C944.17 275.06 935.24 284.34 919.3 282.12M944.18 260.65C943.96 274.2 936.42 285.09 918.94 284.29M920.68 285.37C863.87 285.3 805.87 284.85 688.25 283.54M920.09 283.31C850.7 285.2 782.96 284.98 688.49 284.17M688 284C670.61 283.01 664.48 277.03 663.77 260.49M689.12 285.6C674.1 283.32 661.93 278.07 662.61 261.44M664.57 258.5C661.48 222.79 661.21 185.57 662.72 115.36M664.3 259.28C665.3 226.04 666.32 190.85 664.93 115.28M664 116C664.38 101.16 673.21 92.32 689.59 92.34M662.13 115.02C663.1 99.86 670.79 90.68 690.11 91.74M688 92C688 92 688 92 688 92M688 92C688 92 688 92 688 92" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M670.18 102.16C670.21 165.87 670.09 231.8 669.47 275.49M668.89 100.58C669.54 156.83 668.82 213.18 669.53 275.36" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="684" y="113.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ce-ink)">Human</text><text xml:space="preserve" x="684" y="135.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">A person labels each output good, bad, or</text><text xml:space="preserve" x="684" y="147.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">partial against a rubric.</text><text xml:space="preserve" x="684" y="187.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Slowest and most expensive.</text><text xml:space="preserve" x="684" y="227.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The only ground truth for tone and</text><text xml:space="preserve" x="684" y="239.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">helpfulness. Fifty to a hundred per</text><text xml:space="preserve" x="684" y="252.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">release.</text><text xml:space="preserve" x="40" y="309.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Deterministic where you can, judge for the bulk, human on a regular sample to keep the judge honest.</text><path d="M59.81 331.23C162.31 330.15 267.08 328.7 444.96 330.6C459.84 327.88 461.8 335.54 463.29 350.93C465.05 368.96 463.33 384.69 463.33 422.62C463.52 435.49 457.8 442.12 443.2 440.6C335.6 440.58 224.53 441.4 59 440.46C47.89 440.12 39.78 435.85 40.44 423.1C38.43 404.95 41.8 386.23 41.38 346.47C39.48 335.13 48.64 331.4 58.79 327.61C58.33 330 58.33 330 58.33 330" fill="var(--ce-surface)" stroke="none"/><path d="M59.5 329.97C208.14 329.01 357.65 331.01 446.8 328.97M57.81 329.67C150.25 331.45 241.28 332.1 446.24 329.94M445.67 330C459.45 330.24 465.77 338 464.38 346.4M447.04 329.42C457.16 331.55 465.22 334.61 466.22 347.18M465.84 349.43C465.16 364.91 464.72 384.9 463.23 419.67M463.96 347.4C464.08 368.7 464.49 390.32 463.05 421.97M464 421.67C464 435.48 455.91 438.7 445.03 441.13M463.78 423.43C464.44 432.95 457.6 438.88 446.93 441.78M445.71 439.38C366.15 441.61 285.01 441.84 57.92 440.11M446.07 439.8C360.57 442.16 276.58 442.05 57.86 439.93M58.33 440C45.61 439.61 40.72 431.94 40.14 422.29M58.98 441.65C48.03 437.72 41.76 433.64 42.1 423.16M38.51 419.68C38.8 398.42 38.65 378.86 38.04 349.03M40.22 421.38C40.4 406.12 40.3 389.28 39.51 347.53M40 348.33C40.27 334.58 47.66 330.15 58.76 329.71M40.09 346.66C39.19 336.28 48.35 329.2 60.3 329.45M58.33 330C58.33 330 58.33 330 58.33 330M58.33 330C58.33 330 58.33 330 58.33 330" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M45.39 338.38C45.85 359.36 45.48 379.35 44.67 430.49M44.6 338.88C45.31 368.86 45.07 398.35 45 431.26" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="350.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--ce-ink)">Pairwise</text><text xml:space="preserve" x="60" y="371.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Show two outputs, ask which is better. A relative judgement is</text><text xml:space="preserve" x="60" y="383.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">easier and more stable than pinning an absolute number, which is</text><text xml:space="preserve" x="60" y="396.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">why human-preference leaderboards are built on it. Use it to pick</text><text xml:space="preserve" x="60" y="408.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">between two prompt or model variants. Carries position bias.</text><path d="M514.92 331.49C646.31 328.2 779.77 330.29 903.14 331.52C914.43 329.93 917.61 333.56 918.58 347.86C917.95 375.29 921.5 408.32 922.07 419.32C921.33 432.34 913.75 442.05 903.05 438.29C749.26 438.84 592.87 439.6 513.4 440.58C503.59 439.85 495.64 433.12 495.43 423.2C495.34 395.63 495.19 372.2 496.21 349.12C495.27 338.62 501.78 329.95 514.14 330.91C514.33 330 514.33 330 514.33 330" fill="var(--ce-surface)" stroke="none"/><path d="M514.72 329.98C641.52 331.01 769.92 332.24 901.68 331.09M514.33 330.51C660.33 329.31 806.84 329.4 901.1 330.05M901.67 330C914.25 330.89 918.72 334.91 920.44 347.4M900.69 331.42C915.82 329.34 919.86 335.55 920.28 350.62M919.68 349.42C919.62 374.46 920.22 403.9 918.31 423.21M920.77 348.65C920.17 372.49 919.11 394.38 919.44 421.57M920 421.67C921.05 432.93 915.22 438.34 901.08 439.42M920.13 422.35C922.03 435.42 913.86 438.94 902.29 438.03M902.81 439.49C762.24 438.24 624.71 438.79 513.58 439.01M901.42 440.29C822.89 442.13 744.56 442.89 513.89 439.48M514.33 440C501.55 441.09 496.29 435.39 494.06 421.23M514.7 439.39C503.26 440.75 495.35 432.97 494.18 419.9M497.9 421.68C495.44 404.7 494.23 389.53 497.09 347.51M496.46 422.21C494.87 395.54 496.4 368.96 495.56 348.91M496 348.33C496.78 334.76 501 328.34 512.96 331.63M496.07 347.4C494.58 337.11 501.73 332.13 512.28 330.6M514.33 330C514.33 330 514.33 330 514.33 330M514.33 330C514.33 330 514.33 330 514.33 330" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M500.6 338.38C500.92 372.83 499.38 405.13 501.93 430.26M501.12 338.53C500.65 362.82 500.7 387.65 501.04 431.38" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="516" y="350.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--ce-ink)">Absolute</text><text xml:space="preserve" x="516" y="371.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Rate one output on its own against a rubric. Yields a single number</text><text xml:space="preserve" x="516" y="383.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">per output you can track over time and threshold in CI, with no</text><text xml:space="preserve" x="516" y="396.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">reference candidate needed. Use it to guard the winner against</text><text xml:space="preserve" x="516" y="408.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">regressions.</text><text xml:space="preserve" x="40" y="471.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">The usual arrangement: pairwise to choose between variants, absolute to stop the winner from sliding back.</text>
</svg>
