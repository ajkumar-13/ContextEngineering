<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">The three metric families and the two scoring shapes</title>
  <desc id="d">A hand-drawn figure in two rows. The upper row gives three ways to score. Deterministic scoring uses exact match, schema validity, regex, and citation checks: cheap, repeatable, and narrow, for wherever the answer space can be enumerated. LLM-as-judge has a second model score the first against a written rubric: wide reach, far cheaper than people, noisier than a regex, and the workhorse of tier-three evaluation. Human labelling is slowest and most expensive but the only ground truth for tone and helpfulness, sampled fifty to a hundred per release. The lower row gives two orthogonal scoring shapes. Pairwise shows two outputs and asks which is better, which is more stable than an absolute number and is how preference leaderboards work, but carries position bias. Absolute rates one output against a rubric and yields a single trackable number that can threshold in CI. A caption gives the usual arrangement: pairwise to choose, absolute to guard.</desc>

