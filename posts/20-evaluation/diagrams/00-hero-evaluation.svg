)">1 · UNIT</text><text xml:space="preserve" x="104" y="286.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">pure functions · chunkers · parsers · schema</text><text xml:space="preserve" x="40" y="320.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Cadence, bottom to top: every commit · every relevant PR · every load-bearing PR · continuous monitoring.</text><path d="M63.97 291.94C60.14 218.54 59.94 148.85 62.79 100.81M61.81 289.3C62.78 228.5 61.58 167.84 62.88 100.6" fill="none" stroke="var(--ce-ink-subtle)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M57.51 110.04 L62 100 L66.49 110.04" fill="none" stroke="var(--ce-ink-subtle)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="74" y="117.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">less often</text><text xml:space="preserve" x="74" y="133.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">more cost</text><text xml:space="preserve" x="40" y="341.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Every tier above unit rests on a golden set. Grow it from real failures — every production incident becomes one new case —</text><text xml:space="preserve" x="40" y="363.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">and keep it small and human-reviewed: fifty carefully labelled cases catch more regressions than a thousand noisy ones.</text>
