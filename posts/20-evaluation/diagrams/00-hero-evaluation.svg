<rect x="104" y="392" width="400" height="72" class="w1 nofill s-border" data-fit="skip"/>
<text x="304" y="432" text-anchor="middle" class="t-head" data-w="34">Unit</text>
<text x="568" y="424" class="t-label" data-w="296">deterministic code: chunker, parser, schema</text>
<text x="568" y="448" class="t-note" data-w="91">every commit</text>
