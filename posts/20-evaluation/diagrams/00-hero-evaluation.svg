<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="t d">
  <title id="t">The four-layer evaluation pyramid</title>
  <desc id="d">A hand-drawn pyramid of four tiers drawn to scale, widest at the base. Tier one, unit, covers pure functions, chunkers, parsers, and schema validators and runs on every commit at near-zero cost. Tier two, component, covers the retriever, reranker, and judge, each with its own metric and fixtures, and runs on every relevant pull request. Tier three, end-to-end, runs gold fixtures through the full pipeline as a regression gate on every load-bearing pull request. Tier four, online, is production traffic and approval rate, monitored continuously. An arrow up the left side marks that each tier up runs less often and costs more. A caption states that every tier above unit rests on a golden set grown from real failures, kept small and human-reviewed, because fifty carefully labelled cases catch more regressions than a thousand noisy ones.</desc>

