<defs>
<marker id="ctx-00-hero-evaluation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="649">Four tiers, one gate, and a loop back from production</text>
<text x="40" y="76" class="t-subtitle" data-w="631">Up the pyramid each tier runs less often and costs more per run: an order, not numbers.</text>
<rect x="224" y="128" width="160" height="72" class="f-neutral-soft" data-fit="skip"/>
<rect x="224" y="128" width="160" height="72" class="w1 nofill s-border" data-fit="skip"/>
