<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-evaluation-title" aria-describedby="ctx-00-hero-evaluation-desc">
<title id="ctx-00-hero-evaluation-title">Four tiers, one gate, and a loop back from production</title>
<desc id="ctx-00-hero-evaluation-desc">A step pyramid of four tiers, narrow at the top: Online, production traffic and its signals, always on, the slowest loop; End-to-end, the full pipeline on golden tasks, every pull request touching the answer; Component, retriever, reranker and classifier each alone, every pull request touching it; Unit, deterministic code such as the chunker, parser and schema, every commit. An arrow up the side reads rarer and costlier per run. A dashed line separates the online tier from the three offline tiers. Below, a golden set card feeds a CI gate card that blocks a drop larger than its tolerance, and an arrow carries every online incident back into the golden set as a new case. No numbers are drawn.</desc>
<style>
