<text x="568" y="248" class="t-label" data-w="213">the full pipeline on golden tasks</text>
<text x="568" y="272" class="t-note" data-w="259">every pull request touching the answer</text>
<rect x="144" y="304" width="320" height="72" class="f-neutral-soft" data-fit="skip"/>
