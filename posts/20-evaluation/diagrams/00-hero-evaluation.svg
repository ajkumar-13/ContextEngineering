<text x="568" y="160" class="t-label" data-w="215">production traffic and its signals</text>
<text x="568" y="184" class="t-note" data-w="185">always on; the slowest loop</text>
<rect x="184" y="216" width="240" height="72" class="f-neutral-soft" data-fit="skip"/>
<rect x="184" y="216" width="240" height="72" class="w1 nofill s-border" data-fit="skip"/>
