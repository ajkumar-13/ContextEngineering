<text x="528" y="488" text-anchor="middle" class="t-note" data-w="106">frequent, cheap</text>
<text x="528" y="120" text-anchor="middle" class="t-note" data-w="89">rarer, costlier</text>
<rect x="40" y="520" width="400" height="96" rx="8" class="card"/>
<text x="56" y="552" class="t-head" data-w="88">Golden set</text>
<text x="56" y="584" class="t-label" data-w="302">human-checked cases with expected outputs</text>
<text x="56" y="608" class="t-label" data-w="287">under the component and end-to-end tiers</text>
<rect x="520" y="520" width="400" height="96" rx="8" class="card"/>
<text x="536" y="552" class="t-head" data-w="58">CI gate</text>
<text x="536" y="584" class="t-label" data-w="254">blocks a drop larger than its tolerance</text>
<text x="536" y="608" class="t-label" data-w="141">on every pull request</text>
<path d="M440,568 L517,568" class="flow" marker-end="url(#ctx-00-hero-evaluation-arrow)"/>
<path d="M224,164 L64,164 L64,517" class="flow" marker-end="url(#ctx-00-hero-evaluation-arrow)"/>
<text x="80" y="156" class="t-note" data-w="53">incident</text>
<text x="40" y="684" class="t-note" data-w="597">Every online incident becomes a golden case, so the gate guards against it from then on.</text>
</svg>
