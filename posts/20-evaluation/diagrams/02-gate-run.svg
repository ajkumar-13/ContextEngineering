<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-gate-run-title" aria-describedby="ctx-02-gate-run-desc">
<title id="ctx-02-gate-run-title">A drop must pass the tolerance line to block a change</title>
<desc id="ctx-02-gate-run-desc">A horizontal bar chart of the drop from the baseline, computed by snippets/eval_gate.py on twenty golden cases, with a dashed vertical line at the gate's tolerance of 0.05. BM25 dropped, recall@3 0.025; BM25 dropped, answer match 0.000; headers dropped, recall@3 0.075; headers dropped, answer match 0.050; both dropped, recall@3 0.150; both dropped, answer match 0.050. Red bars are the metrics that block the change: recall@3 for headers dropped and for both dropped. The answer match drops of 0.050 sit exactly on the line and pass. BM25 dropped passes; the other two changes are blocked.</desc>
