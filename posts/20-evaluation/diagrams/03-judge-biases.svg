<defs>
<marker id="ctx-03-judge-biases-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="550">Judges flip under a swap and fall for padding</text>
<text x="40" y="76" class="t-subtitle" data-w="684">Cited: Zheng et al. (2023), Tables 2 and 3 and section 3.4. Hollow marks are the paper's values.</text>
<text x="40" y="128" class="t-head" data-w="318">Position bias: verdict kept after a swap</text>
<text x="496" y="128" class="t-head" data-w="331">Verbosity bias: padded answer preferred</text>
<g data-grid="skip">
<path d="M176,144V392M288,144V392M400,144V392" class="gridline"/>
<text x="176" y="412" text-anchor="middle" class="t-tick" data-w="20">0%</text>
<text x="288" y="412" text-anchor="middle" class="t-tick" data-w="28">50%</text>
<text x="400" y="412" text-anchor="middle" class="t-tick" data-w="35">100%</text>
<path d="M176,392H400" class="axis"/>
<path d="M229.31,169 L235.31,175 L229.31,181 L223.31,175 Z" class="nofill s-ink w15"/>
<text x="40" y="180" class="t-label" data-w="69">Claude-v1</text>
<text x="239.31" y="180" class="t-value f-ink-muted" data-w="43">23.8%</text>
<path d="M279.49,231 L285.49,237 L279.49,243 L273.49,237 Z" class="nofill s-ink w15"/>
