<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-judge-biases-title" aria-describedby="ctx-03-judge-biases-desc">
<title id="ctx-03-judge-biases-title">Judges flip under a swap and fall for padding</title>
<desc id="ctx-03-judge-biases-desc">Two cited dot charts from Zheng et al. (2023), hollow diamonds on axes from 0 to 100 percent. Left, position bias, Table 2, default prompt: the share of verdicts unchanged when the two answers swap places, Claude-v1 23.8%, GPT-3.5 46.2%, GPT-4 65.0%, GPT-4, few-shot 77.5% (few-shot, section 3.4). Right, verbosity bias, Table 3: the share of 23 answers where the judge preferred a copy padded with a rephrased list, Claude-v1 91.3%, GPT-3.5 91.3%, GPT-4 8.7%.</desc>
<style>
