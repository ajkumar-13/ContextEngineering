<text x="331.6" y="304" class="t-value f-ink-muted" data-w="43">65.0%</text>
<path d="M349.6,355 L355.6,361 L349.6,367 L343.6,361 Z" class="nofill s-ink w15"/>
<text x="40" y="366" class="t-label" data-w="111">GPT-4, few-shot</text>
<text x="359.6" y="366" class="t-value f-ink-muted" data-w="43">77.5%</text>
</g>
<text x="288" y="436" text-anchor="middle" class="t-note" data-w="191">percent of pairs, both orders</text>
<g data-grid="skip">
<path d="M600,144V392M728,144V392M856,144V392" class="gridline"/>
<text x="600" y="412" text-anchor="middle" class="t-tick" data-w="20">0%</text>
<text x="728" y="412" text-anchor="middle" class="t-tick" data-w="28">50%</text>
<text x="856" y="412" text-anchor="middle" class="t-tick" data-w="35">100%</text>
<path d="M600,392H856" class="axis"/>
<path d="M833.73,179.33 L839.73,185.33 L833.73,191.33 L827.73,185.33 Z" class="nofill s-ink w15"/>
<text x="496" y="190.33" class="t-label" data-w="69">Claude-v1</text>
<text x="843.73" y="190.33" class="t-value f-ink-muted" data-w="43">91.3%</text>
<path d="M833.73,262 L839.73,268 L833.73,274 L827.73,268 Z" class="nofill s-ink w15"/>
<text x="496" y="273" class="t-label" data-w="57">GPT-3.5</text>
<text x="843.73" y="273" class="t-value f-ink-muted" data-w="43">91.3%</text>
<path d="M622.27,344.67 L628.27,350.67 L622.27,356.67 L616.27,350.67 Z" class="nofill s-ink w15"/>
<text x="496" y="355.67" class="t-label" data-w="45">GPT-4</text>
<text x="632.27" y="355.67" class="t-value f-ink-muted" data-w="35">8.7%</text>
</g>
<text x="728" y="436" text-anchor="middle" class="t-note" data-w="203">percent of 23 padded answers</text>
<text x="40" y="504" class="t-note" data-w="570">Mitigate both before trusting a judge: swap the order, and test it on padded answers.</text>
</svg>
