<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-build-rag-chatbot-title" aria-describedby="ctx-00-hero-build-rag-chatbot-desc">
<title id="ctx-00-hero-build-rag-chatbot-title">Two lanes build and answer; a third replays them</title>
<desc id="ctx-00-hero-build-rag-chatbot-desc">Three lanes of the companion code/28-rag-chatbot. Offline, run by python -m rag.ingest: corpus files (.md and .txt), chunk (500 words, 80 overlap), header (one sentence, OpenAI), embed (Voyage AI), into a Chroma collection that holds the chunks of layer 04. The collection is searched on every question by the online lane, run by answer(): candidates (dense with Voyage AI and BM25, top-50 each), fuse (RRF, k = 60, top-50), re-rank (Cohere, top-5), pack (layers 01, 04 and 06 in bookend order, in the per-turn colour) and generate (OpenAI, answer and sources). The evaluation lane: 3 fixtures, eval.py replaying them through answer(), Ragas computing four means with an OpenAI judge, and a regression gate on an absolute drop of 0.05, drawn dashed because the companion does not have it.</desc>
