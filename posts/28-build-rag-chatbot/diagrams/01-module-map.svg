<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-module-map-title" aria-describedby="ctx-01-module-map-desc">
<title id="ctx-01-module-map-title">Every part traces to a post, and most depart from it</title>
<desc id="ctx-01-module-map-desc">A table with one row per part of the companion and four columns: file, function, the earlier post and section it implements, and where it departs from it. ingest.py chunk, post 11 section 2, counts words, not tokens. contextual_header, post 11 section 2, sees the title, not the document. ingest_path, post 10 section 8, never deletes a stale chunk. retrieve.py rrf_merge, post 09 section 3, ranks from 0, RRF with k = 59. rerank, post 09 section 4, skipped if the key is named CO_API_KEY. prompt.py pack, post 09 section 5, as post 09. system.md, four blocks, post 14 section 2, no tool-use guidance because there are no tools. llm.py chat_llm, post 05 section 4, a prefix perhaps too short to cache. eval.py run, post 20 section 5, three fixtures and no gate.</desc>
