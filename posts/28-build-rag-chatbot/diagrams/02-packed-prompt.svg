"439.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink)">Every chunk carries a stable, model-readable header, so a cited source can be rendered to the user and grepped in a trace.</text><text xml:space="preserve" x="40" y="461.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink-muted)">Citation accuracy is something to measure, not assume: a model can attach the wrong header or invent one.</text><text xml:space="preserve" x="40" y="485.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink-muted)">If the answer is not in the sources, the rule says so explicitly — which is what turns &quot;no result&quot; from a hallucination into an answer.</text>
