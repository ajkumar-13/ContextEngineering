<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">Bookend packing: what the assembled prompt actually looks like</title>
  <desc id="d">A hand-drawn figure. On the left, five chunks ranked by the cross-encoder from first to fifth, shaded by rank. An arrow leads to the assembled prompt on the right, which opens with the five-block system prompt carrying the rule to use only the sources below and cite in brackets, then a sources block. Inside that block the ordering is bookended: the best-ranked chunk sits first, the second-best sits last, and the third, fourth, and fifth fill the middle, where attention is weakest anyway. The user's question is placed last of all. Captions note that every chunk carries a stable model-readable header so a cited source can be rendered and grepped, that citation accuracy is something to measure rather than assume because a model can attach the wrong header, and that an explicit rule for &quot;not in the sources&quot; is what turns a missing answer from a hallucination into an answer.</desc>

