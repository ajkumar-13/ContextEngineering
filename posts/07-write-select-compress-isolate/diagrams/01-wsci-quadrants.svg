S",ui-rounded,cursive' font-size="18" fill="var(--ce-ink)">WRITE</text><text xml:space="preserve" x="198" y="159.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Move it out of the window, for later.</text><text xml:space="preserve" x="198" y="188.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">· Scratchpads and task.md</text><text xml:space="preserve" x="198" y="208.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">· Persistent memory files</text><text xml:space="preserve" x="198" y="228.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">· Plan files and specs</text><path d="M198.13 245.99C295.02 246.75 391.69 246.34 518.37 245.79M197.87 246.12C310.4 246.57 422.34 246.36 518.18 245.9" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="198" y="264.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">The filesystem becomes a cheap,</text><text xml:space="preserve" x="198" y="277.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">durable extension of context.</text><path d="M579.72 107.15C663.81 110.62 743.66 109.84 894.88 108.9C913.46 105.41 918.1 115.8 920.34 133.99C918.24 167.49 921.63 202.45 920.43 272.09C919.39 288.52 914.59 300.22 895.56 296.87C793.1 297.44 694.35 300.35 580.01 296.51C563.64 298.53 558.59 288.25 555.36 275.28C556.3 234.77 557.16 197.03 556.55 131.36C558.39 117.58 565.63 106.37 581.44 105.86