<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">The WSCI framework: Write, Select, Compress, Isolate</title>
  <desc id="d">A hand-drawn two-by-two grid of the four primitive operations on a context window. The columns split on whether the window ends up holding fewer tokens or more of them; the rows on whether the move crosses the window boundary or changes the shape of the window itself. Write moves information out of the window for later, using scratchpads, memory files, and plan files, so the filesystem becomes a durable extension of context. Select pulls information in for now, through retrieval, tool lookups, and memory recall. Compress shrinks what is already inside, through rolling summaries and compaction, buying space at the price of fidelity. Isolate splits the work into separate windows using sub-agents and parallel workers, which is powerful and dangerous, with a single agent the right default.</desc>

