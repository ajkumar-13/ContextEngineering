default.</text><text xml:space="preserve" x="40" y="533.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">No layer needs all four, which is why the framework stays small. The operations chain: memory is Written before it is Selected.</text>
