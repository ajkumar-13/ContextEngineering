<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-wsci-quadrants-title" aria-describedby="ctx-01-wsci-quadrants-desc">
<title id="ctx-01-wsci-quadrants-title">Four operations, one cell each</title>
<desc id="ctx-01-wsci-quadrants-desc">A two-by-two grid of the four operations on a context window. The columns are the direction: into a window, out of the window. The rows are the scope: one window, several windows. Select sits at into a window and one window; canonical technique: retrieve, rerank, pack. Compress sits at out of the window and one window; canonical technique: rolling summary. Isolate sits at into a window and several windows; canonical technique: sub-agents, one window each. Write sits at out of the window and several windows; canonical technique: memory store, scratchpad. Each cell carries a small picture of its move, the item that moves drawn darker: select carries one item from a store into the window; compress shrinks four blocks in a window to one; isolate hands work from a parent window to two sub-agent windows; write carries an item from the window to a store that a later call reads.</desc>
