<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The five failure modes, each with a first-line WSCI operation and a fallback</title>
  <desc id="d">A hand-drawn table mapping the five context failure modes onto the four operations. Distraction is answered first by Select, lowering k and reranking so the noise never enters, and second by Compress. Confusion is answered by Select and one canonical rule, then by Isolate, one sub-agent per tool family. Conflict is answered by Compress, de-duplicating and stamping provenance, then by Select resolving the winner first. Lost in the middle is answered by Compress, shrinking so the answer sits near an end, then by Isolate. Tool-storm is answered by Select, trimming the catalogue, then by Isolate with a deterministic router. A caption observes that Compress is usually the first thing to reach for, because it also makes Select cheaper and Isolate possible.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="460"/>
<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">Every first-fix is one of the four operations</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">The five failure modes of Post 06, each with a first-line operation and a fallback.</text><text xml:space="preserve" x="40" y="94.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Failure mode (Post 06)</text><text xml:space="preserve" x="266" y="94.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">First line</text><text xml:space="preserve" x="620" y="94.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Second line</text><text xml:space="preserve" x="40" y="129.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Distraction</text><text xml:space="preserve" x="266" y="117.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-accent)">Select</text><text xml:space="preserve" x="266" y="136.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">lower k, rerank so noise never enters</text><text xml:space="preserve" x="620" y="117.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-warn)">Compress</text><text xml:space="preserve" x="620" y="136.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">shrink a distracting history</text><path d="M40.08 153.87C388.43 154.39 737.15 154.28 920.14 154.03M40.09 153.94C298.55 153.98 557.15 154.06 919.98 153.98" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="183.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Confusion</text><text xml:space="preserve" x="266" y="171.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-accent)">Select</text><text xml:space="preserve" x="266" y="190.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">fewer, more distinct tools; one rule</text><text xml:space="preserve" x="620" y="171.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-success)">Isolate</text><text xml:space="preserve" x="620" y="190.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">one sub-agent per tool family</text><path d="M40.08 208.11C224.3 207.08 408.88 207.21 919.8 208.21M40 207.96C222.7 207.36 405.52 207.28 919.99 207.9" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="237.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Conflict</text><text xml:space="preserve" x="266" y="225.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-warn)">Compress</text><text xml:space="preserve" x="266" y="244.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">de-duplicate; a rule with provenance</text><text xml:space="preserve" x="620" y="225.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-accent)">Select</text><text xml:space="preserve" x="620" y="244.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">resolve the winner first</text><path d="M40.08 261.88C236.66 262.09 433.1 261.98 919.93 261.9M39.92 261.98C322.85 263.07 605.65 263.05 920 262.05" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="291.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Lost in the middle</text><text xml:space="preserve" x="266" y="279.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-warn)">Compress</text><text xml:space="preserve" x="266" y="298.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">shrink so the answer sits near an end</text><text xml:space="preserve" x="620" y="279.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-success)">Isolate</text><text xml:space="preserve" x="620" y="298.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">split so no window runs long</text><path d="M40.08 316.12C248.54 314.78 456.83 314.91 920.07 316.07M40.08 315.99C247 316.45 454.02 316.27 920.01 315.97" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="345.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Tool-storm</text><text xml:space="preserve" x="266" y="333.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-accent)">Select</text><text xml:space="preserve" x="266" y="352.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">trim the tool catalogue to this turn</text><text xml:space="preserve" x="620" y="333.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-success)">Isolate</text><text xml:space="preserve" x="620" y="352.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">a router pre-selects tools</text><text xml:space="preserve" x="40" y="407.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Read it the other way and a pattern falls out: in most over-stuffed production prompts the first thing to reach for is Compress.</text><text xml:space="preserve" x="40" y="427.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Compress also makes Select cheaper and Isolate possible, which is the order Part II covers them in.</text>
</svg>
