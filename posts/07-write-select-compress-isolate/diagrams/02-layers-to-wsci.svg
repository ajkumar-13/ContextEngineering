<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Each context layer, and the WSCI operation that primarily manages it</title>
  <desc id="d">A hand-drawn table pairing each of the six context layers with the operation that primarily manages it. The system prompt is owned by Write, authored once and loaded every call. Tools and MCP are owned by Select, exposing only the schemas this turn needs. Memory and state are owned by Write and then Select, written between sessions and selected back per turn. Retrieved chunks are owned by Select, fed by an offline Write that chunks, embeds, and indexes. Conversation history is owned by Compress, being the layer that grows without bound. The user instruction has no owning operation: it is the trigger every other operation serves. Captions note that no layer needs all four operations, and that the operations chain across layers.</desc>

