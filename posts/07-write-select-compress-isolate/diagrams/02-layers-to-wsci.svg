7M298.06 326.96C299.27 322.92 302.54 320.73 306.16 320.17M304.33 321C304.33 321 304.33 321 304.33 321M304.33 321C304.33 321 304.33 321 304.33 321" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text xml:space="preserve" x="342" y="337.04" text-anchor="middle" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Compress</text><text xml:space="preserve" x="520" y="336.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">The layer that grows without bound; windowing keeps it in budget.</text><path d="M40.08 360.24C342.24 359.28 644.7 359.3 920.14 359.91M39.91 359.88C296.96 358.98 554.09 358.83 919.9 359.93" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="389.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">06 User instruction</text><text xml:space="preserve" x="300" y="389.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-subtle)">none</text><text xml:space="preserve" x="520" y="388.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">The trigger, not something to manage. Every other operation serves it.</text><text xml:space="preserve" x="40" y="439.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">No layer needs all four operations, which is why the framework stays small.</text><text xml:space="preserve" x="40" y="459.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">The operations chain across layers: memory is Written before it is Selected, and a RAG index is Written offline before it is Selected online.</text>
</svg>
