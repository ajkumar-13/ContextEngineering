<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-layers-to-wsci-title" aria-describedby="ctx-02-layers-to-wsci-desc">
<title id="ctx-02-layers-to-wsci-title">Five layers have a main operation, and none needs all four</title>
<desc id="ctx-02-layers-to-wsci-desc">A grid with one row per layer, from 01 System prompt to 06 User instruction, and one column per operation: write, select, compress, isolate. 01 System prompt: main write, also select, also compress. 02 Tools and MCP descriptions: main select, also isolate. 03 Memory and state: main write, main select. 04 Retrieved chunks: also write, main select. 05 Conversation history: also select, main compress, also isolate. 06 User instruction: no operation, it is the trigger. Key: main, the operation that does most of the work; also, one that reaches what main cannot.</desc>
