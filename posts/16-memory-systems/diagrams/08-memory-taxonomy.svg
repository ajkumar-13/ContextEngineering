",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">How to do things.</text><text xml:space="preserve" x="684" y="317.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">&quot;Refunds over $1 000 require</text><text xml:space="preserve" x="684" y="329.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">manager approval.&quot;</text><text xml:space="preserve" x="684" y="359.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Skills and routines reused across</text><text xml:space="preserve" x="684" y="371.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">sessions. Matched by trigger.</text><text xml:space="preserve" x="684" y="421.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">.skills/ · /commands</text><text xml:space="preserve" x="40" y="477.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">One store for all three serves each of them badly: the preference gets buried under events, the event is treated as a standing</text><text xml:space="preserve" x="40" y="499.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">fact, and the rule scores below an episode and never fires. Three access patterns need three schemas.</text>
</svg>
