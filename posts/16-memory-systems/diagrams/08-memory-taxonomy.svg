<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">The memory taxonomy: short-term, and three kinds of long-term</title>
  <desc id="d">A hand-drawn figure in two bands. The upper band, short-term memory, lives in the window and is billed on every call: working memory holding the active window, scratchpad, and intermediate tool output, lost when the call ends; and the conversation buffer holding recent turns, managed by sliding window, rolling summary, or a compaction threshold. The lower band, long-term memory, lives outside the window and is billed only for the slice retrieved, and splits three ways. Episodic holds specific past interactions as embedded events retrieved by similarity and time range. Semantic holds distilled facts and preferences, slowly changing, pulled as background. Procedural holds how-tos and rules, reused across sessions and matched by trigger. A caption explains that one store for all three serves each badly: the preference gets buried under events, the event is treated as a standing fact, and the rule scores below an episode and never fires.</desc>

