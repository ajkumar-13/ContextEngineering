<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-orchestrator-title" aria-describedby="ctx-02-orchestrator-desc">
<title id="ctx-02-orchestrator-title">One turn, three retrieval paths, one context</title>
<desc id="ctx-02-orchestrator-desc">The turn "The billing error from ticket 4321 is back; please escalate it.", with intent=escalate, runs through three paths in order. 1 Procedural, trigger match: mem-08 intent=export false; mem-09 intent=escalate fires; mem-10 intent=refund false. 2 Semantic, background ranking: mem-02 0.98 packed; mem-01 0.87 packed; mem-03 0.50 packed, ask; mem-04 0.00 cold. 3 Episodic, reference recall, run because the turn says back: mem-05 4 shared words, recalled; mem-06 0 shared words; mem-07 0.00 cold. The three lists merge into MemoryContext(procedural=[mem-09], semantic=[mem-02, mem-01, mem-03], episodic=[mem-05]), which enters 03 Memory and state.</desc>
<style>
