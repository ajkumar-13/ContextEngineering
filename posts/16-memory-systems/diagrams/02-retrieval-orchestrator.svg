l:space="preserve" x="60" y="373.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Last, and conditionally: only when the turn actually references something specific.</text><path d="M300.79 297.58C300.64 299.88 299.57 302.29 300.54 305.81M300.19 298.15C299.94 300.92 299.6 304.28 299.97 306.1" fill="none" stroke="var(--ce-ink-subtle)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M304.49 295.96 L300 306 L295.51 295.96" fill="none" stroke="var(--ce-ink-subtle)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M622.5 99.42C715.93 97.9 804.39 97.69 897.66 98.16C912.05 99.46 917.9 105.82 919.64 122.93C920.55 223.31 919.13 322.65 918.34 376C921.21 392.57 914.54 402.15 894.21 401.76C832.03 400.01 768.69 399.1 625.94 398.51C607.33 400.26 602.45 392.72 598.35 377.38C601.4 278.37 599.23 181.45 599.49 125.64C602.18 107.87 606.77 102.12 624.79 101.16C624 100 624 100 624 100" fill="var(--ce-surface)" stroke="none"/><path d="M624.51 101.52C709.81 99.29 797.34 99.35 895.13 100.34M624.53 100.57C696.69 100.66 768.06 100.33 896.74 100.62M896 100C912.17 101.92 921.3 109.44 920.35 123.57M896.54 98.43C912.24 100.35 921.9 108.33 920.89 123.43M919.13 124.89C921.72 220.03 920.94 318.88 919.75 374.56M920.45 123.55C919.14 218.95 920.07 313.91 919.89 375.59M920 376C919.48 392.87 910.37 400.89 895.35 401.98M921.61 376.3C919.64 392.13 913.88 398.85 895.29 401.35M895.33 400.66C804.9 403.49 714.01 403.59 623.67 400.87M896.18 399.4C807.34 402.01 719.02 402.08 624.12 400.2M624 400C609.54 398.87 598.94 390.33 601.18 377.16M624.78 398.78C608 400.8 600.66 389.79 601.76 376.82M600.66 376.82C597.69 320.43 598.01 263.74 600.43 125.19M599.27 375.43C600.42 311.63 599.67 246.7 600.4 123.6M600 124C598.02 108.38 608.88 99.06 625.33 98.75M600.1 125.95C601.79 110.05 609.26 97.74 623.38 98.88M624 100C624 100 624 100 624 100M624 100C624 100 624 100 624 100" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M604.69 109.44C606.67 208.93 605.92 308.11 605.19 391.61M605.41 108.58C605.08 207.33 604.8 306.23 604.98 390.7" fill="none" stroke="var(--ce-neutral-2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="620" y="120.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--ce-ink)">One call, one record</text><text xml:space="preserve" x="620" y="141.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Wrap all three behind a context assembler. The</text><text xml:space="preserve" x="620" y="153.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">rest of the agent should not know there are</text><text xml:space="preserve" x="620" y="166.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">three.</text><text xml:space="preserve" x="620" y="199.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink)">MemoryContext</text><text xml:space="preserve" x="620" y="219.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink)">  rules     list[Rule]     procedural</text><text xml:space="preserve" x="620" y="239.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink)">  facts     list[Fact]     semantic</text><text xml:space="preserve" x="620" y="259.2" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="10" fill="var(--ce-ink)">  episodes  list[Episode]  episodic</text><text xml:space="preserve" x="620" y="301.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The prompt assembler stitches each field into</text><text xml:space="preserve" x="620" y="313.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">its own layer, so a memory bug is traceable to</text><text xml:space="preserve" x="620" y="326.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">one kind.</text><text xml:space="preserve" x="40" y="435.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Rules first can save the other two entirely. Episodic last means most turns never pay for it at all.</text>
</svg>
