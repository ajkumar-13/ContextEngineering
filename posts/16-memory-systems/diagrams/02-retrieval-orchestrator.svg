<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The retrieval orchestrator: three memory reads in a fixed order</title>
  <desc id="d">A hand-drawn figure. Three numbered steps run down the left in the order they must fire on every turn. First, procedural rules: which triggers are true right now, placed first because a rule can end the turn outright. Second, semantic facts: what is currently true about this subject, placed second because they shape tone and assumptions for everything that follows. Third, episodic recall: whether the user is referring to a past event, placed last and run conditionally, only when the turn references something specific. On the right, a panel shows the three wrapped behind a single context assembler returning one MemoryContext record with a rules, facts, and episodes field, one per kind, so the prompt assembler can stitch each into its own layer and a memory bug stays traceable to one kind.</desc>

