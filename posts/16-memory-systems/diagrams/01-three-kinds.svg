<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-three-kinds-title" aria-describedby="ctx-01-three-kinds-desc">
<title id="ctx-01-three-kinds-title">Three kinds of memory, one layer</title>
<desc id="ctx-01-three-kinds-desc">Three memory store cards, in the order the orchestrator reads them. 1 Procedural: holds learned rules, written on instruction, retrieved by trigger match, decays: no. 2 Semantic: holds facts, preferences, written on assertion, retrieved by background top-k, decays: yes. 3 Episodic: holds events, written end of interaction, retrieved by reference recall, decays: yes. An arrow from each card runs into band 03 Memory and state of the six-layer window on the right, drawn from 01 System prompt at the top to 06 User instruction at the bottom; band 03 is outlined.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
    --ctx-accent: #D98E5F;
    --ctx-success: #5C9E78;
    --ctx-warn: #B8895A;
    --ctx-alert: #C66B5E;
    --ctx-neutral-1: #EAEAE4;
    --ctx-neutral-2: #CFCFC8;
    --ctx-neutral-3: #8E8E88;
    --ctx-on-fill: #FFFDF9;
    --ctx-on-accent: #1A1A1A;
    --ctx-grid: rgba(26, 26, 26, 0.06);
    --ctx-rule: #8E8E88;
    --ctx-arrow: #6E6E68;
    --ctx-neutral-soft: #F2F2EE;
    --ctx-blue: #0072B2;
    --ctx-blue-ink: #005A8C;
    --ctx-blue-soft: #E3F0F8;
    --ctx-blue-line: #9CC6E0;
    --ctx-orange: #C98500;
    --ctx-orange-ink: #8A5B00;
    --ctx-orange-soft: #FBF0D9;
    --ctx-orange-line: #E5C27A;
    --ctx-green: #008F68;
    --ctx-green-ink: #006B4E;
    --ctx-green-soft: #DFF3EC;
    --ctx-green-line: #8FCDB8;
    --ctx-red: #A8322A;
    --ctx-red-ink: #8F2A23;
    --ctx-red-soft: #F8E3E1;
    --ctx-red-line: #DDA49F;
    --ctx-purple: #A14D8C;
    --ctx-purple-ink: #833E72;
    --ctx-purple-soft: #F4E4EF;
    --ctx-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ctx-bg: #0E0F12;
      --ctx-surface: #16181C;
      --ctx-ink: #F2F2EE;
      --ctx-ink-muted: #B4B4AE;
      --ctx-ink-subtle: #6E6E68;
      --ctx-border: #2A2D33;
      --ctx-primary: #8BA8E0;
      --ctx-accent: #E8B088;
      --ctx-success: #7FBF9B;
      --ctx-warn: #D4B58A;
      --ctx-alert: #D88880;
      --ctx-neutral-1: #1F2229;
      --ctx-neutral-2: #2C3038;
      --ctx-neutral-3: #6E6E68;
      --ctx-on-fill: #14161A;
      --ctx-on-accent: #1A1A1A;
      --ctx-grid: rgba(241, 238, 232, 0.08);
      --ctx-rule: #6A6D74;
      --ctx-arrow: #9A9A94;
      --ctx-neutral-soft: #1C1E23;
      --ctx-blue: #5AA8E0;
      --ctx-blue-ink: #7DBBE8;
      --ctx-blue-soft: #14283A;
      --ctx-blue-line: #2E5878;
      --ctx-orange: #E8B040;
      --ctx-orange-ink: #F0C060;
      --ctx-orange-soft: #33260F;
      --ctx-orange-line: #6E5222;
      --ctx-green: #3CC497;
      --ctx-green-ink: #62D1AC;
      --ctx-green-soft: #10302A;
      --ctx-green-line: #2A6A55;
      --ctx-red: #E8796E;
      --ctx-red-ink: #F09A90;
      --ctx-red-soft: #3A1A18;
      --ctx-red-line: #7A3A34;
      --ctx-purple: #D58CC4;
      --ctx-purple-ink: #E2A6D3;
      --ctx-purple-soft: #331F2E;
      --ctx-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--ctx-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ctx-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--ctx-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--ctx-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--ctx-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--ctx-surface); stroke: var(--ctx-rule); stroke-width: 1; }
  .card { fill: var(--ctx-neutral-soft); stroke: var(--ctx-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--ctx-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--ctx-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--ctx-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--ctx-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--ctx-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--ctx-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-soft { fill: var(--ctx-blue-soft); }
  .f-green-soft { fill: var(--ctx-green-soft); }
  .f-orange { fill: var(--ctx-orange); }
  .f-orange-soft { fill: var(--ctx-orange-soft); }
  .f-purple-soft { fill: var(--ctx-purple-soft); }
  .f-surface { fill: var(--ctx-surface); }
  .s-blue-line { stroke: var(--ctx-blue-line); }
  .s-border { stroke: var(--ctx-border); }
  .s-green-line { stroke: var(--ctx-green-line); }
  .s-orange { stroke: var(--ctx-orange); }
  .s-orange-line { stroke: var(--ctx-orange-line); }
  .s-purple-line { stroke: var(--ctx-purple-line); }
</style>
<defs>
<marker id="ctx-01-three-kinds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="406">Three kinds of memory, one layer</text>
<text x="40" y="76" class="t-subtitle" data-w="602">Each kind has its own write trigger, retrieval path and decay; all three enter layer 03.</text>
<text x="176" y="128" class="t-note" data-w="37">holds</text>
<text x="320" y="128" class="t-note" data-w="46">written</text>
<text x="448" y="128" class="t-note" data-w="80">retrieved by</text>
<text x="600" y="128" class="t-note" data-w="48">decays</text>
<rect x="40" y="144" width="600" height="88" rx="8" class="f-surface" data-fit="skip"/>
<rect x="40" y="144" width="600" height="88" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<rect x="48" y="152" width="584" height="8" rx="4" class="f-orange" data-fit="skip"/>
<text x="56" y="200" class="t-head" data-w="103">1 Procedural</text>
<text x="176" y="200" class="t-label" data-w="87">learned rules</text>
<text x="320" y="200" class="t-label" data-w="92">on instruction</text>
<text x="448" y="200" class="t-label" data-w="90">trigger match</text>
<text x="600" y="200" class="t-label" data-w="17">no</text>
<rect x="40" y="248" width="600" height="88" rx="8" class="f-surface" data-fit="skip"/>
<rect x="40" y="248" width="600" height="88" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<rect x="48" y="256" width="584" height="8" rx="4" class="f-orange" data-fit="skip"/>
<text x="56" y="304" class="t-head" data-w="91">2 Semantic</text>
<text x="176" y="304" class="t-label" data-w="120">facts, preferences</text>
<text x="320" y="304" class="t-label" data-w="83">on assertion</text>
<text x="448" y="304" class="t-label" data-w="119">background top-k</text>
<text x="600" y="304" class="t-label" data-w="23">yes</text>
<rect x="40" y="352" width="600" height="88" rx="8" class="f-surface" data-fit="skip"/>
<rect x="40" y="352" width="600" height="88" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<rect x="48" y="360" width="584" height="8" rx="4" class="f-orange" data-fit="skip"/>
<text x="56" y="408" class="t-head" data-w="85">3 Episodic</text>
<text x="176" y="408" class="t-label" data-w="45">events</text>
<text x="320" y="408" class="t-label" data-w="118">end of interaction</text>
<text x="448" y="408" class="t-label" data-w="104">reference recall</text>
<text x="600" y="408" class="t-label" data-w="23">yes</text>
<text x="712" y="128" class="t-note" data-w="176">The window, sent 01 to 06</text>
<rect x="712" y="136" width="208" height="48" rx="6" class="f-blue-soft" data-fit="skip"/>
<rect x="712" y="136" width="208" height="48" rx="6" class="w1 nofill s-blue-line" data-fit="skip"/>
<text x="724" y="168" class="t-label" data-w="124">01 System prompt</text>
<rect x="712" y="192" width="208" height="48" rx="6" class="f-blue-soft" data-fit="skip"/>
<rect x="712" y="192" width="208" height="48" rx="6" class="w1 nofill s-blue-line" data-fit="skip"/>
<text x="724" y="224" class="t-label" data-w="125">02 Tools and MCP</text>
<rect x="712" y="248" width="208" height="48" rx="6" class="f-orange-soft" data-fit="skip"/>
<rect x="712" y="248" width="208" height="48" rx="6" class="emph s-orange" data-fit="skip"/>
<text x="724" y="280" class="t-label" data-w="143">03 Memory and state</text>
<rect x="712" y="304" width="208" height="48" rx="6" class="f-orange-soft" data-fit="skip"/>
<rect x="712" y="304" width="208" height="48" rx="6" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="724" y="336" class="t-label" data-w="137">04 Retrieved chunks</text>
<rect x="712" y="360" width="208" height="48" rx="6" class="f-green-soft" data-fit="skip"/>
<rect x="712" y="360" width="208" height="48" rx="6" class="w1 nofill s-green-line" data-fit="skip"/>
<text x="724" y="392" class="t-label" data-w="159">05 Conversation history</text>
<rect x="712" y="416" width="208" height="48" rx="6" class="f-purple-soft" data-fit="skip"/>
<rect x="712" y="416" width="208" height="48" rx="6" class="w1 nofill s-purple-line" data-fit="skip"/>
<text x="724" y="448" class="t-label" data-w="127">06 User instruction</text>
<path d="M644,192 L705.94,257.82" class="flow" marker-end="url(#ctx-01-three-kinds-arrow)"/>
<path d="M644,296 L705.19,273.05" class="flow" marker-end="url(#ctx-01-three-kinds-arrow)"/>
<path d="M644,400 L706.55,286.63" class="flow" marker-end="url(#ctx-01-three-kinds-arrow)"/>
<text x="40" y="504" class="t-note" data-w="598">Rules are obeyed and never decay; facts and events are weighed and fade without reads.</text>
</svg>
