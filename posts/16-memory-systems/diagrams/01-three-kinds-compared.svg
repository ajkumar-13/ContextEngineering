<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Episodic, semantic, and procedural memory compared on four properties</title>
  <desc id="d">A hand-drawn table asking the same four questions of the three long-term memory kinds. Episodic stores events with a when and a who, is written at the end of an interaction when something noteworthy happened, is retrieved both by reference recall when the user names an entity and as background grounding, and decays on a schedule with demotion below a floor rather than deletion. Semantic stores facts and preferences currently true, is written on explicit assertion or an observed pattern, is retrieved almost always as background with the most recently confirmed first, and decays without ever silently overwriting: the old cell fades and the conflict is surfaced. Procedural stores how-tos and conditional rules, is written rarely and by a human in a reviewed pull request, is retrieved by trigger matching rather than semantic search with every match firing unranked, and does not decay at all because stale rules are removed by people.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="960" height="540"/>
<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">The same four questions, asked of all three kinds</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">Lined up, the shape of the answer is the point: procedural is not a variant of the other two.</text><text xml:space="preserve" x="40" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Kind</text><text xml:space="preserve" x="190" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">What it stores</text><text xml:space="preserve" x="390" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Written when</text><text xml:space="preserve" x="590" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Retrieved how</text><text xml:space="preserve" x="790" y="98.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Decay</text><path d="M40.37 117.15C40.15 140.5 39.98 165.97 40.36 204.94M40.04 116.27C40.61 136.96 40.53 158.07 40.45 204.12" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="130.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--ce-ink)">Episodic</text><text xml:space="preserve" x="190" y="127.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Events, with a when and a who.</text><text xml:space="preserve" x="390" y="127.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">At the end of an interaction,</text><text xml:space="preserve" x="390" y="139.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">when something noteworthy</text><text xml:space="preserve" x="390" y="152.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">happened — itself a small LLM</text><text xml:space="preserve" x="390" y="164.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">judgement.</text><text xml:space="preserve" x="590" y="127.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Reference recall when the user</text><text xml:space="preserve" x="590" y="139.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">names an entity, plus</text><text xml:space="preserve" x="590" y="152.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">background grounding of the</text><text xml:space="preserve" x="590" y="164.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">most recent few.</text><text xml:space="preserve" x="790" y="127.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Yes. On a schedule</text><text xml:space="preserve" x="790" y="139.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">you choose. Demote</text><text xml:space="preserve" x="790" y="152.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">below a floor rather</text><text xml:space="preserve" x="790" y="164.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">than delete.</text><path d="M40.08 212.99C306.61 213.9 573.01 213.66 920.21 212.88M39.93 213.07C348.74 213.83 657.21 213.71 920.1 212.94" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.58 221.36C39.1 250.87 41.08 281.69 39.56 309.94M39.76 222.57C40.37 243.39 40.78 264.05 39.92 310.03" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="236.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--ce-ink)">Semantic</text><text xml:space="preserve" x="190" y="233.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Facts and preferences</text><text xml:space="preserve" x="190" y="245.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">currently true.</text><text xml:space="preserve" x="390" y="233.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">On explicit assertion, or on</text><text xml:space="preserve" x="390" y="245.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">an observed pattern. The</text><text xml:space="preserve" x="390" y="258.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">threshold is where the bugs</text><text xml:space="preserve" x="390" y="270.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">live.</text><text xml:space="preserve" x="590" y="233.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Almost always background:</text><text xml:space="preserve" x="590" y="245.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">top-k about this subject,</text><text xml:space="preserve" x="590" y="258.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">most-recently-confirmed first.</text><text xml:space="preserve" x="790" y="233.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Yes. Never</text><text xml:space="preserve" x="790" y="245.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">overwrite; let the</text><text xml:space="preserve" x="790" y="258.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">old cell decay and</text><text xml:space="preserve" x="790" y="270.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">surface the</text><text xml:space="preserve" x="790" y="283.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">conflict.</text><path d="M39.92 319.11C350.03 318.91 659.69 318.88 920.05 319.16M40.11 318.89C348.13 319.34 656.19 319.38 920 318.92" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.19 327.97C39.29 361.24 38.62 397.41 41.16 414.95M39.47 327.66C40.18 348.62 39.87 370.04 40.59 415.94" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="342.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--ce-ink)">Procedural</text><text xml:space="preserve" x="190" y="339.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">How-tos and conditional rules.</text><text xml:space="preserve" x="390" y="339.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Rarely, and by a human in a</text><text xml:space="preserve" x="390" y="351.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">pull request, with review.</text><text xml:space="preserve" x="590" y="339.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Trigger matching, not semantic</text><text xml:space="preserve" x="590" y="351.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">search: which triggers are</text><text xml:space="preserve" x="590" y="364.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">true now? Every match,</text><text xml:space="preserve" x="590" y="376.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">unranked.</text><text xml:space="preserve" x="790" y="339.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">No. Stale rules are</text><text xml:space="preserve" x="790" y="351.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">removed by people,</text><text xml:space="preserve" x="790" y="364.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">not by time.</text><text xml:space="preserve" x="40" y="459.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Procedural has no confidence field and no ranking, because there is nothing to rank: every matching trigger fires.</text><text xml:space="preserve" x="40" y="481.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Semantic retrieval asks &quot;what is similar to this turn?&quot;. Procedural retrieval asks &quot;what is true right now?&quot;. Those are different questions.</text><text xml:space="preserve" x="40" y="502.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">The taxonomy comes from Tulving, 1972, by way of Generative Agents and MemGPT, both 2023.</text>
</svg>
