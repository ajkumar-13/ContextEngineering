<title id="ctx-03-decay-title">Events and facts fade; a rule does not</title>
<desc id="ctx-03-decay-desc">Confidence, from 0 to 1, against the date from 20 May to 12 October 2026, computed by the snippet's confidence_on for four rows from their last read. The rule mem-10 stays flat at 1.00 from 20 May. The event mem-07, last read on 3 June, falls by 0.01 a day, crosses the cold line at 0.4 on 3 August (marked) and reaches 0.00 on 11 September. The event mem-05, last read on 14 September, is at 0.72 on 12 October. The fact mem-03, last read on 12 September at 0.80, is at 0.50 on 12 October, between the ask line at 0.6 and the cold line at 0.4.</desc>
