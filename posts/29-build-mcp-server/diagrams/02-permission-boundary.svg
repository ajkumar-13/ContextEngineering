<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-permission-boundary-title" aria-describedby="ctx-02-permission-boundary-desc">
<title id="ctx-02-permission-boundary-title">The model proposes; code decides</title>
<desc id="ctx-02-permission-boundary-desc">Four step cards joined by arrows. 1, the model proposes issue_refund for ORD-9004 with an amount of 1,500 dollars. 2, the host asks the user to approve or deny the call. 3, emphasised, the server checks in code whether the amount exceeds the order total of 12,000 (no) and the threshold of 1,000 (yes). 4, a person in the manager queue decides, after escalate_to_human. Below, a table of three calls computed with the companion and the check that stopped each: ORD-9001 for 50 returns ok with refund RF-9001-50, passing both checks; ORD-9004 for 1,500 returns requires_confirmation true, stopped at the threshold; ORD-9001 for 1,500, whose total is 1,499, returns amount_exceeds_order_total, stopped at the order total.</desc>
<style>
