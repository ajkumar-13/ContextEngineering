<text x="512" y="204" class="t-label" data-w="105">no, total 12,000</text>
<text x="512" y="228" class="t-code" data-w="103">1500 &gt; 1000?</text>
<text x="512" y="252" class="t-label" data-w="82">yes: confirm</text>
<rect x="724" y="120" width="196" height="160" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="724" y="120" width="196" height="160" rx="8" class="w1 nofill s-border" data-fit="skip"/>
