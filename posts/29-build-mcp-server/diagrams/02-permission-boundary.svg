<text x="40" y="48" class="t-title" data-w="424">The model proposes; code decides</text>
<text x="40" y="76" class="t-subtitle" data-w="633">The refund path of the companion acme-support; the table is what issue_refund returns.</text>
<rect x="40" y="120" width="196" height="160" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="120" width="196" height="160" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="148" class="t-head" data-w="151">1  Model proposes</text>
<text x="56" y="180" class="t-code" data-w="112">issue_refund(</text>
<text x="56" y="204" class="t-code" data-w="146">"ORD-9004", 1500)</text>
