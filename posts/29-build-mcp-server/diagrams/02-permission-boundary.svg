45.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">context said. It also gives the host something structured to render,</text><text xml:space="preserve" x="510" y="358.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">so the human sees a decision rather than a sentence.</text><text xml:space="preserve" x="40" y="439.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">The same argument as Post 23: the agent proposes and the application executes. An MCP server is where that boundary gets written down.</text><text xml:space="preserve" x="40" y="461.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">The AGENTS.md that ships beside the server teaches the agent to use it well. It does not, and cannot, enforce anything.</text>
