<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">The permission boundary on a write tool, and why it lives in code</title>
  <desc id="d">A hand-drawn figure of three steps. First, the model proposes a refund call with an order id and an amount; it has read the policy resource and may still ask for more than the policy allows. Second, the server checks: a plain conditional comparing the amount against a threshold, running before anything is written, made checkable by typed arguments. Third, the host confirms out-of-band with a human, a step the attacker in the context cannot forge. Two panels below contrast what a prompt rule buys — obedience most of the time, where most of the time is not a security property and the exceptions are exactly the cases that matter — against what the code buys: a conditional that runs every time on every argument, and a structured result the host can render so a human sees a decision rather than a sentence. A caption notes the AGENTS.md shipping beside the server teaches good use but cannot enforce anything.</desc>

