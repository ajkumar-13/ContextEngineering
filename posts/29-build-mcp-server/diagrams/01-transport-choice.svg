<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="614">stdio reaches one user; HTTP reaches the network</text>
<text x="40" y="76" class="t-subtitle" data-w="475">MCP's two standard transports, specification revision 2026-07-28.</text>
<text x="40" y="128" class="t-head" data-w="42">stdio</text>
<rect x="40" y="152" width="152" height="176" rx="8" class="f-surface" data-fit="skip"/>
<rect x="40" y="152" width="152" height="176" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="56" y="180" class="t-head" data-w="40">Host</text>
<text x="56" y="204" class="t-note" data-w="86">launches the</text>
<text x="56" y="224" class="t-note" data-w="98">server process</text>
<rect x="312" y="152" width="152" height="176" rx="8" class="f-surface" data-fit="skip"/>
<rect x="312" y="152" width="152" height="176" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="328" y="180" class="t-head" data-w="53">Server</text>
<text x="328" y="204" class="t-note" data-w="121">a subprocess with</text>
<text x="328" y="224" class="t-note" data-w="66">the user's</text>
<text x="328" y="244" class="t-note" data-w="81">permissions</text>
<path d="M192,232 L309,232" class="flow" marker-end="url(#ctx-01-transport-choice-arrow)"/>
<text x="252" y="220" text-anchor="middle" class="t-note" data-w="100">stdin: requests</text>
<path d="M312,288 L195,288" class="flow" marker-end="url(#ctx-01-transport-choice-arrow)"/>
<text x="252" y="276" text-anchor="middle" class="t-note" data-w="121">stdout: responses</text>
<text x="40" y="360" class="t-note" data-w="175">Each direction carries one</text>
<text x="40" y="380" class="t-note" data-w="199">JSON-RPC message per line;</text>
<text x="40" y="400" class="t-note" data-w="183">stdout carries nothing else.</text>
<rect x="264" y="376" width="200" height="72" rx="8" class="f-surface" data-fit="skip"/>
<rect x="264" y="376" width="200" height="72" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="280" y="404" class="t-head" data-w="84">Host's log</text>
<text x="280" y="428" class="t-note" data-w="151">mcp-server-NAME.log</text>
<path d="M388,328 L388,373" class="flow" marker-end="url(#ctx-01-transport-choice-arrow)"/>
<text x="376" y="356" text-anchor="end" class="t-note" data-w="40">stderr</text>
<text x="496" y="128" class="t-head" data-w="142">Streamable HTTP</text>
<rect x="496" y="152" width="96" height="56" rx="8" class="f-surface" data-fit="skip"/>
<rect x="496" y="152" width="96" height="56" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="512" y="184" class="t-label" data-w="54">Client A</text>
<rect x="496" y="224" width="96" height="56" rx="8" class="f-surface" data-fit="skip"/>
<rect x="496" y="224" width="96" height="56" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="512" y="256" class="t-label" data-w="54">Client B</text>
<rect x="496" y="296" width="96" height="56" rx="8" class="f-surface" data-fit="skip"/>
<rect x="496" y="296" width="96" height="56" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="512" y="328" class="t-label" data-w="66">Any caller</text>
<rect x="632" y="152" width="120" height="200" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="632" y="152" width="120" height="200" rx="8" class="emph s-ink" data-fit="skip"/>
<text x="692" y="236" text-anchor="middle" class="t-label" data-w="88">Origin check,</text>
<text x="692" y="260" text-anchor="middle" class="t-label" data-w="30">then</text>
<text x="692" y="284" text-anchor="middle" class="t-label" data-w="96">authentication</text>
<path d="M592,180 L629,180" class="flow" marker-end="url(#ctx-01-transport-choice-arrow)"/>
<path d="M592,252 L629,252" class="flow" marker-end="url(#ctx-01-transport-choice-arrow)"/>
<path d="M592,324 L629,324" class="flow" marker-end="url(#ctx-01-transport-choice-arrow)"/>
<rect x="784" y="152" width="136" height="200" rx="8" class="f-surface" data-fit="skip"/>
<rect x="784" y="152" width="136" height="200" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="800" y="180" class="t-head" data-w="53">Server</text>
<text x="800" y="204" class="t-note" data-w="86">one process,</text>
<text x="800" y="224" class="t-note" data-w="84">many clients</text>
<text x="800" y="284" class="t-code" data-w="77">127.0.0.1</text>
<text x="800" y="308" class="t-label" data-w="65">port 8000</text>
<text x="800" y="332" class="t-code" data-w="35">/mcp</text>
<path d="M752,252 L781,252" class="flow" marker-end="url(#ctx-01-transport-choice-arrow)"/>
<text x="496" y="400" class="t-note" data-w="350">Every request is a POST to /mcp. The bind shown is</text>
<text x="496" y="420" class="t-note" data-w="353">the SDK's default; reach is whatever can route there.</text>
<text x="40" y="504" class="t-note" data-w="630">Moving from stdio to HTTP turns a local process into a network service; the checks come first.</text>
</svg>
