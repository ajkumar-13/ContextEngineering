<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">stdio compared with HTTP as an MCP transport</title>
  <desc id="d">A hand-drawn comparison table of the two MCP transports across five properties. On process model, stdio has the host spawn one child process per session while HTTP is one long-lived service serving many clients. On reach, stdio is the same machine and nothing else while HTTP reaches anything that can route to the port. On authentication, stdio inherits it from the operating-system user with nothing to build, while HTTP requires you to add tokens or a reverse proxy. On attack surface, stdio exposes a local process while HTTP exposes every client that can reach the port. On what each is best for, stdio suits development and personal or single-team installs while HTTP suits shared, remote, or multi-user deployments. A highlighted band warns that an HTTP-exposed tool server is an unauthenticated remote-code path until authentication sits in front of it.</desc>

