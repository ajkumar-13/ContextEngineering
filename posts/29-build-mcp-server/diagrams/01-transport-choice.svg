var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="188.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Reach</text><text xml:space="preserve" x="250" y="181.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The same machine, and nothing else.</text><text xml:space="preserve" x="610" y="181.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Anything that can route to the port.</text><path d="M40.24 215.11C275.05 215.57 510.55 215.37 920.03 214.77M39.9 215.03C273.26 215.47 506.61 215.5 919.98 215.11" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="242.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Auth</text><text xml:space="preserve" x="250" y="235.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Inherited from the OS user. Nothing to build.</text><text xml:space="preserve" x="610" y="235.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">You must add it: tokens, a reverse proxy.</text><path d="M40.08 269.11C224.3 268.08 408.88 268.21 919.8 269.21M40 268.96C222.7 268.36 405.52 268.28 919.99 268.9" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="296.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Attack surface</text><text xml:space="preserve" x="250" y="289.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">A local process.</text><text xml:space="preserve" x="610" y="289.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Every client that can reach the port.</text><path d="M39.92 323.11C350.03 322.91 659.69 322.88 920.05 323.16M40.11 322.89C348.13 323.34 656.19 323.38 920 322.92" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="350.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Best for</text><text xml:space="preserve" x="250" y="343.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Development, and personal or single-team installs.</text><text xml:space="preserve" x="610" y="343.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Shared, remote, or multi-user deployments.</text><path d="M49.51 388.45C287.82 387.21 524.45 385.95 909.59 388.36C916.26 388.71 917.66 393.18 918.76 395.7C917.35 406 918.28 419.92 921.38 437.78C919.58 445.2 917.84 450.07 911.72 449.47C592.52 447.18 273.87 447.19 50.67 447.85C40.99 447.92 38.38 445.88 38.39 436.91C37.72 426.03 42.34 412.92 41.8 398.13C40.62 391.67 43.72 385.71 49.97 385.49C50 388 50 388 50 388" fill="var(--ce-surface)" stroke="none"/><path d="M50.8 388.39C303.67 388.85 557.11 389.82 909.4 388.38M49.91 388.2C301.73 385.51 553.38 385.26 910.01 387.82M910 388C918.33 389.73 918.48 389.9 920.43 399.82M908.61 388.92C916.78 386.74 920.2 391.69 919.61 398.28M920.22 397.09C921.25 412.33 919.58 424 920.54 437.66M920.07 397.5C919.88 412.88 920.18 425.86 919.84 438.51M920 438C918.79 443.35 918.17 449.43 909.4 449.85M919.04 437.95C919.33 446.73 915.42 449.22 909.63 445.82M910.59 448.03C720.61 445.25 529.11 445.57 49.54 447.51M910.14 447.71C602.72 451.88 295.86 452.05 49.89 448.12M50 448C43.79 446.72 41.4 444.3 38.58 439.83M50.44 447.95C41.23 450.29 38.8 442.77 40.31 438.2M41.05 437.51C39.75 421.66 40.8 406.6 38.33 397.56M39.9 437.33C39.96 426.69 39.08 417.22 40.05 397.73M40 398C39.66 390.94 43.88 389.8 51.08 389.15M38.08 398.88C39.88 390.98 42.46 389.4 51.25 386.02M50 388C50 388 50 388 50 388M50 388C50 388 50 388 50 388" fill="none" stroke="var(--ce-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M45.4 396.98C44.42 410.36 44.98 425.48 45.02 440.12M44.99 397.52C44.49 413.21 44.46 429.19 44.43 439.05" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="407.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">An HTTP-exposed tool server is an unauthenticated remote-code path until you put authentication in front of it.</text><text xml:space="preserve" x="60" y="430.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Prefer stdio for a build like this: no ports, no auth layer, no network exposure, and exactly what local hosts expect.</text>
