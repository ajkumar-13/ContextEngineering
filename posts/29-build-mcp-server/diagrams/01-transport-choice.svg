<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-transport-choice-title" aria-describedby="ctx-01-transport-choice-desc">
<title id="ctx-01-transport-choice-title">stdio reaches one user; HTTP reaches the network</title>
<desc id="ctx-01-transport-choice-desc">Two panels. Left, stdio: a host launches the server as a subprocess. Requests go from host to server on standard input and responses come back on standard output, one JSON-RPC message per line; the server's standard error goes to a log file the host keeps. The server runs with the user's permissions. Right, Streamable HTTP: client A, client B and any process that can reach the port send HTTP POST requests to the endpoint /mcp. Each passes an Origin check and authentication before it reaches one long-lived server process, which the Python SDK binds to 127.0.0.1 port 8000 by default.</desc>
