<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-validation-paths-title" aria-describedby="ctx-03-validation-paths-desc">
<title id="ctx-03-validation-paths-title">The schema guards one path of three</title>
<desc id="ctx-03-validation-paths-desc">Three lanes for the arguments of the companion's test: summary "enough characters here" and queue "bogus". Lane 1, tools/call through the MCP SDK: the arguments are validated against the tool's input schema and refused with a string-pattern error, which a host receives as isError true. Lane 2, a direct Python call of escalate_to_human without a decorator, as first written: nothing checks the arguments, and it returns a ticket in queue bogus; this lane is marked as the failure. Lane 3, a direct call of the companion's function as it is, wrapped in pydantic's validate_call: refused with the same string-pattern error.</desc>
