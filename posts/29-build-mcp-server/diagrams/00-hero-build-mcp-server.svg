<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-build-mcp-server-title" aria-describedby="ctx-00-hero-build-mcp-server-desc">
<title id="ctx-00-hero-build-mcp-server-title">One server, five capabilities, one rule in code</title>
<desc id="ctx-00-hero-build-mcp-server-desc">Left, a host application holds the model's window as six layer bands, 01 System prompt to 06 User instruction, and an MCP client. The client starts the acme-support server over stdio. The server, server.py of 133 lines, exposes three tools, search_orders (read), issue_refund (write) and escalate_to_human (workflow), whose schemas reach 02 Tools and MCP descriptions; the resource file://refunds_policy.md, which reaches 04 Retrieved chunks when the host attaches it; and the prompt triage_intake, which reaches 06 User instruction when the user picks it. Inside issue_refund a gate checks amount against REFUND_THRESHOLD, 1,000 dollars, in code. AGENTS.md sits below the server: read by people and coding agents, not sent by the protocol.</desc>
