  - id: o1
    text: "Decompose a system prompt into the five named blocks (identity, rules, format, knowledge, tool-use guidance) and place a given line in one of them."
  - id: o2
    text: "Apply the six rules for writing rules to rewrite a weak or speculative rule into one a model can follow and a reviewer can audit."
