<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-ci-gate-title" aria-describedby="ctx-03-ci-gate-desc">
<title id="ctx-03-ci-gate-title">The gate blocks the contradictory rule twice over</title>
<desc id="ctx-03-ci-gate-desc">Two rows of the same CI pipeline, each a chain of four boxes: pull request, lint, regression and gate. Row one, rules 1.2.0: lint has no findings, 10/10 cases pass, the gate passes. Row two, rules 1.3.0 adds rule #481: lint reports that #412 and #481 disagree on refunds above 1,000 dollars up to 2,000 dollars, 8/10 cases pass, cases 04 and 05 returning refund_order where escalate_to_manager was expected, and the gate blocks the merge. The failing boxes are outlined in red.</desc>
