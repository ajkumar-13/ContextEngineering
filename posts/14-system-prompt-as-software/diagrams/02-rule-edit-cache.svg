  .arrowhead { fill: var(--ctx-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-ink { fill: var(--ctx-blue-ink); }
  .f-blue-soft { fill: var(--ctx-blue-soft); }
  .f-neutral-soft { fill: var(--ctx-neutral-soft); }
  .f-orange-ink { fill: var(--ctx-orange-ink); }
  .f-surface { fill: var(--ctx-surface); }
  .s-blue { stroke: var(--ctx-blue); }
  .s-border { stroke: var(--ctx-border); }
  .s-ink-muted { stroke: var(--ctx-ink-muted); }
</style>
<defs>
<marker id="ctx-02-rule-edit-cache-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="641">A rule edit rewrites the system prompt's cache entry</text>
<text x="40" y="76" class="t-subtitle" data-w="635">Anthropic's cache order with two breakpoints; prices as multiples of the base input price.</text>
<text x="244" y="124" class="t-head f-blue-ink" data-w="148">02 Tools and MCP</text>
<text x="244" y="144" class="t-note" data-w="82">descriptions</text>
<text x="432" y="124" class="t-head f-blue-ink" data-w="150">01 System prompt</text>
