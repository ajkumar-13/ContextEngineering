<rect x="420" y="352" width="304" height="64" rx="6" class="emph s-blue" data-fit="skip"/>
<text x="432" y="392" class="t-label" data-w="124">write at 1.25 times</text>
<text x="712" y="392" text-anchor="end" class="t-note" data-w="124">Rules block edited</text>
<rect x="732" y="352" width="188" height="64" rx="6" class="f-neutral-soft" data-fit="skip"/>
<rect x="732" y="352" width="188" height="64" rx="6" class="w1 nofill s-border" data-fit="skip"/>
