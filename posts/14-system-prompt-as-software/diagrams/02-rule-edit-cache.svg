<text x="744" y="216" class="t-label" data-w="51">full rate</text>
<text x="40" y="292" class="t-head" data-w="104">Later call, v1</text>
<text x="40" y="312" class="t-note" data-w="70">rules 1.2.0</text>
<rect x="232" y="264" width="180" height="64" rx="6" class="f-blue-soft" data-fit="skip"/>
