<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-rule-edit-cache-title" aria-describedby="ctx-02-rule-edit-cache-desc">
<title id="ctx-02-rule-edit-cache-title">A rule edit rewrites the system prompt's cache entry</title>
<desc id="ctx-02-rule-edit-cache-desc">Three rows of one request in Anthropic's cache order: 02 Tools and MCP descriptions, then 01 System prompt with its five blocks, then the per-turn layers 03 to 06, with a cache breakpoint after the tools and another after the system prompt. First call, v1 (rules 1.2.0): tools write at 1.25 times, system prompt write at 1.25 times, layers 03 to 06 full rate. Later call, v1 (rules 1.2.0): tools read at 0.1 times, system prompt read at 0.1 times, layers 03 to 06 full rate. First call, v2 (rules 1.3.0): tools read at 0.1 times, system prompt write at 1.25 times, layers 03 to 06 full rate. In the last row the system prompt segment is marked Rules block edited. Multipliers are of the base input price; segment widths are not to scale.</desc>
<style>
