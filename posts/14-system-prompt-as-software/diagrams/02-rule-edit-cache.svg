<rect x="732" y="264" width="188" height="64" rx="6" class="w1 nofill s-border" data-fit="skip"/>
<text x="744" y="304" class="t-label" data-w="51">full rate</text>
<text x="40" y="380" class="t-head" data-w="99">First call, v2</text>
<text x="40" y="400" class="t-note" data-w="70">rules 1.3.0</text>
<rect x="232" y="352" width="180" height="64" rx="6" class="f-blue-soft" data-fit="skip"/>
<rect x="232" y="352" width="180" height="64" rx="6" class="w15 nofill s-blue" data-fit="skip"/>
<text x="244" y="392" class="t-label" data-w="113">read at 0.1 times</text>
