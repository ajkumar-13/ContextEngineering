    --ctx-green: #008F68;
    --ctx-green-ink: #006B4E;
    --ctx-green-soft: #DFF3EC;
    --ctx-green-line: #8FCDB8;
    --ctx-red: #A8322A;
    --ctx-red-ink: #8F2A23;
    --ctx-red-soft: #F8E3E1;
    --ctx-red-line: #DDA49F;
