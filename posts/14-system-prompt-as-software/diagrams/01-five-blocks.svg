<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-five-blocks-title" aria-describedby="ctx-01-five-blocks-desc">
<title id="ctx-01-five-blocks-title">Layer 01 is five named blocks</title>
<desc id="ctx-01-five-blocks-desc">Left: the six-layer stack, 01 System prompt at the top to 06 User instruction at the bottom, with layer 01 outlined. Dashed lines open layer 01 out to the right into five blocks, in order. Identity: who the agent is, its scope; example line: You are the support agent for Acme. Rules: constraints, each with an issue id; example line: - [#455] Reply in formal British English. Format: the shape of every reply; example line: Answer in plain prose of at most 150 words. Knowledge: small facts needed on almost every call; example line: Office hours are 9:00 to 18:00 IST, Monday to Saturday Tool-use guidance: when to reach for which tool; example line: - lookup_order: questions about where an order is. The caption says tool-use guidance says when to call a tool, and the schemas it points at are layer 02.</desc>
<style>
