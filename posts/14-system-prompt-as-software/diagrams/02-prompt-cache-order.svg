="preserve" x="170" y="340.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">1.25x input for the five-minute TTL, 2x for the one-hour tier — paid once.</text><text xml:space="preserve" x="40" y="364.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Minimum prefix</text><text xml:space="preserve" x="170" y="364.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">roughly 1k to 4k tokens before a prefix is cacheable at all, model-dependent.</text><text xml:space="preserve" x="40" y="388.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">Explicit marker</text><text xml:space="preserve" x="170" y="388.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">without one the boundary is heuristic, and it can move under you.</text><text xml:space="preserve" x="40" y="431.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">A single edit to the system prompt invalidates the cache for every active session.</text><text xml:space="preserve" x="40" y="453.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Which is one more reason to stop changing the prompt casually. Illustrative token counts; check your provider for current rates.</text>
</svg>
