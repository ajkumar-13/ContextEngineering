<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Ordering the prompt so the stable prefix caches</title>
  <desc id="d">A hand-drawn figure with two bars of identical width over the same 8,200-token prompt. The upper bar is a cache miss on the first call or after the prefix moved: the whole thing bills at full input rate. The lower bar is a cache hit with a byte-identical prefix, where the 6,000-token stable block of identity, rules, format, knowledge, and tools reads at about a tenth of the price while the 2,200-token volatile block of retrieval, history, and the current turn still pays full rate. A dashed line marks where the cache_control marker goes. Four facts follow: a cache read costs about ten per cent of base input on Anthropic and about fifty on OpenAI; a cache write costs 1.25 times input for the five-minute tier and twice for the one-hour tier, paid once; a prefix must reach roughly one to four thousand tokens before it is cacheable at all; and without an explicit marker the boundary is heuristic and can move. A caption notes a single prompt edit invalidates the cache for every active session.</desc>

  <style><![CDATA[
