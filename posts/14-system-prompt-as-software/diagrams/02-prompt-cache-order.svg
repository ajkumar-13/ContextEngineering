<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">Order the prompt for the cache</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">Stable content first, volatile content last. A change to the prefix invalidates the cache from that point to the end.</text><text xml:space="preserve" x="150" y="101.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">identity · rules · format · knowledge · tools</text><text xml:space="preserve" x="670" y="101.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">rag · history · turn</text><text xml:space="preserve" x="40" y="128.88" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="14" fill="var(--ce-ink)">Cache miss</text><text xml:space="preserve" x="40" y="145.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">first call, or</text><text xml:space="preserve" x="40" y="157.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">the prefix moved</text><g opacity="0.3"><path d="M158.84 110.68C281.44 111.74 402.97 110 652.46 110.68C657.24 109.31 660.54 110.65 663.93 119.75C661.22 128.34 661.87 136.23 661.47 154.94C661.21 160.82 657.91 164.36 650.74 163.47C518.65 161.84 383.58 160.95 157.99 162.55C154.51 163.14 151.61 159.6 150.34 151.78C151.71 145.29 148.81 136.14 149.3 117.25C148.96 110.52 150.56 109.03 156.37 108.