<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-mcp-roles-title" aria-describedby="ctx-00-hero-mcp-roles-desc">
<title id="ctx-00-hero-mcp-roles-title">Three primitives reach the window by three hands</title>
<desc id="ctx-00-hero-mcp-roles-desc">A host application, drawn as a large card, holds the model's window as a stack of six layers, 01 System prompt to 06 User instruction, and two MCP clients, one per server. Client 1 talks to the refunds-demo server over stdio; client 2 talks to a remote server over Streamable HTTP. The refunds-demo server exposes the tool check_refund, the resource refunds://policy and the prompt draft_refund_reply. From client 1, three arrows enter the window: the tool's schema into 02 Tools and MCP descriptions, decided by the model; the resource into 04 Retrieved chunks when the application attaches it; the prompt into 06 User instruction when the user picks it. The second server's primitives take the same three paths.</desc>
