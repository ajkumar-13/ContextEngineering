<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">The iron triangle: catalogue size, description quality, and runtime selection</title>
  <desc id="d">A hand-drawn triangle whose vertices are catalogue size, per-tool description quality, and runtime selection. Each edge is annotated with the pair a design keeps, what it gives up, and the consequence. Keeping a big catalogue and rich descriptions with no selection makes the prompt unusable, and is named as the most common failure of a demo MCP setup. Keeping a big catalogue and aggressive selection but thin descriptions leaves the model guessing from a one-line summary, so its tool use is inconsistent. Keeping rich descriptions and selection with a small catalogue is the comfort zone, which works until the product needs more capabilities. Captions note that most successful production designs refuse the trade and take all three by paying for a selection pipeline, and that the trade-off happens whether or not it is chosen deliberately.</desc>

