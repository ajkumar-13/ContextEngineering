<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-selection-budget-title" aria-describedby="ctx-03-selection-budget-desc">
<title id="ctx-03-selection-budget-title">Selection keeps a tenth of the tokens</title>
<desc id="ctx-03-selection-budget-desc">Left, a bar chart of estimated tokens per call in layer 02, from the companion's calculator: 50 rich tools with no selection 6,348, 50 thin tools with no selection 2,430, and 5 rich tools kept by the selection step 681. Right, the five tools kept for the turn about order A-4821: get_shipment, search_orders, get_order, search_shipments, and create_order, marked in red as a near miss that matched only the word order.</desc>
