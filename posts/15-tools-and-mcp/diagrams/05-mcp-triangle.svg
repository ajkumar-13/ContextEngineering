<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">MCP: host, client, and server</title>
  <desc id="d">A hand-drawn architecture figure. On the left, a host panel — Claude Desktop, Cursor, VS Code, or a custom application — owns the LLM session and the user-facing surface, and contains an MCP client that speaks the protocol on the host's behalf, one client per connected server, owning the transport and the request ids. Arrows labelled stdio and HTTP cross to two MCP servers on the right: a filesystem server exposing read, write, and grep tools with file resources, and a GitHub server exposing pull-request and issue tools with repository resources. Beneath, the three primitives every server exposes are named: tools as actions the model can invoke, resources as read-only data the host can fetch and inject, and prompts as reusable templates the user invokes as commands. A caption notes that before MCP, wiring one service into three hosts meant three adapters.</desc>

