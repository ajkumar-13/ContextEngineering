r(--ce-ink)">Every server exposes the same three primitives, whatever it wraps:</text><text xml:space="preserve" x="40" y="393.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-accent)">Tools</text><text xml:space="preserve" x="140" y="393.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">actions the model can invoke: create_pull_request, query_warehouse, book_meeting</text><text xml:space="preserve" x="40" y="417.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-accent)">Resources</text><text xml:space="preserve" x="140" y="417.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">read-only data the host can fetch and inject: a page, a table, a file path</text><text xml:space="preserve" x="40" y="441.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-accent)">Prompts</text><text xml:space="preserve" x="140" y="441.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">reusable templates the user invokes as commands</text><text xml:space="preserve" x="40" y="481.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Before MCP, wiring one internal service into three hosts meant three adapters. After it, one server serves all three.</text><text xml:space="preserve" x="40" y="503.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">The value is the one OpenAPI delivered for REST: a vendor-neutral way to publish capabilities.</text>
</svg>
