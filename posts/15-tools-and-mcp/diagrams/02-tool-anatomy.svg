<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-tool-anatomy-title" aria-describedby="ctx-02-tool-anatomy-desc">
<title id="ctx-02-tool-anatomy-title">Six parts of one tool description</title>
<desc id="ctx-02-tool-anatomy-desc">The JSON definition of the tool search_shipments from the post's toy catalogue, with six numbered markers in the left margin. 1, name: search_shipments. 2, summary: Find shipments that match a customer email, a start date or a status. 3, when to use: Use it when the user describes shipments but gives no shipment id. 4, when not to: Do not use it when a shipment id is known; use get_shipment instead. 5, parameters: email and since as strings with descriptions, and status as an enum of in_transit, delivered, delivery_failed, with additionalProperties false. 6, example: an input_examples entry with an email, a start date and the status delivered.</desc>
