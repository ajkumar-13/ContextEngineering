</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="393">Six parts of one tool description</text>
<text x="40" y="76" class="t-subtitle" data-w="642">search_shipments as the post's snippet builds it; the model reads every line on every call.</text>
<text x="184" y="128" class="t-code" data-w="9">{</text>
<text x="200" y="152" class="t-code" data-w="231">"name": "search_shipments",</text>
<circle cx="56" cy="148" r="12" class="f-surface s-ink-muted w15"/>
<g data-grid="skip">
<text x="56" y="153" text-anchor="middle" class="t-label" data-w="9">1</text>
</g>
<text x="76" y="152" class="t-note" data-w="38">name</text>
<text x="200" y="176" class="t-code" data-w="120">"description":</text>
<text x="220" y="200" class="t-code" data-w="598">"Find shipments that match a customer email, a start date or a status.</text>
<circle cx="56" cy="196" r="12" class="f-surface s-ink-muted w15"/>
<g data-grid="skip">
<text x="56" y="201" text-anchor="middle" class="t-label" data-w="9">2</text>
</g>
<text x="76" y="200" class="t-note" data-w="62">summary</text>
<text x="228" y="224" class="t-code" data-w="564">Use it when the user describes shipments but gives no shipment id.</text>
<circle cx="56" cy="220" r="12" class="f-surface s-ink-muted w15"/>
<g data-grid="skip">
<text x="56" y="225" text-anchor="middle" class="t-label" data-w="9">3</text>
</g>
<text x="76" y="224" class="t-note" data-w="82">when to use</text>
<text x="228" y="248" class="t-code" data-w="598">Do not use it when a shipment id is known; use get_shipment instead.",</text>
<circle cx="56" cy="244" r="12" class="f-surface s-ink-muted w15"/>
<g data-grid="skip">
<text x="56" y="249" text-anchor="middle" class="t-label" data-w="9">4</text>
</g>
<text x="76" y="248" class="t-note" data-w="80">when not to</text>
<text x="200" y="272" class="t-code" data-w="146">"input_schema": {</text>
<text x="220" y="296" class="t-code" data-w="146">"type": "object",</text>
<text x="220" y="320" class="t-code" data-w="129">"properties": {</text>
<circle cx="56" cy="316" r="12" class="f-surface s-ink-muted w15"/>
<g data-grid="skip">
<text x="56" y="321" text-anchor="middle" class="t-label" data-w="9">5</text>
</g>
<text x="76" y="320" class="t-note" data-w="77">parameters</text>
<text x="236" y="344" class="t-code" data-w="650">"email": {"type": "string", "description": "The customer's email address."},</text>
<text x="236" y="368" class="t-code" data-w="650">"since": {"type": "string", "description": "Earliest date, as YYYY-MM-DD."},</text>
<text x="236" y="392" class="t-code" data-w="240">"status": {"type": "string",</text>
<text x="328" y="416" class="t-code" data-w="470">"enum": ["in_transit", "delivered", "delivery_failed"],</text>
<text x="328" y="440" class="t-code" data-w="402">"description": "Only shipments in this state."}</text>
<text x="220" y="464" class="t-code" data-w="18">},</text>
<text x="220" y="488" class="t-code" data-w="129">"required": [],</text>
<text x="220" y="512" class="t-code" data-w="248">"additionalProperties": false</text>
<text x="200" y="536" class="t-code" data-w="18">},</text>
<text x="200" y="560" class="t-code" data-w="163">"input_examples": [</text>
<circle cx="56" cy="556" r="12" class="f-surface s-ink-muted w15"/>
<g data-grid="skip">
<text x="56" y="561" text-anchor="middle" class="t-label" data-w="9">6</text>
</g>
<text x="76" y="560" class="t-note" data-w="57">example</text>
<text x="220" y="584" class="t-code" data-w="632">{"email": "ana@example.com", "since": "2026-09-01", "status": "delivered"}</text>
<text x="200" y="608" class="t-code" data-w="9">]</text>
<text x="184" y="632" class="t-code" data-w="9">}</text>
<path d="M168,304 H160 V518 H168" class="brace"/>
<path d="M168,544 H160 V614 H168" class="brace"/>
<text x="40" y="684" class="t-note" data-w="578">Parts 2 to 4 are sentences of one description; part 5 is the schema; part 6 an example.</text>
</svg>
