<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">The four levers of Select, from user turn to packed prompt</title>
  <desc id="d">A hand-drawn pipeline of four boxes joined by arrows. Lever one, query construction, optimises for a query the index can match, using rewriting, HyDE, and multi-query expansion. Lever two, candidate generation, optimises for recall using dense approximate nearest-neighbour search, sparse BM25, and metadata filtering. Lever three, re-ranking, optimises for precision with a cross-encoder over the candidate set. Lever four, packing, optimises for the budget by bookending the order, deduplicating, trimming, and citing. A scale beneath marks the stages: the user turn becomes a self-contained query, which yields roughly fifty candidates, which the re-ranker cuts to roughly five survivors, which are packed into the prompt. A caption notes N is tuned for recall while k is bounded by budget.</desc>

