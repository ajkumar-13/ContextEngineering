<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">The Select pipeline applied to four different corpora</title>
  <desc id="d">A hand-drawn matrix with four columns — documents, tool schemas, memory rows, and labelled examples — and four rows describing how the same pipeline adapts to each. The corpus item is a document chunk, a tool schema, a memory row, or a labelled example. The query is built from the rewritten user turn for documents and tools, from the intent of the turn for memory, and from the query filtered by label class for examples. Re-ranking scores on relevance alone for documents and tools, on relevance with recency and confidence for memory, and on relevance with diversity through maximal marginal relevance for examples. Packing takes three to five bookended chunks, the handful of schemas that fit, memory's five to ten per cent share, or two or three distinct examples.</desc>

