ive' font-size="11" fill="var(--ce-ink)">one labelled example</text><path d="M40.24 204.23C369.23 205.07 698.42 205.24 920.09 204.1M39.98 203.92C323.46 203 606.67 203.06 920.11 204.07" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="180" y="230.12" text-anchor="end" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Query built from</text><text xml:space="preserve" x="204" y="230.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">the rewritten</text><text xml:space="preserve" x="204" y="243.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">user turn</text><text xml:space="preserve" x="390" y="230.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">the rewritten</text><text xml:space="preserve" x="390" y="243.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">user turn</text><text xml:space="preserve" x="576" y="230.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">the intent of</text><text xml:space="preserve" x="576" y="243.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">the turn</text><text xml:space="preserve" x="762" y="230.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">the query, filtered</text><text xml:space="preserve" x="762" y="243.87" text-anch