" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="180" y="382.12" text-anchor="end" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Packed as</text><text xml:space="preserve" x="204" y="382.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">top 3–5,</text><text xml:space="preserve" x="204" y="395.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">bookended</text><text xml:space="preserve" x="390" y="382.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">the handful</text><text xml:space="preserve" x="390" y="395.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">that fit</text><text xml:space="preserve" x="576" y="382.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">its 5–10%</text><text xml:space="preserve" x="576" y="395.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">share</text><text xml:space="preserve" x="762" y="382.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">two or three,</text><text xml:space="preserve" x="762" y="395.87" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">distinct</text><text xml:space="preserve" x="40" y="448.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-subtle)">Documents: Post 11 · Tools: Post 15 · Memory: Post 16 · Advanced retrieval: Post 17</text><text xml:space="preserve" x="40" y="469.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">A large MCP deployment can expose hundreds of tools. Running them through this pipeline is what keeps the toolbox small.</text>
