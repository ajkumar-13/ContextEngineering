  .s-ink-muted { stroke: var(--ctx-ink-muted); }
  .s-orange { stroke: var(--ctx-orange); }
  .s-orange-line { stroke: var(--ctx-orange-line); }
</style>
<defs>
<marker id="ctx-01-select-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="659">Select is four stages from the user turn to the window</text>
<text x="40" y="76" class="t-subtitle" data-w="554">Recall is won in the candidates, precision in the re-rank. Sizes are illustrative.</text>
<text x="136" y="120" text-anchor="middle" class="t-note" data-w="60">user turn</text>
<path d="M136,128 L136,157" class="flow" marker-end="url(#ctx-01-select-pipeline-arrow)"/>
<rect x="40" y="160" width="196" height="160" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="160" width="196" height="160" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="192" class="t-head" data-w="182">1  Construct the query</text>
<text x="56" y="216" class="t-note" data-w="156">so the index can match</text>
<text x="56" y="252" class="t-label" data-w="136">rewrite the user turn</text>
<text x="56" y="276" class="t-label" data-w="39">HyDE</text>
<text x="56" y="300" class="t-label" data-w="150">expand or decompose</text>
<rect x="268" y="160" width="196" height="160" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="268" y="160" width="196" height="160" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="284" y="192" class="t-head" data-w="187">2  Generate candidates</text>
<text x="284" y="216" class="t-note" data-w="59">for recall</text>
<text x="284" y="252" class="t-label" data-w="87">dense (ANN)</text>
<text x="284" y="276" class="t-label" data-w="99">sparse (BM25)</text>
<text x="284" y="300" class="t-label" data-w="142">hybrid, fused by RRF</text>
<rect x="496" y="160" width="196" height="160" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="496" y="160" width="196" height="160" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="512" y="192" class="t-head" data-w="83">3  Re-rank</text>
<text x="512" y="216" class="t-note" data-w="84">for precision</text>
<text x="512" y="252" class="t-label" data-w="150">a cross-encoder reads</text>
<text x="512" y="276" class="t-label" data-w="137">query and candidate</text>
<text x="512" y="300" class="t-label" data-w="58">together</text>
<rect x="724" y="160" width="196" height="160" rx="8" class="f-orange-soft" data-fit="skip"/>
<rect x="724" y="160" width="196" height="160" rx="8" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="740" y="192" class="t-head" data-w="59">4  Pack</text>
<text x="740" y="216" class="t-note" data-w="96">for the budget</text>
<text x="740" y="252" class="t-label" data-w="99">bookend order</text>
<text x="740" y="276" class="t-label" data-w="113">deduplicate, trim</text>
<text x="740" y="300" class="t-label" data-w="119">cite while packing</text>
