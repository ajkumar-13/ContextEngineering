<text x="136" y="404" text-anchor="middle" class="t-label" data-w="116">one search query</text>
<path d="M136,324 L136,373" class="flow" marker-end="url(#ctx-01-select-pipeline-arrow)"/>
<rect x="284" y="376" width="164" height="48" rx="6" class="w1 nofill s-ink-muted d-lead" data-fit="skip"/>
<text x="368" y="404" text-anchor="middle" class="t-label" data-w="142">top-N: 50 candidates</text>
<path d="M368,324 L368,373" class="flow" marker-end="url(#ctx-01-select-pipeline-arrow)"/>
<rect x="512" y="376" width="164" height="48" rx="6" class="w1 nofill s-ink-muted d-lead" data-fit="skip"/>
<text x="592" y="404" text-anchor="middle" class="t-label" data-w="86">top-k: 5 kept</text>
<path d="M592,324 L592,373" class="flow" marker-end="url(#ctx-01-select-pipeline-arrow)"/>
<rect x="740" y="376" width="164" height="48" rx="6" class="f-orange-soft" data-fit="skip"/>
<rect x="740" y="376" width="164" height="48" rx="6" class="w15 nofill s-orange" data-fit="skip"/>
<text x="824" y="404" text-anchor="middle" class="t-label" data-w="137">04 Retrieved chunks</text>
<path d="M824,324 L824,373" class="flow" marker-end="url(#ctx-01-select-pipeline-arrow)"/>
<text x="40" y="464" class="t-note" data-w="430">Dashed: illustrative sizes. N is set for recall and k by the budget.</text>
<text x="40" y="504" class="t-note" data-w="628">The same four stages select documents, tool schemas, memory rows and few-shot examples.</text>
</svg>
