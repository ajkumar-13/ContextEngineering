<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-select-pipeline-title" aria-describedby="ctx-01-select-pipeline-desc">
<title id="ctx-01-select-pipeline-title">Select is four stages from the user turn to the window</title>
<desc id="ctx-01-select-pipeline-desc">A pipeline of four stages in a row, left to right, starting from the user turn. Construct the query, so the index can match: rewrite the user turn, HyDE, expand or decompose. Generate candidates, for recall: dense (ANN), sparse (BM25), hybrid fused by RRF. Re-rank, for precision: a cross-encoder reads the query and each candidate together. Pack, for the budget: bookend order, deduplicate and trim, cite while packing. Under the first three stages, boxes give what each passes on: one search query, then, dashed as illustrative sizes, top-N of 50 candidates and top-k of 5 kept. The pack stage, in the per-turn colour, writes into layer 04, retrieved chunks.</desc>
<style>
