<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-memory-row-title" aria-describedby="ctx-02-memory-row-desc">
<title id="ctx-02-memory-row-title">A memory row carries nine fields, not just a fact</title>
<desc id="ctx-02-memory-row-desc">Left: the three kinds of memory with an example each. Episodic, events with a timestamp: resolved ticket 4321 on 14 March. Semantic, facts and preferences: prefers replies in formal English. Procedural, rules and how-tos: this client: CSV before PDF. The semantic card is outlined, because the row on the right is semantic. Right: one row as the snippet prints it, id mem-0042; kind semantic; subject user:u-17; content Prefers replies in formal English; source conversation:c-311; created_at 2026-09-01; last_accessed_at 2026-09-01; confidence 0.9; expires_at null. Brackets group the fields as identity (id, kind, subject), content, provenance (source, created_at) and upkeep (last_accessed_at, confidence, expires_at).</desc>
