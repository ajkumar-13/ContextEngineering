<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">The three kinds of memory a write path keeps apart, and the row that holds them</title>
  <desc id="d">A hand-drawn figure in two columns. On the left, three cards name the kinds of memory a write path must keep apart: episodic events with a timestamp, semantic facts and preferences, and procedural rules and how-tos, each with a worked example. On the right, a panel lists the nine fields every memory row carries whatever the store: id, kind, subject, content, source, created_at, last_accessed_at, confidence, and an optional expires_at, each with the reason it exists. Captions give the three write triggers — end of session, explicit user assertion, observed contradiction — state that tool results and conversation turns are transient and never written, and note that confidence decays with time so that below roughly 0.6 the agent should ask rather than assert.</desc>

