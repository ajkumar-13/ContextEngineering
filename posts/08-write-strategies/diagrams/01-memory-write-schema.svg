nt-size="10" fill="var(--ce-ink-subtle)">in production.&quot;</text><path d="M56.11 331.84C144.75 334.47 234.74 334.2 401.5 332.92C412.84 331.78 418.24 340.37 420.87 351.02C422.09 365 417.62 384.91 418.38 417.93C419.33 429.81 415.55 438.26 403.24 434C319.55 436.74 237.65 436.93 56.98 435.37C44.34 436.73 38.8 429.22 41.42 417.26C40.11 405.17 39.71 392.29 40.13 351.9C41.25 338.04 44.36 334.06 59.26 329.98C57.33 332 57.33 332 57.33 332" fill="var(--ce-surface)" stroke="none"/><path d="M58.62 332.61C148.69 333.29 242.49 332.22 402.81 330.75M56.78 332.15C148.73 332.85 240.58 333.01 402.56 332.63M402.67 332C415.5 331.8 419.64 337.63 420.24 348.15M404.31 330.93C415.56 332.77 419.69 339.9 420.83 348.49M418.72 348.44C418.02 374.28 421.25 400.85 419.29 419.7M419.63 349.09C421.33 367.72 420.06 388.8 420.68 418.35M420 418.67C419.65 428.56 413.81 434.52 401.94 434.98M418.01 417.85C419.16 429.49 412.21 437.06 404.23 435.86M402.58 435.69C273.8 434.05 148.09 433.53 57.71 436.26M402.44 436.5C332.21 437.61 262.04 437.61 57.04 436.38M57.33 436C46.42 434.27 38.7 431.53 40.81 419.69M58.59 434.73C45.96 433.8 41.43 430.33 38.27 419.44M38.87 420.16C39.94 390.51 40.21 365.29 41.2 349.45M39.18 419.53C38.77 399.85 38.97 380.39 39.91 348.92M40 349.33C38.12 336.85 46.31 331.23 55.83 331.38M38.14 347.98C41.71 339.53 43.58 333.81 56.85 331.16M57.33 332C57.33 332 57.33 332 57.33 332M57.33 332C57.33 332 57.33 332 57.33 332" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M45.38 341.96C44.96 368.23 44.23 392.51 46.04 425.4M44.63 342.35C45.27 371.64 44.41 400.51 45.51 425.7" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="58" y="353.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ce-ink)">Procedural</text><text xml:space="preserve" x="58" y="372.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Rules and how-tos.</text><text xml:space="preserve" x="58" y="393.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">&quot;When a refund exceeds</text><text xml:space="preserve" x="58" y="405.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">$1 000, route it to the</text><text xml:space="preserve" x="58" y="418.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">manager queue.&quot;</text><path d="M463.41 100.84C635.29 101.35 806.67 102.34 896.14 99.72C910.16 101.04 918 109.41 919.99 124.46C918.46 217.11 917.12 310.04 921.35 411.28C917.7 427.55 911.96 438.18 894.89 433.71C733.94 436.04 570.93 436.8 463.31 436.3C450.08 436.39 439.92 427.49 441.46 413.33C437.94 318.15 439.22 219.32 441.93 124.52C439.69 108.73 448.2 97.65 465.11 99.51C464 100 464 100 464 100" fill="var(--ce-surface)" stroke="none"/><path d="M463.65 99.97C569.92 99.26 676.32 97.58 895.92 99.29M464.13 100.01C591.15 98.67 717.34 98.7 896.47 99.84M896 100C910.77 99.6 920.83 108.98 920.32 125.07M895.71 101.43C913.21 99.16 917.99 110.15 919.56 124.01M920.01 124.83C918.31 219.09 920.21 310.8 920.11 410.84M919.36 123.86C920.32 199.08 920.23 274.74 920.5 412.52M920 412C918.96 428.15 910.72 435.07 895.33 434.84M919.44 410.84C918.85 429.2 911.46 434.83 897.91 436.93M895.08 435.36C784.99 433.79 673.61 435.78 463.93 435M895.89 436.42C794.17 438.13 692.86 438.3 463.55 436.33M464 436C447.57 434.13 441.16 426.61 438.22 413.69M464.92 435.91C446.08 435.29 439.57 428.42 441.42 412.15M439.33 412C439.5 309.7 440.2 205.56 439.25 122.66M439.98 412.67C440.8 328.13 440.99 244.17 439.6 123.86M440 124C439.76 106.3 448.21 101.96 462.24 101.78M440.11 125.58C439.8 107.34 448.27 100.87 465.39 98.3M464 100C464 100 464 100 464 100M464 100C464 100 464 100 464 100" fill="none" stroke="var(--ce-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="456" y="121.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ce-ink)">The minimum row</text><text xml:space="preserve" x="456" y="139.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Whatever the store — SQL table, document DB, vector index</text><text xml:space="preserve" x="456" y="154.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">with metadata — every row carries these nine fields.</text><text xml:space="preserve" x="456" y="182.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">id</text><text xml:space="preserve" x="610" y="182.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">stable reference for updates and deletes</text><text xml:space="preserve" x="456" y="210.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">kind</text><text xml:space="preserve" x="610" y="210.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">episodic / semantic / procedural: different rules</text><text xml:space="preserve" x="456" y="238.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">subject</text><text xml:space="preserve" x="610" y="238.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">the entity it is about (user, project, agent)</text><text xml:space="preserve" x="456" y="266.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">content</text><text xml:space="preserve" x="610" y="266.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">the fact itself, in its recall representation</text><text xml:space="preserve" x="456" y="294.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">source</text><text xml:space="preserve" x="610" y="294.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">where it came from: URL, tool, conversation id</text><text xml:space="preserve" x="456" y="322.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">created_at</text><text xml:space="preserve" x="610" y="322.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">timestamp of the original write</text><text xml:space="preserve" x="456" y="350.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">last_accessed_at</text><text xml:space="preserve" x="610" y="350.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">updated on every read; drives decay</text><text xml:space="preserve" x="456" y="378.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">confidence</text><text xml:space="preserve" x="610" y="378.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">0 to 1; gates whether the agent asserts or asks</text><text xml:space="preserve" x="456" y="406.12" text-anchor="start" font-family='"JetBrains Mono",ui-monospace,Menlo,monospace' font-size="11" fill="var(--ce-ink)">expires_at</text><text xml:space="preserve" x="610" y="406.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">optional; some facts are knowingly short-lived</text><text xml:space="preserve" x="40" y="463.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Write at the end of a session, on an explicit user assertion, and on an observed contradiction.</text><text xml:space="preserve" x="40" y="485.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Never write a tool result or a conversation turn: both are transient and live in their own layer.</text><text xml:space="preserve" x="40" y="507.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Confidence decays with time unconfirmed. Below roughly 0.6 the agent should ask rather than assert.</text>
</svg>
