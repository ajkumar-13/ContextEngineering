<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-index-write-pipeline-title" aria-describedby="ctx-03-index-write-pipeline-desc">
<title id="ctx-03-index-write-pipeline-title">The write path records provenance as it goes</title>
<desc id="ctx-03-index-write-pipeline-desc">A chain of six boxes from left to right: Collect (keep a hash), Clean (strip boilerplate), Chunk (self-contained), Enrich (add context), Embed (vector per chunk), Index (vector and BM25). The index box is coloured as layer 04, which it fills. Under four of the boxes, the chunk metadata that step records: source_id, source_url at collect; chunk_index, tokens at chunk; embedding_model at embed; created_at at index. Below, a manifest card: one row per source with its hash, the chunks produced, the embedding model version and the time. An arrow labelled select at query time runs from the index down to a box for 04 Retrieved chunks.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
    --ctx-accent: #D98E5F;
    --ctx-success: #5C9E78;
    --ctx-warn: #B8895A;
    --ctx-alert: #C66B5E;
    --ctx-neutral-1: #EAEAE4;
    --ctx-neutral-2: #CFCFC8;
    --ctx-neutral-3: #8E8E88;
    --ctx-on-fill: #FFFDF9;
    --ctx-on-accent: #1A1A1A;
    --ctx-grid: rgba(26, 26, 26, 0.06);
