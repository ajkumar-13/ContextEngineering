<text x="856" y="260" text-anchor="middle" class="t-code" data-w="86">created_at</text>
<text x="52" y="332" class="t-note" data-w="520">Chunk metadata: each field is recorded at the step where its value first exists.</text>
<rect x="52" y="376" width="612" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="52" y="376" width="612" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="68" y="408" class="t-head" data-w="239">Manifest: one row per source</text>
<text x="68" y="432" class="t-label" data-w="472">its hash, the chunks produced, the embedding model version, the time</text>
<rect x="728" y="376" width="188" height="72" rx="8" class="f-orange-soft" data-fit="skip"/>
<rect x="728" y="376" width="188" height="72" rx="8" class="w1 nofill s-orange-line" data-fit="skip"/>
<text x="744" y="408" class="t-label" data-w="86">04 Retrieved</text>
<text x="744" y="432" class="t-label" data-w="48">chunks</text>
<path d="M908,204 L908,369" class="flow" marker-end="url(#ctx-03-index-write-pipeline-arrow)"/>
<text x="896" y="360" text-anchor="end" class="t-note" data-w="132">select at query time</text>
<text x="40" y="504" class="t-note" data-w="542">Provenance is written along the way, so every chunk can say where it came from.</text>
</svg>
