<rect x="644" y="128" width="128" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="656" y="160" class="t-head" data-w="57">Embed</text>
<text x="656" y="184" class="t-note" data-w="112">vector per chunk</text>
