  .axis { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--ctx-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--ctx-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--ctx-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-neutral-soft { fill: var(--ctx-neutral-soft); }
  .f-orange-soft { fill: var(--ctx-orange-soft); }
  .s-border { stroke: var(--ctx-border); }
  .s-orange-line { stroke: var(--ctx-orange-line); }
</style>
<defs>
<marker id="ctx-03-index-write-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="549">The write path records provenance as it goes</text>
<text x="40" y="76" class="t-subtitle" data-w="636">The offline write path of an embedding index, and the step that records each chunk field.</text>
<rect x="52" y="128" width="128" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="52" y="128" width="128" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="64" y="160" class="t-head" data-w="58">Collect</text>
<text x="64" y="184" class="t-note" data-w="81">keep a hash</text>
<rect x="200" y="128" width="128" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="200" y="128" width="128" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="212" y="160" class="t-head" data-w="46">Clean</text>
<text x="212" y="184" class="t-note" data-w="105">strip boilerplate</text>
<rect x="348" y="128" width="128" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="348" y="128" width="128" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="360" y="160" class="t-head" data-w="53">Chunk</text>
<text x="360" y="184" class="t-note" data-w="96">self-contained</text>
