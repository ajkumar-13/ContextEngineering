ted)">AGENTS.md · rules block</text><text xml:space="preserve" x="772" y="217.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Until policy changes</text><path d="M40.08 238.23C318.48 237.58 597.23 237.59 919.87 238.05M40.08 238.09C272.89 238.22 505.59 238.17 920.11 238.1" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.59 246.57C41.04 257.4 40.06 267.8 40.24 276.8M40.54 245.45C40 255.97 39.62 266.68 39.98 275.61" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="264.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Build command is pnpm run build:prod</text><text xml:space="preserve" x="476" y="263.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">AGENTS.md · knowledge block</text><text xml:space="preserve" x="772" y="263.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Until the build changes</text><path d="M40.24 284.12C299.29 284.27 558.5 284.56 919.82 284.11M39.97 284.06C297.57 283.24 555.11 283.16 920 283.94" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40.4 291.98C39.39 301.4 39.94 312.55 40.02 323.12M39.99 292.52C39.48 303.67 39.45 315.11 39.43 322.05" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="310.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">The 200-page product manual</text><text xml:space="preserve" x="476" y="309.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Embedding index</text><text xml:space="preserve" x="772" y="309.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Until the manual changes</text><path d="M39.92 330C279.61 329.11 519.78 329.2 919.77 330.18M40.1 330.03C322.24 330.58 604.63 330.72 919.89 330.03" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M38.81 337.39C40.14 347.8 39.83 357.31 39.79 367.03M39.44 338.39C40.16 344.17 40.48 350.35 40.07 368.5" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="54" y="356.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">&quot;I still need to check file C&quot;, mid-task</text><text xml:space="preserve" x="476" y="355.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Scratchpad</text><text xml:space="preserve" x="772" y="355.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">This task only</text><path d="M40.08 375.88C260.41 376.27 481.05 376.16 920.21 375.76M39.99 376.01C347.15 375.84 654.15 375.72 920.02 375.88" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.61 382.8C40.9 391.8 39.72 402.06 39.56 413.35M40.1 384.26C39.64 390.68 40.31 397.58 39.52 413.75" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round