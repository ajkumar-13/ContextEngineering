<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">What to write where: eight cases and their destinations</title>
  <desc id="d">A hand-drawn table of eight rows pairing something an agent learns with the destination it belongs in and how long it lasts there. A stated preference goes to the semantic memory store for months, decaying. A resolved ticket goes to episodic memory for weeks to months. A refund policy goes to the rules block of AGENTS.md until the policy changes. A build command goes to its knowledge block. A long product manual goes to the embedding index. A mid-task note goes to the scratchpad for this task only. The last two rows are written nowhere: a tool result because it is transient, and an API token because secrets never enter a writable store. A caption notes those last two rows are the operational heart of the post, because most weird agent behaviour months later begins there.</desc>

