<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-interleaved-tool-turn-title" aria-describedby="ctx-03-interleaved-tool-turn-desc">
<title id="ctx-03-interleaved-tool-turn-title">Each step of a tool loop reads the last request</title>
<desc id="ctx-03-interleaved-tool-turn-desc">Top: one tool-use turn on Claude Opus 4.6 as a row of blocks in the order they occur, with illustrative token counts: thinking 1,200, tool call 100, tool result 800, thinking 900, tool call 100, tool result 600, thinking 700, answer 400. Each thinking block opens step 1, 2 or 3 of the turn. Bottom: the three requests drawn to one token scale with dashed outlines. Request 1 sends 10,500 input tokens, 4,600 read from the cache and 5,900 new; request 2 sends 12,600, 10,500 read and 2,100 new; request 3 sends 14,200, 12,600 read and 1,600 new. A note states that the turn's output is 3,400 tokens, 2,800 of them thinking in three segments.</desc>
<style>
