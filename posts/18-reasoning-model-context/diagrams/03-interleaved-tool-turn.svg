  .f-surface { fill: var(--ctx-surface); }
  .s-blue { stroke: var(--ctx-blue); }
  .s-green { stroke: var(--ctx-green); }
  .s-green-line { stroke: var(--ctx-green-line); }
  .s-ink { stroke: var(--ctx-ink); }
  .s-ink-muted { stroke: var(--ctx-ink-muted); }
</style>
