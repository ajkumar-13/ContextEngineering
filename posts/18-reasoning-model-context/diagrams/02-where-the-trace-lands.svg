<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-where-the-trace-lands-title" aria-describedby="ctx-02-where-the-trace-lands-desc">
<title id="ctx-02-where-the-trace-lands-title">In the system prompt, the trace breaks the cached prefix</title>
<desc id="ctx-02-where-the-trace-lands-desc">Four horizontal bars price the input of the next call on Claude Opus 4.6 after a turn whose 2,000 tokens of thinking text are copied into one layer, drawn to one token scale with dashed outlines because the counts are illustrative. Copied nowhere: 4,600 tokens read from the cache and 5,900 at full price, $0.03180. Into layer 06, appended to the question: 4,600 read and 7,900 at full price, $0.04180. Into layer 03, saved to memory and read back: the same, $0.04180. Into layer 01, spliced into the system prompt: 1,600 read, 5,000 written to the cache again at 1.25 times the base price, and 5,900 at full price, $0.06155. A note states that the system prompt changes every turn, so the write repeats.</desc>
<style>
