<text x="40" y="468" class="t-label" data-w="443">Layer 01 changes on every turn, so the write repeats on every call.</text>
<text x="40" y="504" class="t-note" data-w="599">Only text copied in front of a cache breakpoint breaks the prefix; every copy costs tokens.</text>
