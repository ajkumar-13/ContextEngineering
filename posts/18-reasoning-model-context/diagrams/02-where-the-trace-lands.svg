<rect x="335.68" y="344" width="224" height="40" class="w1 nofill s-red d-proj" data-fit="skip"/>
<text x="447.68" y="369" text-anchor="middle" class="t-label f-red-ink" data-w="37">5,000</text>
<rect x="559.68" y="344" width="264.32" height="40" class="f-neutral-soft" data-fit="skip"/>
<rect x="559.68" y="344" width="264.32" height="40" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
