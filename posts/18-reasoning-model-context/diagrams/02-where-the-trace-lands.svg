</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="691">In the system prompt, the trace breaks the cached prefix</text>
<text x="40" y="76" class="t-subtitle" data-w="654">Next call's input on Claude Opus 4.6, 2,000 tokens of thinking text copied; sizes illustrative.</text>
<text x="40" y="144" class="t-head" data-w="132">Copied nowhere</text>
<text x="40" y="164" class="t-note" data-w="159">thinking text not reused</text>
<g data-grid="skip">
