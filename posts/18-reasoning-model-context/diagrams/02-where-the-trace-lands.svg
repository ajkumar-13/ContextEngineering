</g>
<rect x="40" y="420" width="16" height="16" class="s-blue w15 nofill d-proj"/>
<text x="72" y="432" class="t-label" data-w="173">read from the cache, 0.1×</text>
<rect x="272" y="420" width="16" height="16" class="s-red w15 nofill d-proj"/>
