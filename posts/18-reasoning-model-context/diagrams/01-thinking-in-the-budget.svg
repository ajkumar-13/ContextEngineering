<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-thinking-in-the-budget-title" aria-describedby="ctx-01-thinking-in-the-budget-desc">
<title id="ctx-01-thinking-in-the-budget-title">At high effort, thinking outweighs the whole prompt</title>
<desc id="ctx-01-thinking-in-the-budget-desc">Three horizontal bars budget one hard agent turn on Claude Opus 4.6 at low, medium and high effort, drawn to one token scale with dashed outlines because every count is illustrative. Each bar starts with the same 10,500 input tokens, split by layer: 01 System prompt 3,000, 02 Tools and MCP descriptions 1,600, 03 Memory and state 1,200, 04 Retrieved chunks 2,500, 05 Conversation history 2,000 and 06 User instruction 200. Then come the thinking tokens, 1,000 at low, 4,000 at medium and 16,000 at high effort, and a 1,500-token answer. The turn costs $0.09430, $0.16930 and $0.46930, and thinking is 40.0%, 72.7% and 91.4% of the output. A note states that high effort costs 4.98 times low effort.</desc>
<style>
