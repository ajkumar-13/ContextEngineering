outcomes:
  - id: o1
    text: "Budget thinking tokens as a separate output line, priced at the output rate, and size the output cap and the window to hold them."
  - id: o2
    text: "Choose an effort level per task instead of one global setting, knowing that changing it inside a cached conversation restarts the cache."
  - id: o3
    text: "Keep the text of reasoning traces out of the application's own layers, the cached prefix and long-term memory, while passing thinking blocks back unchanged."
  - id: o4
    text: "Budget an interleaved tool-use loop as one thinking segment per step, and keep its trail of tool calls and results at full fidelity."
  - id: o5
    text: "Decide when thinking can replace a hand-built reasoning step and when low effort, retrieval or a tool call is the better choice."
