<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d">
  <title id="t">Effective attention as a function of position in a long prompt</title>
  <desc id="d">A hand-drawn U-shaped curve above a band split into three tinted regions. The left region is the start of the prompt: the cached prefix holding the system prompt and tools, where attention is high. The middle region holds long retrieved documents and conversation history and is labelled lost in the middle, where the curve reaches its lowest point. The right region is the recency window holding memory and the user question, where attention rises again. A caption notes the figure is schematic: the exact dip varies by model, training regime, and prompt length, but the U-shape is robust.</desc>

