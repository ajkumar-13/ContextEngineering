<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Lost in the middle: U-shaped recall across the context window</title>
  <desc id="d">A hand-drawn line plot. The horizontal axis is where a relevant fact sits in a long context, from the start through the twenty-fifth percentile, the middle, and the seventy-fifth percentile to the end. The vertical axis is retrieval accuracy from twenty to seventy-five per cent. The curve starts high at about seventy-five per cent, falls to a marked trough of roughly forty per cent at the middle, and climbs back to about seventy-three per cent at the end. Annotations note that the system prompt sits at the high left end and that the user instruction belongs at the high right end. A caption states the plot is stylised after Liu and colleagues, 2023, and that exact numbers vary by model and task while the shape does not.</desc>

