<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-03-prefix-reuse-title" aria-describedby="ctx-03-prefix-reuse-desc">
<title id="ctx-03-prefix-reuse-title">A cache reuses an identical prefix, or nothing</title>
<desc id="ctx-03-prefix-reuse-desc">Two panels, each drawing two consecutive calls as strips of the six layers, widths proportional to tokens as printed by snippets/prefix_reuse.py. Layout A, stable layers first: call 2 has 166 tokens; its first 109 tokens match call 1, and with the cache breakpoint after layer 02 its 99 tokens of layers 01 and 02 are read from the cache and 67 are computed. Layout B, the time of the call at the top of the system prompt: only the first 6 tokens match, so nothing is read from the cache and all 176 tokens of call 2 are computed.</desc>
