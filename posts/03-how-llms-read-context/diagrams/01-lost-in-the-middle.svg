<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-lost-in-the-middle-title" aria-describedby="ctx-01-lost-in-the-middle-desc">
<title id="ctx-01-lost-in-the-middle-title">The middle of a long input is used least</title>
<desc id="ctx-01-lost-in-the-middle-desc">A line chart of accuracy against the position of the document that holds the answer among 20 retrieved documents, cited from Liu et al. (2023), Table 6. GPT-3.5-Turbo, hollow circles: 75.8% at position 1, 57.2% at 5, 53.8% at 10, 55.4% at 15 and 63.2% at 20. Claude-1.3, hollow squares: 59.9%, 55.9%, 56.8%, 57.2% and 60.1%. A dotted line marks GPT-3.5-Turbo with no documents at all, 56.1% (Table 1). A red band shades the middle positions 5 to 15, where both models score lowest.</desc>
