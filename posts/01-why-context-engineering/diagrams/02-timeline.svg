    --ctx-red-soft: #F8E3E1;
    --ctx-red-line: #DDA49F;
    --ctx-purple: #A14D8C;
    --ctx-purple-ink: #833E72;
    --ctx-purple-soft: #F4E4EF;
    --ctx-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ctx-bg: #0E0F12;
