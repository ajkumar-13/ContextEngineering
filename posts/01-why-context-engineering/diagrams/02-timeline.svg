<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-timeline-title" aria-describedby="ctx-02-timeline-desc">
<title id="ctx-02-timeline-title">The work changed for years before the name did</title>
<desc id="ctx-02-timeline-desc">A horizontal timeline from 2020 to 2026 with a tick at each year. Below the axis, the changes to the work: the RAG paper by Lewis et al. in 2020, OpenAI function calling in June 2023, and the Model Context Protocol in November 2024. Above the axis, the naming of the work: Lance Martin's essay and Andrej Karpathy's post in June 2025, and Anthropic Engineering's article in September 2025.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
