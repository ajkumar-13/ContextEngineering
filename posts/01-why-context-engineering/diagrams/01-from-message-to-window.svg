</g>
<path d="M752,408 Q756,408 756,416 L756,420 Q756,428 760,428 Q756,428 756,436 L756,440 Q756,448 752,448" class="s-purple w1 nofill"/>
<g data-grid="skip">
<text x="768" y="433" class="t-note f-purple-ink" data-w="45">trigger</text>
