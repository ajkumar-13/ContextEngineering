<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-from-message-to-window-title" aria-describedby="ctx-01-from-message-to-window-desc">
<title id="ctx-01-from-message-to-window-title">The work moved from one message to a window of six layers</title>
<desc id="ctx-01-from-message-to-window-desc">Two panels of equal height. Left, prompt engineering in 2022: one tall purple box, 06 User instruction, the one message the engineer rewords, fills the whole surface. Right, context engineering in 2025: a stack of six equal bands sent top to bottom, 01 System prompt and 02 Tools and MCP descriptions in blue, bracketed as the stable prefix; 03 Memory and state and 04 Retrieved chunks in orange, the per-turn injection; 05 Conversation history in green, the growing tail; 06 User instruction in purple, the trigger. Labels left of the bands say 02 was added by tools, 03 by memory and 04 by retrieval, and that 01 and 05 were already there. No token sizes are drawn.</desc>
