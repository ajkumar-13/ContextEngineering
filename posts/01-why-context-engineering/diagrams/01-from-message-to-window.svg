<text x="56" y="324" class="t-note" data-w="141">the one message the</text>
<text x="56" y="344" class="t-note" data-w="117">engineer rewords</text>
<text x="40" y="504" class="t-note" data-w="495">Tools, memory and retrieval each added a layer that the user never typed.</text>
