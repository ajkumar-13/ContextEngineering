<rect x="472" y="264" width="272" height="40" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="488" y="288" class="t-label" data-w="143">03 Memory and state</text>
<text x="456" y="288" text-anchor="end" class="t-note" data-w="122">added by memory</text>
<rect x="472" y="312" width="272" height="40" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="488" y="336" class="t-label" data-w="137">04 Retrieved chunks</text>
<text x="456" y="336" text-anchor="end" class="t-note" data-w="121">added by retrieval</text>
<rect x="472" y="360" width="272" height="40" rx="8" class="f-green-soft s-green-line w1"/>
<text x="488" y="384" class="t-label" data-w="159">05 Conversation history</text>
<text x="456" y="384" text-anchor="end" class="t-note" data-w="160">there, rarely engineered</text>
<rect x="472" y="408" width="272" height="40" rx="8" class="f-purple-soft s-purple-line w1"/>
<text x="488" y="432" class="t-label" data-w="127">06 User instruction</text>
<text x="472" y="472" class="t-note" data-w="57">sent last</text>
<path d="M752,168 Q756,168 756,176 L756,204 Q756,212 760,212 Q756,212 756,220 L756,248 Q756,256 752,256" class="s-blue w1 nofill"/>
