<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="742">The work moved from one message to a window of six layers</text>
<text x="40" y="76" class="t-subtitle" data-w="646">Layer 06 is still the user's sentence; the five layers above it are assembled by an engineer.</text>
<text x="40" y="120" class="t-head" data-w="209">Prompt engineering, 2022</text>
<text x="352" y="120" class="t-head" data-w="213">Context engineering, 2025</text>
<text x="472" y="156" class="t-note" data-w="59">sent first</text>
<rect x="472" y="168" width="272" height="40" rx="8" class="f-blue-soft s-blue-line w1"/>
