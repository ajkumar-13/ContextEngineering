<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Prompt engineering is a subset of context engineering</title>
  <desc id="d">A hand-drawn nested-set diagram. A large rounded container labelled Context engineering holds six layer cards in a three-by-two grid: system prompt, tools and MCP, memory and state, retrieved RAG chunks, conversation history, and the user instruction. A loose circle labelled Prompt engineering is drawn around the sixth card alone, showing that prompt engineering is a strict subset of context engineering. Captions note that the stable layers cache while the volatile ones are re-assembled every turn, and that prompt engineering tunes one cell of the grid where context engineering tunes the whole grid.</desc>

