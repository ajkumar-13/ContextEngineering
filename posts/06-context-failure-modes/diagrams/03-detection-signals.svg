<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Which failure modes leave a metric you can alert on</title>
  <desc id="d">A hand-drawn figure in two groups. The upper group holds three cards, each with a small sparkline showing the shape its metric makes. Distraction shows retrieval precision sagging. Tool-storm shows tool calls per turn jumping out of their usual band. Lost in the middle shows accuracy falling as prompt length grows, with short prompts still fine, which is what hides it. The lower group holds two dashed cards for the modes with no clean metric: conflict, where two disagreeing sources look like a normal answer, and confusion, where a violated rule looks like a followed one until somebody reads the transcript. A caption notes both surface through an LLM judge on sampled transcripts.</desc>

