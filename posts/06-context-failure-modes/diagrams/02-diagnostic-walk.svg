  .s-rule { stroke: var(--ctx-rule); }
</style>
<defs>
<marker id="ctx-02-diagnostic-walk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="568">Five questions, asked in order, name the mode</text>
<text x="40" y="76" class="t-subtitle" data-w="687">Systems faults in the logs are ruled out first; each yes names a mode and the place to look first.</text>
<rect x="40" y="104" width="432" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="104" width="432" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="144" class="t-head f-ink-muted" data-w="10">1</text>
<text x="88" y="144" class="t-label" data-w="225">Is the answer fluent but off topic?</text>
<rect x="568" y="104" width="352" height="72" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="584" y="136" class="t-head" data-w="91">Distraction</text>
<text x="584" y="160" class="t-note" data-w="328">look at the retrieved set, then the system prompt</text>
<path d="M480,140 L557,140" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="520" y="128" text-anchor="middle" class="t-note" data-w="23">yes</text>
<path d="M104,176 L104,197" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="116" y="192" class="t-note" data-w="30">then</text>
<rect x="40" y="200" width="432" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="200" width="432" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="240" class="t-head f-ink-muted" data-w="10">2</text>
<text x="88" y="240" class="t-label" data-w="344">Does it break a clearly stated rule or misuse a tool?</text>
<rect x="568" y="200" width="352" height="72" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="584" y="232" class="t-head" data-w="84">Confusion</text>
<text x="584" y="256" class="t-note" data-w="321">look at the system prompt and tool descriptions</text>
<path d="M480,236 L557,236" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="520" y="224" text-anchor="middle" class="t-note" data-w="23">yes</text>
<path d="M104,272 L104,293" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="116" y="288" class="t-note" data-w="30">then</text>
<rect x="40" y="296" width="432" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="296" width="432" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="336" class="t-head f-ink-muted" data-w="10">3</text>
<text x="88" y="336" class="t-label" data-w="254">Do two parts of the window disagree?</text>
<rect x="568" y="296" width="352" height="72" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="584" y="328" class="t-head" data-w="65">Conflict</text>
<text x="584" y="352" class="t-note" data-w="342">look at memory and retrieval, for a precedence rule</text>
<path d="M480,332 L557,332" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="520" y="320" text-anchor="middle" class="t-note" data-w="23">yes</text>
<path d="M104,368 L104,389" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="116" y="384" class="t-note" data-w="30">then</text>
<rect x="40" y="392" width="432" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="392" width="432" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="432" class="t-head f-ink-muted" data-w="10">4</text>
<text x="88" y="432" class="t-label" data-w="259">Does quality drop only on long inputs?</text>
<rect x="568" y="392" width="352" height="72" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="584" y="424" class="t-head" data-w="154">Lost-in-the-middle</text>
<text x="584" y="448" class="t-note" data-w="277">look at the packing order, then the length</text>
<path d="M480,428 L557,428" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="520" y="416" text-anchor="middle" class="t-note" data-w="23">yes</text>
<path d="M104,464 L104,485" class="flow" marker-end="url(#ctx-02-diagnostic-walk-arrow)"/>
<text x="116" y="480" class="t-note" data-w="30">then</text>
<rect x="40" y="488" width="432" height="72" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="488" width="432" height="72" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="528" class="t-head f-ink-muted" data-w="10">5</text>
<text x="88" y="528" class="t-label" data-w="258">Do tool calls pile up without progress?</text>
<rect x="568" y="488" width="352" height="72" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="584" y="520" class="t-head" data-w="91">Tool-storm</text>
