<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-diagnostic-walk-title" aria-describedby="ctx-02-diagnostic-walk-desc">
<title id="ctx-02-diagnostic-walk-title">Five questions, asked in order, name the mode</title>
<desc id="ctx-02-diagnostic-walk-desc">A walk of five numbered questions down a spine, asked in order after systems faults are ruled out. Question 1, Is the answer fluent but off topic? Yes leads right to Distraction: look at the retrieved set, then the system prompt. Question 2, Does it break a clearly stated rule or misuse a tool? Yes leads right to Confusion: look at the system prompt and tool descriptions. Question 3, Do two parts of the window disagree? Yes leads right to Conflict: look at memory and retrieval, for a precedence rule. Question 4, Does quality drop only on long inputs? Yes leads right to Lost-in-the-middle: look at the packing order, then the length. Question 5, Do tool calls pile up without progress? Yes leads right to Tool-storm: look at the catalogue and the loop cap. Every question is asked in turn, whatever the answer before; a report with no yes reaches a dashed box: none of the five, a model problem, not a context problem.</desc>
