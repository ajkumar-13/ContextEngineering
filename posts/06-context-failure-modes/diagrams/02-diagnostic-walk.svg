<text x="116" y="576" class="t-note" data-w="81">no yes at all</text>
<rect x="40" y="584" width="432" height="72" rx="8" class="w1 nofill s-ink-muted d-lead" data-fit="skip"/>
<text x="56" y="616" class="t-head" data-w="277">None of the five: a model problem</text>
<text x="56" y="640" class="t-note" data-w="281">not a context problem (post 01, section 5)</text>
<text x="40" y="684" class="t-note" data-w="563">A report can earn two yeses; then both modes are present and both first fixes apply.</text>
</svg>
