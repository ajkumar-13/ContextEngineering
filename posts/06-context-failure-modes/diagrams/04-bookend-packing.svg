<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-04-bookend-packing-title" aria-describedby="ctx-04-bookend-packing-desc">
<title id="ctx-04-bookend-packing-title">Bookend packing keeps the two best chunks at the ends</title>
<desc id="ctx-04-bookend-packing-desc">Two strips of five retrieved chunks, labelled by rank from 1 (best) to 5, each followed by the user instruction, sent left to right, over a shaded band that marks the middle of the input. Score order runs 1, 2, 3, 4, 5, so chunks 2, 3 and 4 sit in the middle. Bookend runs 1, 3, 4, 5, 2, so the two best chunks hold the start and the end and chunks 3, 4 and 5 fill the middle. The user instruction is last in both.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
    --ctx-accent: #D98E5F;
