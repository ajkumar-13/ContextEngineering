<text x="40" y="76" class="t-subtitle" data-w="613">Five retrieved chunks, ranked 1 (best) to 5, then the user instruction, sent left to right.</text>
<rect x="296" y="176" width="312" height="248" rx="8" class="f-red-soft" data-fit="skip"/>
<text x="452" y="448" text-anchor="middle" class="t-note" data-w="327">middle of the input: used least reliably (Liu et al.)</text>
