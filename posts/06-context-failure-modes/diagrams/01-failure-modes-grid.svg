<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-01-failure-modes-grid-title" aria-describedby="ctx-01-failure-modes-grid-desc">
<title id="ctx-01-failure-modes-grid-title">Each failure mode starts in a few layers</title>
<desc id="ctx-01-failure-modes-grid-desc">A grid with one row per failure mode, one column per layer from 01 System prompt to 06 User instruction, and a last column for the first fix. Distraction: also in 01, starts in 04, also in 05; first fix: lower top-k, add a reranker. Confusion: starts in 01, starts in 02; first fix: explicit, motivated, exemplified rules. Conflict: a side in 01, a side in 03, a side in 04, a side in 05; first fix: provenance stamp, precedence rule. Lost-in-the-middle: starts in 04, starts in 05, also in 06; first fix: bookend packing; summarise old history. Tool-storm: also in 01, starts in 02; first fix: trim the catalogue, cap the loop. Key: starts, the layer the mode begins in; also, a layer that shares it; a side, one of two parts that disagree.</desc>
