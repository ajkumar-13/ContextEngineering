<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="t d">
  <title id="t">Five context failure modes mapped to layers</title>
  <desc id="d">A hand-drawn table of five rows, one per context failure mode, with columns for the symptom users report, the layer the mode originates in, and the cheapest first fix. Distraction produces a fluent but off-topic answer from retrieval or the system prompt, and is fixed by tightening Select and adding a reranker. Confusion is the right information with the wrong choice, from the system prompt or tools, fixed by explicit exemplified rules. Conflict is an internally contradictory answer from memory or retrieval, fixed with a provenance and precedence rule. Lost in the middle is a long context whose middle is ignored, from retrieval or history, fixed by bookend packing. Tool-storm is tool calls without progress, from the tools layer, fixed by trimming the catalogue and capping the loop. A caption notes the small remainder are model or systems bugs, not context bugs.</desc>

  <style><![CDATA[
    :root{--ce-bg:#FAFAF7;--ce-surface:#FFFFFF;--ce-ink:#1A1A1A;--ce-ink-muted:#5C5C5C;--ce-ink-subtle:#9A9A9A;--ce-border:#D9D9D4;--ce-primary:#5B7FBF;--ce-accent:#D98E5F;--ce-success:#5C9E78;--ce-warn:#B8895A;--ce-alert:#C66B5E;--ce-neutral-1:#EAEAE4;--ce-neutral-2:#CFCFC8;--ce-neutral-3:#8E8E88;--ce-on-fill:#FFFDF9;--ce-on-accent:#1A1A1A;}
    @media (prefers-color-scheme:dark){:root{--ce-bg:#0E0F12;--ce-surface:#16181C;--ce-ink:#F2F2EE;--ce-ink-muted:#B4B4AE;--ce-ink-subtle:#6E6E68;--ce-border:#2A2D33;--ce-primary:#8BA8E0;--ce-accent:#E8B088;--ce-success:#7FBF9B;--ce-warn:#D4B58A;--ce-alert:#D88880;--ce-neutral-1:#1F2229;--ce-neutral-2:#2C3038;--ce-neutral-3:#6E6E68;--ce-on-fill:#14161A;--ce-on-accent:#1A1A1A;}}
    .bg{fill:var(--ce-bg);}
    text{dominant-baseline:auto;}
  ]]></style>

  <rect class="bg" width="820" height="380"/>
