ext xml:space="preserve" x="396" y="124.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">RAG / system</text><text xml:space="preserve" x="536" y="124.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">tighten Select; add a reranker</text><path d="M31.92 144.23C207.25 144.19 382.15 144.51 787.84 144.14M32.11 143.99C318.97 144.31 605.65 144.25 788.1 144.05" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M33.18 152.56C31.27 159.58 32.63 166.09 32.13 178.86M31.5 152.14C31.94 159.19 32.21 166.76 31.9 180.57" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="46" y="168.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Confusion</text><text xml:space="preserve" x="180" y="168.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">right info present, wrong choice</text><text xml:space="preserve" x="396" y="168.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">system / tools</text><text xml:space="preserve" x="536" y="168.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">explicit, exemplified rules</text><path d="M31.92 187.99C217.44 187.52 402.99 187.13 787.98 187.83M32.03 188C253.81 187.54 475.4 187.55 788.11 187.96" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M33.19 195.37C32.91 203.31 31.32 211.42 32.82 223.72M32.28 196.22C31.89 206.45 31.38 217.55 31.96 224.15" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="46" y="212.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Conflict</text><text xml:space="preserve" x="180" y="212.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">internally contradictory answer</text><text xml:space="preserve" x="396" y="212.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">memory / RAG</text><text xml:space="preserve" x="536" y="212.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">provenance + precedence rule</text><path d="M31.92 232.24C227.63 232.37 423.35 232.22 788.12 232.01M31.95 232.02C188.41 231.02 345.15 231.09 787.88 232.12" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M33.2 240.58C32.53 247.05 32.77 256.75 31.1 268.57M31.86 240.3C32.21 248.1 32.11 255.93 32.02 267.72" fill="none" stroke="var(--ce-warn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="46" y="256.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Lost in the middle</text><text xml:space="preserve" x="180" y="256.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">long context, middle ignored</text><text xml:space="preserve" x="396" y="256.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">RAG / history</text><text xml:space="preserve" x="536" y="256.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">bookend packing</text><path d="M31.92 276C237.82 275.23 444.19 275.32 787.77 276.18M32.1 276.03C274.46 276.48 517.06 276.63 787.89 276.03" fill="none" stroke="var(--ce-border)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M30.81 283.39C32.14 293.18 31.83 302.07 31.79 311.03M31.44 284.39C32.16 289.76 32.48 295.52 32.07 312.5" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="46" y="300.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Tool-storm</text><text xml:space="preserve" x="180" y="300.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">tool calls without progress</text><text xml:space="preserve" x="396" y="300.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">tools (layer 02)</text><text xml:space="preserve" x="536" y="300.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">trim catalogue; cap the loop</text><text xml:space="preserve" x="32" y="343.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Walk these five in order on every bug report. The first yes is almost always the right one.</text><text xml:space="preserve" x="32" y="363.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">The small remainder are model bugs or systems bugs; neither is a context bug.</text>
</svg>
