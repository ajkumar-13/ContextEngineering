<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-ruler-effective-length-title" aria-describedby="ctx-03-ruler-effective-length-desc">
<title id="ctx-03-ruler-effective-length-title">Advertised windows outrun the length models use well</title>
<desc id="ctx-03-ruler-effective-length-desc">A dumbbell chart on a logarithmic axis of context length from 4K to 1M tokens, one row per model, cited from RULER Table 3 (Hsieh et al., 2024): a hollow circle at the claimed window, a hollow diamond at the effective length, where the 13-task average stays above 85.6%, joined by a red line. GPT-4, claimed 128K, effective 64K; Llama3.1 (70B), claimed 128K, effective 64K; GLM4 (9B), claimed 1M, effective 64K; Qwen2 (72B), claimed 128K, effective 32K; Yi (34B), claimed 200K, effective 32K; GradientAI/Llama3 (70B), claimed 1M, effective 16K; Mistral-v0.2 (7B), claimed 32K, effective 16K; DBRX (132B), claimed 32K, effective 8K.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
