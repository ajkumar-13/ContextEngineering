slug: 24-privacy-and-governance
title: "24 - Privacy, PII, and data governance"
summary: "Where regulated personal data enters the context and its copies, the trace store first, and where detection, redaction, retention, consent and tenant isolation must sit to govern it without gutting answer quality."
date: 2026-06-03
updated: 2026-10-13
status: complete
part: "Part IV - Production-grade practice"
level: intermediate
reading_time: 19
tags: [context-engineering, privacy, pii, data-governance, redaction, data-retention, tenant-isolation, gdpr]
hero: diagrams/01-one-gate-two-copies.svg
prerequisites: [ctx-022, ctx-023]
code: optional
outcomes:
  - id: o1
    text: "Trace where personally identifiable information enters the context, layer by layer, and every store that keeps a copy of it, the trace store first."
  - id: o2
    text: "Place a detect-and-redact gate at the trust boundary, and decide separately for the window and the trace store whether a value is redacted or kept."
  - id: o3
    text: "Set retention and residency for logged prompts, and say what a provider's zero-data-retention terms cover and what they leave to the application."
  - id: o4
    text: "Gate memory writes on sensitivity and a recorded lawful basis, and fan one erasure request out to every store that holds the person's data."
  - id: o5
    text: "Enforce tenant isolation in retrieval and memory with a scope filter that fails closed, and test it with a cross-tenant leak test."
recommended: [ctx-016]
