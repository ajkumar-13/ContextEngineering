l:space="preserve" x="54" y="121.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Full fidelity</text><text xml:space="preserve" x="54" y="165.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Prompt and response verbatim.</text><text xml:space="preserve" x="54" y="203.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">A short debugging window.</text><g opacity="0.36"><path d="M279.69 101.38C341.22 102.53 400.63 99.03 522.9 101.37C527.68 99.31 530.54 100.2 533.93 108.42C531.21 115.69 531.85 122.25 531.47 138.27C531.21 143.27 528.36 146.36 522.07 145.47C457.9 143.67 390.34 141.88 277.97 145.11C276.06 145.14 273.61 142.04 272.34 135.11C273.71 129.94 270.81 122.11 271.3 105.92C270.96 100.07 272.12 99.03 277.04 98.23C279.33 100 279.33 100 279.33 100" fill="var(--ce-warn)" stroke="none"/><path d="M280.94 99.1C341.02 99.89 402.61 100.18 523.9 100.55M279.21 100.08C365.21 101.78 451.2 101.5 524.45 99.72M524.67 100C530.65 100.83 530.22 100.94 532.15 106.64M523.82 99.94C529.2 101.79 533.74 100.86 533.45 108.23M533.97 106.45C530.85 117.18 532.52 128.79 532.66 138.39M531.41 108.22C530.87 117.62 531.81 126.89 531.1 135.94M532 136.67C530.08 141.73 530.19 145.07 523.88 145.54M531.5 135.47C533.37 139.43 529.46 144.98 524.9 142.58M525.55 145.03C438.93 147.17 354.71 145.85 280.52 143.34M524.92 143.59C444.81 145.55 363.39 146.2 279.71 143.76M279.33 144C273.19 144.05 273.35 139.7 271.92 135.29M281 142.12C273.47 141.86 270.15 140.36 273.85 135.43M273.79 135.15C272.73 125.66 270.61 114.4 272.64 105.73M271.81 136.3C271.98 126.28 271.73 115.02 272.84 107.85M272 107.33C271.36 103.25 272.98 99.94 280.53 100.49M270.17 108.86C272.32 100.65 273.89 102.02 280.29 102.03M279.33 100C279.33 100 279.33 100 279.33 100M279.33 100C279.33 100 279.33 100 279.33 100" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text xml:space="preserve" x="286" y="121.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Redacted or aggregated</text><text xml:space="preserve" x="286" y="165.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Enough to analyse, not enough to</text><text xml:space="preserve" x="286" y="177.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">identify.</text><text xml:space="preserve" x="286" y="203.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">A longer analytics window.</text><g opacity="0.36"><path d="M570.61 101.41C681.27 100.13 789.97 101.31 913.71 98.69C919.47 101.36 918.34 103.42 921.22 105.36C921.22 116.01 921.92 128.65 922.21 134.98C921.02 140.12 916.31 146.3 913.92 143.16C782.55 144.41 651.9 142.9 571.88 145.02C567.76 144.87 565.47 139.32 563.33 135.21C566.59 125.17 565.37 117.2 562.12 108.57C562.75 103.56 566.45 97.58 573.59 101.53C571.33 100 571.33 100 571.33 100" fill="var(--ce-success)" stroke="none"/><path d="M571.75 99.28C705.75 101.59 841.78 100.95 913.44 100.19M571.82 99.68C671.45 100.05 771.89 100.53 912.54 99.9M912.67 100C917.44 101.47 919.17 101.84 920.21 107.65M913.48 101.93C915.26 99.58 920.37 101.8 919.5 107.07M919.8 106.44C921.22 115.41 919.93 125.16 919.74 137.93M920.22 107.47C919.19 118.21 920.65 128.56 919.49 137.55M920 136.67C919.13 143.17 917.49 144.71 911.92 143.83M919.84 138.39C918.37 141.89 917.72 145.03 912.26 143.44M911.96 144.95C811.87 143.76 710.94 143.05 571.91 144.89M912.14 144.23C805.43 145.64 698.85 145.81 571.68 144.64M571.33 144C565.12 145.53 564.92 143.14 565.85 138.22M572.73 143.86C564.7 144.89 564.34 139.69 561.93 136.77M565.18 137.15C565.72 129.15 562.52 119.5 563.68 108.21M564.05 137.12C564.74 127.35 564.12 117.99 564.88 107.23M564 107.33C563.87 103.43 566.31 98.13 570.73 98.42M562.15 105.6C563.71 101.48 567.86 100.35 572.87 98.59M571.33 100C571.33 100 571.33 100 571.33 100M571.33 100C571.33 100 571.33 100 571.33 100" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text xml:space="preserve" x="578" y="121.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Hard deletion</text><text xml:space="preserve" x="578" y="165.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Gone, with an audit record that the deletion happened.</text><text xml:space="preserve" x="578" y="203.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">After that, automatically.</text><path d="M39.72 225.57C337.2 228.48 636.4 229.17 919.71 225.96M39.84 226.38C247.93 229.99 456.2 229.9 919.95 226.02" fill="none" stroke="var(--ce-ink-subtle)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M909.96 221.51 L920 226 L909.96 230.49" fill="none" stroke="var(--ce-ink-subtle)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="240.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ce-ink-subtle)">time since the call</text><text xml:space="preserve" x="40" y="276.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">The regulation sets the shape, not the number. GDPR's storage-limitation principle says personal data is kept no longer than</text><text xml:space="preserve" x="40" y="294.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">necessary for the purpose it was collected for; it names no window. The engineering point is that the store enforces whatever</text><text xml:space="preserve" x="40" y="312.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">you choose automatically, by lifecycle rule, rather than by somebody remembering to run a script.</text><path d="M54.9 329.58C189.78 328.1 321.03 327.94 455.22 328.66C464.72 329.46 467.9 333.16 469.64 344.93C470.36 371.87 468.61 397.77 467.96 410C471.21 421.24 467.21 428.15 452.21 427.76C361.13 426.29 268.73 425.62 57.42 424.91C44.67 426.26 42.45 421.39 38.35 411.38C40.92 384.26 38.25 359.41 39.37 348.01C42.18 335.21 44.1 332.12 56.79 331.16C56 330 56 330 56 330" fill="var(--ce-surface)" stroke="none"/><path d="M56.37 331.11C181.76 329.18 308.79 329.22 453.36 330.25M56.39 330.41C161.82 330.59 266.68 330.35 454.54 330.45M454 330C464.83 331.92 471.3 336.77 470.35 345.57M454.54 328.43C464.91 330.35 471.9 335.66 470.89 345.43M468.93 347.1C470.66 368.85 469.7 395.17 469.69 408.23M470.55 345.44C469.04 370.29 470.18 394.61 469.86 409.5M470 410C469.48 421.54 463.04 426.89 453.35 427.98M471.61 410.3C469.64 420.8 466.55 424.85 453.29 427.35M453.51 426.48C321.07 429.25 188.3 429.33 55.76 426.64M454.13 425.56C324.11 428.17 194.48 428.21 56.09 426.15M56 426C46.87 424.87 38.94 419 41.18 411.16M56.78 424.78C45.33 426.8 40.66 418.45 41.76 410.82M40.81 411.01C38.95 397.05 39.34 382.73 40.52 347.46M39.1 409.31C40.15 393.79 39.22 376.89 40.49 345.5M40 346C38.02 335.72 46.21 329.06 57.33 328.75M40.1 347.95C41.79 337.39 46.59 327.74 55.38 328.88M56 330C56 330 56 330 56 330M56 330C56 330 56 330 56 330" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M44.59 339.57C46.26 367.3 45.27 394.61 45.24 417.8M45.54 338.45C45.02 365.78 44.64 393.29 44.98 416.61" fill="none" stroke="var(--ce-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="349.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Residency</text><text xml:space="preserve" x="60" y="369.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Region-pinned inference and a documented sub-processor list keep</text><text xml:space="preserve" x="60" y="381.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">data in a jurisdiction. Treat the region guarantee as a contract to</text><text xml:space="preserve" x="60" y="394.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">check, not an assumption.</text><path d="M507 329.84C588.97 329.17 670.08 329.48 904.37 329.55C913.31 331.5 917.7 336.38 918.94 347.06C922.45 369.33 920.76 388.04 920.7 411.9C917.82 418.09 917.16 428.08 906.06 425.45C767.6 426.9 631.74 426.18 505.87 425.02C494.36 425.98 492.31 418.66 492.54 411.48C491.82 393.91 490.83 372.91 488.2 345.46C491.97 333.5 496.43 330.68 506.13 329.26C506 330 506 330 506 330" fill="var(--ce-surface)" stroke="none"/><path d="M505.62 331.12C608.54 331.16 711.53 330.45 904.56 330.03M505.74 330.09C587.86 327.31 671.25 327.67 903.44 330.56M904 330C913.63 328.57 918.25 333.68 920.41 346.57M902.2 330.42C912.97 328.14 920.54 336.6 918.95 344.27M920.76 347.09C919.11 364.45 919.18 386.25 918.77 411.78M919.36 346.69C919.18 359.03 918.85 372.56 920.25 409.1M920 410C920.53 418.99 916.34 426.52 903.39 426.27M921.95 409.22C921.23 418.66 916.81 424.91 902.64 428.21M904.57 426.59C791.49 425.9 677.98 426.28 505.43 425.57M903.5 426.04C780.59 428.14 656.8 427.89 506.12 425.72M506 426C496.81 426.35 488.51 422.44 489.1 410.09M506.51 426.52C494.57 425.23 488.25 422.39 487.84 412.16M490.2 409.01C491.07 385.94 490.39 362.62 489.56 345.94M489.34 410.13C490.68 384.45 489.39 361.02 490.54 346.88M490 346C488.53 335.89 493.55 331.25 505.53 330.67M490.08 344.7C491.18 333.62 493.96 330.67 505.96 330.03M506 330C506 330 506 330 506 330M506 330C506 330 506 330 506 330" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.2 339.58C495.42 360.77 495.66 385.2 494.1 417.57M494.86 339.3C495.5 361.74 495.41 384.2 495.02 416.72" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="510" y="349.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-alert)">The zero-retention trap</text><text xml:space="preserve" x="510" y="369.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Enable zero retention with the provider, then log the full prompt in</text><text xml:space="preserve" x="510" y="381.7" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">your own stack, and you have moved the regulated copy rather than</text><text xml:space="preserve" x="510" y="394.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">removed it.</text><text xml:space="preserve" x="40" y="457.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Governance is about the whole set of copies, not the provider's copy alone.</text>
</svg>
