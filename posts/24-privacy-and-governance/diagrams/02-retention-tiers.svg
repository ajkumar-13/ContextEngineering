<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The retention lifecycle and the zero-retention trap</title>
  <desc id="d">A hand-drawn timeline of three retention tiers along an axis of time since the call. First, full fidelity: prompt and response verbatim, for a short debugging window. Second, redacted or aggregated: enough to analyse and not enough to identify, for a longer analytics window. Third, hard deletion, with an audit record that the deletion happened, applied automatically after that. A caption notes that the regulation sets the shape rather than the number — GDPR's storage-limitation principle names no window — and that the engineering point is enforcing the choice by lifecycle rule rather than by a remembered script. Two panels follow: residency, where region-pinned inference and a documented sub-processor list keep data in a jurisdiction and the guarantee is a contract to check; and the zero-retention trap, where enabling zero retention with the provider while still logging the full prompt locally moves the regulated copy rather than removing it.</desc>

  <style><![CDATA[
