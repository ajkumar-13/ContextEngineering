<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-03-erasure-fan-out-title" aria-describedby="ctx-03-erasure-fan-out-desc">
<title id="ctx-03-erasure-fan-out-title">An erasure has to reach every copy</title>
<desc id="ctx-03-erasure-fan-out-desc">One erasure request for u-017 (Priya Raman, tenant-a) fans out to five stores. Counts are before, after a deletion that stops at the memory store, and after the fan-out: Memory rows, found by subject = u-017: 2, 0, 0; Source documents, found by about u-017: 2, 2, 0; Chunks and index, found by listed in the manifest: 3, 3, 0; Trace store, found by user = u-017: 2, 2, 0. The provider's copy is drawn dashed: its retention terms apply. A memory-only deletion leaves 7 copies. The query "Priya Raman duplicate card charge refund" retrieves doc-a2-c1, doc-a3-c1, doc-a1-c2 before and doc-a1-c2, doc-a4-c1, doc-a1-c1 after, so doc-a2-c1 and doc-a3-c1 are gone from the index.</desc>
