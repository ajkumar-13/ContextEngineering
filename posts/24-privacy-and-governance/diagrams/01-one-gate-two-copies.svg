<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-01-one-gate-two-copies-title" aria-describedby="ctx-01-one-gate-two-copies-desc">
<title id="ctx-01-one-gate-two-copies-title">Personal data crosses one gate, then lives in two copies</title>
<desc id="ctx-01-one-gate-two-copies-desc">Six bands, the window as post 02 draws it: 01 System prompt and 02 Tools and MCP descriptions in blue, 03 Memory and state and 04 Retrieved chunks in orange, 05 Conversation history in green, 06 User instruction in purple. Beside 01 and 02 a note says the team writes them and they hold no personal data. Four channels on the left, memory rows, retrieved chunks, tool results and the user message, pass through one detect-and-redact box at the trust boundary and enter layers 03, 04, 05 and 06. A bracket gathers the six layers and two arrows leave it: one to the model, one to the trace store, which holds a copy of all six layers of every prompt.</desc>
