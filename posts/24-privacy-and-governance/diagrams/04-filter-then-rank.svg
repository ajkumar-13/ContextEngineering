<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-04-filter-then-rank-title" aria-describedby="ctx-04-filter-then-rank-desc">
<title id="ctx-04-filter-then-rank-title">Ranking cannot keep tenants apart; a filter can</title>
<desc id="ctx-04-filter-then-rank-desc">Tenant B asks "How do I get a refund for a duplicate card charge?". Word-overlap scores of every chunk that shares a word with it: doc-a2-c1 (tenant-a) 4; doc-a3-c1 (tenant-a) 3; doc-a1-c2 (tenant-a) 2; doc-a4-c1 (tenant-a) 2; doc-a1-c1 (tenant-a) 1; doc-b1-c1 (tenant-b) 1; doc-b2-c1 (tenant-b) 1. Left, ranked over the whole store: the top 3, doc-a2-c1, doc-a3-c1, doc-a1-c2, are all tenant A's, two of them naming Priya Raman. Right, filtered to tenant B first: tenant A's chunks are not candidates and the pack is doc-b1-c1 and doc-b2-c1, tenant B's returns policy and a tenant B ticket.</desc>
