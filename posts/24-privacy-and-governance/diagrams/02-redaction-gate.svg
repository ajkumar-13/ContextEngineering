<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-02-redaction-gate-title" aria-describedby="ctx-02-redaction-gate-desc">
<title id="ctx-02-redaction-gate-title">Detect cheapest first, then keep the values apart</title>
<desc id="ctx-02-redaction-gate-desc">The prompt of call-01, a summarise task: "Summarise this ticket: Priya Raman (priya.raman@example.com) says her card 4111 1111 1111 1111 was charged twice." It passes three detectors in order. 1 Patterns with a check find CARD 4111 1111 1111 1111 and EMAIL priya.raman@example.com. 2 The name list, standing in for an NER model, finds PERSON Priya Raman. 3 The LLM classifier is drawn dashed: a fallback for high-risk paths, not run in the snippet. The redacted text, "Summarise this ticket: &lt;PERSON_1&gt; (&lt;EMAIL_1&gt;) says her card &lt;CARD_1&gt; was charged twice.", goes to the trace store always, and to the window because the task is a summary. The vault, kept apart with tighter access, holds &lt;CARD_1&gt; = 4111 1111 1111 1111, &lt;EMAIL_1&gt; = priya.raman@example.com, &lt;PERSON_1&gt; = Priya Raman.</desc>
