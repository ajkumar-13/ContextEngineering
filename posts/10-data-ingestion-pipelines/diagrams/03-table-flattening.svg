<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-03-table-flattening-title" aria-describedby="ctx-03-table-flattening-desc">
<title id="ctx-03-table-flattening-title">A flat stream keeps the numbers and loses the cells</title>
<desc id="ctx-03-table-flattening-desc">Left, the source table: header Product, Basic, Pro; Product A $10 and $20; Product B $15 and $30; Product C with an empty Basic cell, outlined in red, and $25 under Pro. Right, top: the flattened stream, Product Basic Pro Product A $10 $20 Product B $15 $30 Product C $25, with the final $25 in red; read back by position it gives Product C, Basic $25, marked wrong in red. Right, bottom: the same table as Markdown, in which Product C's Basic cell stays empty and Pro is $25.</desc>
<style>
