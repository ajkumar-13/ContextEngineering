</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="631">A flat stream keeps the numbers and loses the cells</text>
<text x="40" y="76" class="t-subtitle" data-w="403">Illustrative prices, run through snippets/flatten_table.py.</text>
<text x="40" y="120" class="t-head" data-w="135">The source table</text>
<rect x="40" y="136" width="112" height="40" class="nofill"/>
