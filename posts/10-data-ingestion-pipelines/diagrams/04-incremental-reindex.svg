<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-04-incremental-reindex-title" aria-describedby="ctx-04-incremental-reindex-desc">
<title id="ctx-04-incremental-reindex-title">A one-page edit re-embeds one page</title>
<desc id="ctx-04-incremental-reindex-desc">A table of the second ingest run of snippets/reindex.py, one row per page or document, with the hash check and the action: refunds.pdf p1, page hash unchanged, skip; refunds.pdf p2, page hash changed, delete old chunk, embed new; refunds.pdf p3, page hash unchanged, skip; shipping.html, document hash unchanged, skip; shipping_copy.html, same hash as shipping.html, not indexed; warranty.md p1, not in the manifest, embed; faq.md p1, source retired, delete its chunk; faq.md p2, source retired, delete its chunk. The two deleted faq.md rows are shaded red; the replace and embed actions are bold. Of the five pages in the corpus after the run, two were embedded.</desc>
