<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">A table flattened by a naive extractor, beside the same table preserved</title>
  <desc id="d">A hand-drawn comparison. On the left, a small pricing grid: a header row of Product, Basic, and Pro, then rows for Product A at ten and twenty dollars and Product B at fifteen and thirty. An arrow leads to two panels. The upper panel shows what a left-to-right, top-to-bottom reader emits: a flat stream in which all four numbers survive but nothing binds thirty dollars to the right cell. The lower panel shows the same table emitted as Markdown by a table-aware parser, where the header row and leftmost column are explicit in the token stream. Captions note that asking for the Pro price of Product B against the flat version is often confidently wrong, that nothing in the retrieval stack is broken because the relationship never entered the index, and that HTML is the better target when cells span rows or columns.</desc>

