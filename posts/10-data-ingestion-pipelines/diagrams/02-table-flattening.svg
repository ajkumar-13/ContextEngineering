xcalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">The header row and the leftmost column are right there, so $30 binds to Product B, Pro.</text><text xml:space="preserve" x="40" y="373.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">Ask &quot;what is the Pro price for Product B?&quot; of the first block and the answer is often confidently wrong.</text><text xml:space="preserve" x="40" y="395.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">Nothing in the retrieval stack is broken. The relationship that carried the meaning never entered the index.</text><text xml:space="preserve" x="40" y="417.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink-muted)">HTML is the better target when cells span rows or columns: rowspan and colspan have no clean Markdown equivalent.</text>
</svg>
