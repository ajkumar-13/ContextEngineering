<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">The three PDF extraction strategies and when each one applies</title>
  <desc id="d">A hand-drawn decision figure. A card on the left says to try born-digital extraction first, reading the text layer directly with pdfplumber, PyMuPDF, or pdfminer, because it is close to free. Two arrows branch from it to two escalations. The first is OCR, for when the text layer is empty or the page is an image of text, using Tesseract, cloud OCR, or vision-language models. The second is a layout-aware parser, for when reading order interleaves or a table comes out flattened, using tools such as Docling, Unstructured, or LlamaParse that detect regions first and then emit ordered Markdown. Three captions name the failure each strategy brings: born-digital interleaving two-column layouts, OCR's own character errors, and layout parsers still erring on hard tables. A final line notes one corpus often needs all three.</desc>

