<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ce-ink)">Three kinds of PDF, three extractors</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink-muted)">PDF is not one format. Choosing the wrong extractor is the most common ingestion mistake.</text><path d="M58.95 149C150.78 149 240.79 149.12 302.13 148.08C313.75 150.47 318.73 153.52 317.43 164.28C322.41 186.46 317.79 210.44 321.93 234.36C322.59 245.88 313.07 254.43 301.42 250.58C213.29 250.94 123.02 253.5 58.22 252.95C47.7 253.41 41.75 244.24 41.35 233C40.79 213.1 41.42 185.83 40.47 166.47C39.17 153.11 46.32 148.47 55.69 148.12C57.33 148 57.33 148 57.33 148" fill="var(--ce-surface)" stroke="none"/><path d="M56.73 147.09C133.59 150.38 210.92 148.46 303.47 148.87M58.15 148.55C108.17 148.65 160.45 147.51 302.4 147.56M302.67 148C312.52 148.19 321.28 155.36 320.09 163.64M304.17 149.94C315.81 147.4 318.5 155.85 318.79 167.39M320.14 164.46C320.64 181.51 321.28 199.55 321.57 232.84M320.6 164.97C320.52 187.44 320.93 208.06 320.71 234.33M320 234.67C321.04 244.94 315.55 253.44 301.84 251.25M319.16 234.55C319.78 246.23 313.87 252.92 303.55 249.73M302.01 252.87C207.07 250.57 108.06 252.11 55.7 252.89M302.18 252.54C218.68 253.7 134.06 253.13 57.66 252.39M57.33 252C44.58 250.56 41.78 244.92 42 234.35M59.27 252.38C45.56 251.43 40.56 245.69 41.17 236.69M38.39 235.14C38.72 216.26 37.67 199.49 41.6 165.25M39.57 235.48C39.53 217.17 39.64 199.97 40.79 164.47M40 165.33C38.85 154.41 46.97 149.75 56.34 146.57M38.19 166.11C40.93 155.75 47.85 147.09 57.71 148.88M57.33 148C57.33 148 57.33 148 57.33 148M57.33 148C57.33 148 57.33 148 57.33 148" fill="none" stroke="var(--ce-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M46.16 158.14C46.06 187.9 44.66 216.14 44.1 244.17M44.52 156.41C45.07 181.99 44.71 208.13 45.41 243.01" fill="none" stroke="var(--ce-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="169.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ce-ink)">1 · Born-digital</text><text xml:space="preserve" x="60" y="190.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Read the text layer directly.</text><text xml:space="preserve" x="60" y="211.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-subtle)">pdfplumber · PyMuPDF · pdfminer.six</text><text xml:space="preserve" x="60" y="233.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink)">Close to free. Always try it first.</text><path d="M433.52 105.69C614.33 107.11 796.22 106.56 906.21 105.93C915.47 103.74 918.44 109.92 921.57 119.22C920.02 138.78 920.69 156.38 920.84 176.89C917.52 180.98 916.82 190.33 908.26 188.31C750.54 188.08 597.83 188.25 434.64 187.48C423.42 189 418.94 185.17 422.43 172.83C419.27 160.25 417.21 142.19 421.31 119.58C421.46 112.53 426 104.3 436.25 105.88C433.67 106 433.67 106 433.67 106" fill="var(--ce-surface)" stroke="none"/><path d="M433.35 106.41C586.82 105.38 740.49 105.24 905.5 105.32M433.8 106.36C585.99 105.16 738.46 104.8 906.23 106.34M906.33 106C913.93 105.15 918.7 109.5 920.18 121.48M906.32 106.93C914.12 104.38 921.06 111.74 918.17 119.98M920.89 118.78C919.62 131.94 917.81 145.94 920.2 175.82M920.81 120.18C919.82 132.68 920.02 147.92 920.3 174.41M920 174.33C918.61 184.34 915.73 186.89 905.57 188.69M921.67 174.6C922.17 184.85 913.18 189 908.55 187.01M905.44 187.7C803.09 189.14 699.32 188.55 434.18 187.23M906.67 187.97C802.15 189.56 697.76 189.79 433.44 187.7M433.67 188C425.27 188.79 419.13 185.31 418.89 172.42M435.2 188.99C425.5 187.37 419.25 184.22 422.19 173.77M419.48 173.82C419.25 161.68 420.59 145.85 418.16 121.31M420.93 174.38C420.31 154.75 420.87 135.71 419.86 119.87M420 119.67C421.61 109.45 423.76 107.04 433.96 107.46M418.16 121.56C417.72 111.47 424.98 104.88 432.61 104.01M433.67 106C433.67 106 433.67 106 433.67 106M433.67 106C433.67 106 433.67 106 433.67 106" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M426.17 114.95C425.78 138.49 426.22 161.19 424.79 178.63M425.31 114.5C425.75 128.06 425.81 141.36 425.47 178.58" fill="none" stroke="var(--ce-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="438" y="127.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ce-ink)">2 · OCR</text><text xml:space="preserve" x="438" y="148.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">when the text layer is empty, or the page is an image of text</text><text xml:space="preserve" x="438" y="169.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Tesseract · cloud OCR · vision-language models</text><path d="M433.83 226.52C586.89 226.43 739.68 226.91 907.12 225.06C915.01 224.99 918.19 228.75 920.7 237.99C922.74 259.34 920.89 283.41 919.06 296.67C921.08 300.94 915.46 310.25 906.57 308.03C780.8 307.57 654.37 308.27 434.28 308.17C426.94 308.66 420.06 305.66 422.47 295.56C421.84 280.65 421.87 271.35 418.54 237.7C419.9 232.99 422.42 225.09 435.43 227.41C433.67 226 433.67 226 433.67 226" fill="var(--ce-surface)" stroke="none"/><path d="M433.95 225.97C577.03 228.06 719.66 227.19 907.11 225.56M433.39 226.26C599.8 227.72 764.94 227.28 906.71 225.78M906.33 226C915.42 224.96 919.88 230.63 920.26 239.73M904.39 225.43C914 227.37 919.35 231.77 921.5 240.83M918.18 240.77C920.35 252.05 917.84 260.04 921.06 293.25M920.33 240.24C919.76 252.05 921.11 264.76 920.28 293.42M920 294.33C921.91 302.15 914.86 307.43 905.62 308.55M919.1 294.25C921.86 302.18 914.65 306.77 904.29 308.07M906.48 307.36C760.82 309.05 615.88 310.53 433.86 307.97M906.73 307.99C788.28 310.01 669.39 309.5 433.25 307.73M433.67 308C424.19 308.64 421.59 302.61 420.29 293.09M434.86 306.17C423.39 308.86 421.98 304.53 420.74 293.14M419.72 296.33C419.84 281.32 421.84 271.75 419.96 239.41M419.74 294.41C420.04 275.3 418.66 255.33 419.42 240.1M420 239.67C419.25 228.67 423.43 225.77 433.71 225.86M420.13 240.5C420.41 229.06 422.85 223.94 434.48 227.75M433.67 226C433.67 226 433.67 226 433.67 226M433.67 226C433.67 226 433.67 226 433.67 226" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M424.58 234.36C424.07 255.75 426.05 278.44 424.56 298.94M424.76 235.57C425.24 250.72 425.65 265.71 424.92 299.03" fill="none" stroke="var(--ce-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="438" y="247.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ce-ink)">3 · Layout-aware parser</text><text xml:space="preserve" x="438" y="268.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink)">when reading order interleaves, or a table comes out flattened</text><text xml:space="preserve" x="438" y="289.2" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="10" fill="var(--ce-ink-muted)">Docling · Unstructured · LlamaParse — regions first, then ordered Markdown</text><path d="M325.98 184.95C351.36 174.43 373.99 164.72 415.36 149.53M324.47 186.37C358.16 171.99 391.41 159.17 413.93 150.24" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M403.01 149.57 L414 150 L406.34 157.89" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M324.65 215.95C352.1 226.52 382.43 239.25 412.88 254.43M324.68 214.73C349.13 225.14 372.2 235.3 414.95 254.79" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.64 245.82 L414 254 L403 254.02" fill="none" stroke="var(--ce-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="40" y="327.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ce-ink)">Each brings its own failure</text><text xml:space="preserve" x="40" y="350.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">Born-digital reads glyphs by position, so a two-column layout can interleave into nonsense.</text><text xml:space="preserve" x="40" y="372.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">OCR has an error class of its own: &quot;rn&quot; read as &quot;m&quot;, a dropped decimal point. Measure character accuracy on a sample.</text><text xml:space="preserve" x="40" y="394.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ce-ink-muted)">A layout-aware parser is heavier, often a vision model, and still errs on hard tables. Sample the output either way.</text><text xml:space="preserve" x="40" y="429.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ce-ink)">One corpus often needs all three, because it contains all three kinds of PDF.</text>
</svg>
