<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-pdf-decision-title" aria-describedby="ctx-02-pdf-decision-desc">
<title id="ctx-02-pdf-decision-title">Start with the text layer; escalate on evidence</title>
<desc id="ctx-02-pdf-decision-desc">A decision walk for one PDF down a spine of four boxes. First, try born-digital extraction: read the text layer; its risk is that two columns interleave. Then ask: is the text layer empty, or the page an image? Yes leads right to OCR, whose risk is character errors, rn read as m. No leads down to: are reading order or tables mangled? Yes leads right to a layout-aware parser, whose risk is that it still errs on hard tables. No leads to: index the born-digital text, after reading a sample of it.</desc>
<style>
  :root {
    --ctx-bg: #FAFAF7;
    --ctx-surface: #FFFFFF;
    --ctx-ink: #1A1A1A;
    --ctx-ink-muted: #5C5C5C;
    --ctx-ink-subtle: #9A9A9A;
    --ctx-border: #D9D9D4;
    --ctx-primary: #5B7FBF;
    --ctx-accent: #D98E5F;
    --ctx-success: #5C9E78;
    --ctx-warn: #B8895A;
    --ctx-alert: #C66B5E;
    --ctx-neutral-1: #EAEAE4;
    --ctx-neutral-2: #CFCFC8;
    --ctx-neutral-3: #8E8E88;
    --ctx-on-fill: #FFFDF9;
    --ctx-on-accent: #1A1A1A;
    --ctx-grid: rgba(26, 26, 26, 0.06);
    --ctx-rule: #8E8E88;
    --ctx-arrow: #6E6E68;
    --ctx-neutral-soft: #F2F2EE;
    --ctx-blue: #0072B2;
    --ctx-blue-ink: #005A8C;
    --ctx-blue-soft: #E3F0F8;
    --ctx-blue-line: #9CC6E0;
    --ctx-orange: #C98500;
    --ctx-orange-ink: #8A5B00;
    --ctx-orange-soft: #FBF0D9;
    --ctx-orange-line: #E5C27A;
    --ctx-green: #008F68;
    --ctx-green-ink: #006B4E;
    --ctx-green-soft: #DFF3EC;
    --ctx-green-line: #8FCDB8;
    --ctx-red: #A8322A;
    --ctx-red-ink: #8F2A23;
    --ctx-red-soft: #F8E3E1;
    --ctx-red-line: #DDA49F;
    --ctx-purple: #A14D8C;
    --ctx-purple-ink: #833E72;
    --ctx-purple-soft: #F4E4EF;
    --ctx-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ctx-bg: #0E0F12;
      --ctx-surface: #16181C;
      --ctx-ink: #F2F2EE;
      --ctx-ink-muted: #B4B4AE;
      --ctx-ink-subtle: #6E6E68;
      --ctx-border: #2A2D33;
      --ctx-primary: #8BA8E0;
      --ctx-accent: #E8B088;
      --ctx-success: #7FBF9B;
      --ctx-warn: #D4B58A;
      --ctx-alert: #D88880;
      --ctx-neutral-1: #1F2229;
      --ctx-neutral-2: #2C3038;
      --ctx-neutral-3: #6E6E68;
      --ctx-on-fill: #14161A;
      --ctx-on-accent: #1A1A1A;
      --ctx-grid: rgba(241, 238, 232, 0.08);
      --ctx-rule: #6A6D74;
      --ctx-arrow: #9A9A94;
      --ctx-neutral-soft: #1C1E23;
      --ctx-blue: #5AA8E0;
      --ctx-blue-ink: #7DBBE8;
      --ctx-blue-soft: #14283A;
      --ctx-blue-line: #2E5878;
      --ctx-orange: #E8B040;
      --ctx-orange-ink: #F0C060;
      --ctx-orange-soft: #33260F;
      --ctx-orange-line: #6E5222;
      --ctx-green: #3CC497;
      --ctx-green-ink: #62D1AC;
      --ctx-green-soft: #10302A;
      --ctx-green-line: #2A6A55;
      --ctx-red: #E8796E;
      --ctx-red-ink: #F09A90;
      --ctx-red-soft: #3A1A18;
      --ctx-red-line: #7A3A34;
      --ctx-purple: #D58CC4;
      --ctx-purple-ink: #E2A6D3;
      --ctx-purple-soft: #331F2E;
      --ctx-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--ctx-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ctx-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--ctx-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--ctx-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--ctx-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--ctx-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--ctx-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--ctx-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--ctx-surface); stroke: var(--ctx-rule); stroke-width: 1; }
  .card { fill: var(--ctx-neutral-soft); stroke: var(--ctx-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--ctx-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--ctx-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--ctx-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--ctx-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--ctx-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--ctx-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--ctx-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-neutral-soft { fill: var(--ctx-neutral-soft); }
  .s-border { stroke: var(--ctx-border); }
  .s-rule { stroke: var(--ctx-rule); }
</style>
<defs>
<marker id="ctx-02-pdf-decision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="557">Start with the text layer; escalate on evidence</text>
<text x="40" y="76" class="t-subtitle" data-w="676">Three kinds of PDF, three extractors; each question is answered by reading the extracted text.</text>
<rect x="40" y="104" width="432" height="64" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="56" y="132" class="t-head" data-w="214">Try born-digital extraction</text>
<text x="56" y="152" class="t-note" data-w="316">read the text layer; risk: two columns interleave</text>
<path d="M104,168 L104,197" class="flow" marker-end="url(#ctx-02-pdf-decision-arrow)"/>
<rect x="40" y="200" width="432" height="64" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="200" width="432" height="64" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="240" class="t-label" data-w="309">Is the text layer empty, or the page an image?</text>
<rect x="568" y="200" width="352" height="64" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="584" y="228" class="t-head" data-w="38">OCR</text>
<text x="584" y="248" class="t-note" data-w="231">risk: character errors, rn read as m</text>
<path d="M480,232 L557,232" class="flow" marker-end="url(#ctx-02-pdf-decision-arrow)"/>
<text x="520" y="220" text-anchor="middle" class="t-note" data-w="23">yes</text>
<path d="M104,264 L104,293" class="flow" marker-end="url(#ctx-02-pdf-decision-arrow)"/>
<text x="116" y="284" class="t-note" data-w="17">no</text>
<rect x="40" y="296" width="432" height="64" rx="8" class="f-neutral-soft" data-fit="skip"/>
<rect x="40" y="296" width="432" height="64" rx="8" class="w1 nofill s-border" data-fit="skip"/>
<text x="56" y="336" class="t-label" data-w="251">Are reading order or tables mangled?</text>
<rect x="568" y="296" width="352" height="64" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="584" y="324" class="t-head" data-w="168">Layout-aware parser</text>
<text x="584" y="344" class="t-note" data-w="185">risk: still errs on hard tables</text>
<path d="M480,328 L557,328" class="flow" marker-end="url(#ctx-02-pdf-decision-arrow)"/>
<text x="520" y="316" text-anchor="middle" class="t-note" data-w="23">yes</text>
<path d="M104,360 L104,389" class="flow" marker-end="url(#ctx-02-pdf-decision-arrow)"/>
<text x="116" y="380" class="t-note" data-w="17">no</text>
<rect x="40" y="392" width="432" height="64" rx="8" class="w1 nofill s-rule" data-fit="skip"/>
<text x="56" y="420" class="t-head" data-w="212">Index the born-digital text</text>
<text x="56" y="440" class="t-note" data-w="181">after reading a sample of it</text>
<text x="40" y="504" class="t-note" data-w="490">One corpus often needs all three, because it holds all three kinds of PDF.</text>
</svg>
