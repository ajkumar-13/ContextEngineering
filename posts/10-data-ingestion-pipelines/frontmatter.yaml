outcomes:
  - id: o1
    text: "Choose a parsing strategy for a source file (born-digital extraction, OCR or a layout-aware parser) and name what escalates from one to the next."
  - id: o2
    text: "Preserve tables and reading order through parsing, and check a parsed table cell against the source."
  - id: o3
    text: "Strip boilerplate before chunking: main-content extraction for web pages, and repeated headers, footers and navigation."
  - id: o4
    text: "Attach provenance at ingest (source, page, section, timestamp, document type) and name what citations, conflict resolution and filtering need from it."
  - id: o5
    text: "Re-index incrementally with content hashes, so that a changed page is re-embedded and its old chunk replaced while unchanged pages are skipped."
