<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-00-hero-long-context-vs-rag-title" aria-describedby="ctx-00-hero-long-context-vs-rag-desc">
<title id="ctx-00-hero-long-context-vs-rag-title">Four questions decide between loading and retrieving</title>
<desc id="ctx-00-hero-long-context-vs-rag-desc">A decision chain of four question cards stacked down the left, joined by arrows labelled yes. 1, does the corpus fit one window with room to spare for the prompt, history and output; no leads to RAG. 2, is it stable enough to cache, the prefix staying identical between calls; no leads to RAG indexed incrementally. 3, does each query need most of it; a small slice leads to RAG and a mix of query kinds to a per-query router. 4, can the model use it at that length, judged on the application's own evaluation; no leads to RAG over a curated subset. Four yes answers lead to loading the corpus once and caching it. Retrieval exits are drawn in the per-turn colour, the cached load in the stable-prefix colour, the router in ink.</desc>
<style>
