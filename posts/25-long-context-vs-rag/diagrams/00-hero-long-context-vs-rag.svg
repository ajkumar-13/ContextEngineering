  .s-orange { stroke: var(--ctx-orange); }
  .s-orange-line { stroke: var(--ctx-orange-line); }
</style>
<defs>
<marker id="ctx-00-hero-long-context-vs-rag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="720"/>
<text x="40" y="48" class="t-title" data-w="655">Four questions decide between loading and retrieving</text>
<text x="40" y="76" class="t-subtitle" data-w="649">Asked in order. An answer that leaves the spine settles the workload, or that kind of query.</text>
<rect x="40" y="112" width="408" height="96" rx="8" class="card"/>
<text x="56" y="144" class="t-head" data-w="272">1. Does it fit, with room to spare?</text>
<text x="56" y="176" class="t-note" data-w="333">corpus, prompt, history and output in one window</text>
<path d="M244,208 L244,229" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="256" y="224" class="t-note" data-w="23">yes</text>
<path d="M448,160 L557,160" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="504" y="148" text-anchor="middle" class="t-note" data-w="17">no</text>
<rect x="560" y="132" width="360" height="56" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="576" y="164" class="t-head" data-w="38">RAG</text>
<rect x="40" y="232" width="408" height="96" rx="8" class="card"/>
<text x="56" y="264" class="t-head" data-w="254">2. Is it stable enough to cache?</text>
<text x="56" y="296" class="t-note" data-w="258">the prefix stays identical between calls</text>
<path d="M244,328 L244,349" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="256" y="344" class="t-note" data-w="23">yes</text>
<path d="M448,280 L557,280" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="504" y="268" text-anchor="middle" class="t-note" data-w="17">no</text>
<rect x="560" y="252" width="360" height="56" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="576" y="284" class="t-head" data-w="226">RAG, indexed incrementally</text>
<rect x="40" y="352" width="408" height="96" rx="8" class="card"/>
<text x="56" y="384" class="t-head" data-w="292">3. Does each query need most of it?</text>
<text x="56" y="416" class="t-note" data-w="228">a global question, not a local slice</text>
<path d="M244,448 L244,469" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="256" y="464" class="t-note" data-w="23">yes</text>
<path d="M448,376 L557,376" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="504" y="364" text-anchor="middle" class="t-note" data-w="43">a slice</text>
<rect x="560" y="352" width="360" height="44" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="576" y="384" class="t-head" data-w="136">Small slice: RAG</text>
<path d="M448,424 L557,424" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="504" y="412" text-anchor="middle" class="t-note" data-w="24">mix</text>
<rect x="560" y="404" width="360" height="44" rx="8" class="card"/>
<text x="576" y="436" class="t-head" data-w="182">A mix: route per query</text>
<rect x="40" y="472" width="408" height="96" rx="8" class="card"/>
<text x="56" y="504" class="t-head" data-w="311">4. Can the model use it at that length?</text>
<text x="56" y="536" class="t-note" data-w="236">on the application's own evaluation</text>
<path d="M244,568 L244,589" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="256" y="584" class="t-note" data-w="23">yes</text>
<path d="M448,520 L557,520" class="flow" marker-end="url(#ctx-00-hero-long-context-vs-rag-arrow)"/>
<text x="504" y="508" text-anchor="middle" class="t-note" data-w="17">no</text>
<rect x="560" y="492" width="360" height="56" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="576" y="524" class="t-head" data-w="219">RAG over a curated subset</text>
<rect x="40" y="592" width="408" height="56" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="56" y="624" class="t-head" data-w="279">Load the corpus once and cache it</text>
<rect x="560" y="600" width="16" height="16" class="f-orange s-orange w1"/>
<text x="592" y="612" class="t-label" data-w="222">retrieval fills layer 04 on each call</text>
<rect x="560" y="624" width="16" height="16" class="f-blue s-blue w1"/>
<text x="592" y="636" class="t-label" data-w="223">a cached prefix, read on every hit</text>
<text x="40" y="684" class="t-note" data-w="580">A workload with both whole-corpus and local queries answers question 3 with a router.</text>
</svg>
