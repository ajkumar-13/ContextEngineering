<text xml:space="preserve" x="40" y="38.24" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="22" fill="var(--ctx-ink)">Where each one actually wins</text><text xml:space="preserve" x="40" y="61.96" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="13" fill="var(--ctx-ink-muted)">Two lists that only mean something read against each other. Neither is a default for the other's cases.</text><path d="M65.17 94.72C208.05 95.1 349.61 95.18 445.61 94.06C461.53 96.47 468.73 101.74 467.43 116.95C472.05 189.74 468.14 263.9 471.64 349.74C472.59 365.66 460.85 376.43 444.76 372.58C307.35 373.13 168.05 374.99 64.64 374.68C49.92 375.41 41.75 364.02 41.35 348.34C40.58 272.24 41.11 189.65 40.4 118.96C39.17 101.34 48.54 94.47 62.36 94.12C64 94 64 94 64 94" fill="var(--ctx-surface)" stroke="none"/><path d="M63.57 93.34C182.83 96.47 302.44 95.08 446.58 94.63M64.59 94.4C143.47 94.48 224 93.66 445.81 93.68M446 94C460.3 94.19 471.28 103.58 470.09 116.31M447.5 95.94C463.59 93.4 468.5 104.07 468.79 120.06M470.12 117.26C471.11 176.88 471.65 237.33 471.33 348.46M470.5 117.69C470.34 190.52 470.68 261.79 470.61 349.72M470 350C471.04 364.72 463.32 375.44 445.18 373.25M469.16 349.88C469.78 366 461.65 374.92 446.88 371.73M445.52 374.63C296.31 373.04 144.15 374.16 62.82 374.64M445.65 374.39C314.84 375.73 183.22 375.32 64.24 374.28M64 374C46.81 372.56 41.78 364.7 42 349.68M65.94 374.38C47.78 373.43 40.56 365.47 41.17 352.02M38.64 350.4C37.63 292.06 36.74 235.51 41.36 117.93M39.64 350.69C40.65 292.27 40.74 234.8 40.67 117.27M40 118C38.85 102.63 49.19 95.75 63 92.57M38.19 118.77C40.93 103.97 50.07 93.09 64.38 94.88M64 94C64 94 64 94 64 94M64 94C64 94 64 94 64 94" fill="none" stroke="var(--ctx-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M45.93 103.91C45.88 194.74 44.77 284.36 44.28 365.93M44.62 102.53C44.63 179.87 44.35 257.67 45.33 365.01" fill="none" stroke="var(--ctx-success)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="60" y="115.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ctx-ink)">Long context wins</text><text xml:space="preserve" x="60" y="136.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">Single-document workflows</text><text xml:space="preserve" x="60" y="150.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">A contract review, a paper, one repository. The whole thing fits and the</text><text xml:space="preserve" x="60" y="161.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">prefix cache amortises it across the session.</text><text xml:space="preserve" x="60" y="198.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">Few-shot with many examples</text><text xml:space="preserve" x="60" y="212.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">Fifty to two hundred in-context examples beat retrieving subsets per</text><text xml:space="preserve" x="60" y="223.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">query, once cached.</text><text xml:space="preserve" x="60" y="260.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">Long coherent sessions</text><text xml:space="preserve" x="60" y="274.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">A coding session that has touched many files: loading them beats</text><text xml:space="preserve" x="60" y="285.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">reconstructing them each turn.</text><text xml:space="preserve" x="60" y="322.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">Low-volume, high-stakes</text><text xml:space="preserve" x="60" y="336.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">A legal review where one query might cost five dollars and a wrong answer</text><text xml:space="preserve" x="60" y="347.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">costs far more.</text><path d="M514.22 94.7C637.7 94.3 760.82 94.95 897.05 92.75C911.56 92.99 918.19 100.19 920.7 116.32C922.85 206.44 921.29 298.6 919.2 351.98C921.08 363.5 912.01 376.25 896.24 374.03C794.57 373.32 691.95 374.25 514.82 374.23C500.39 374.66 490.06 368.21 492.47 351.22C491.3 296.04 491.32 245.78 488.76 116.33C489.9 104.44 495.86 93.09 515.76 95.41C514 94 514 94 514 94" fill="var(--ctx-surface)" stroke="none"/><path d="M514.38 93.96C629.96 96.38 744.94 95.21 897.04 93.41M513.63 94.35C648.46 95.9 781.58 95.3 896.51 93.7M896 94C911.98 92.96 919.88 102.08 920.26 118.06M894.06 93.43C910.55 95.37 919.35 103.21 921.5 119.17M918.46 118.94C919.32 165.9 917.19 210.08 920.9 349.08M920.28 118.48C920.87 172.18 922.02 226.62 920.24 349.23M920 350C921.91 364.7 911.41 373.43 895.29 374.55M919.1 349.92C921.86 364.73 911.2 372.77 893.96 374.07M896.2 373.15C778.29 374.97 661.35 376.97 514.26 373.96M896.53 373.98C800.79 376.23 704.47 375.56 513.44 373.64M514 374C497.63 374.64 491.59 365.17 490.29 348.75M515.19 372.17C496.84 374.86 491.98 367.09 490.74 348.81M489.77 351.69C490.2 298.07 491.9 249.07 489.97 117.78M489.78 350.06C488.49 267.22 487.32 183.66 489.51 118.37M490 118C489.25 100.12 496.87 93.77 514.04 93.86M490.13 118.83C490.41 100.51 496.3 91.94 514.81 95.75M514 94C514 94 514 94 514 94M514 94C514 94 514 94 514 94" fill="none" stroke="var(--ctx-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M494.67 102.49C494.49 190.96 496.07 280.47 494.65 364.96M494.81 103.45C496.05 165.4 496.38 227.22 494.94 365.02" fill="none" stroke="var(--ctx-alert)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="510" y="115.8" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="15" fill="var(--ctx-ink)">RAG wins</text><text xml:space="preserve" x="510" y="136.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">Large or unbounded corpora</text><text xml:space="preserve" x="510" y="150.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">Anything past the practical threshold of a long-context model, which is</text><text xml:space="preserve" x="510" y="161.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">most production knowledge bases.</text><text xml:space="preserve" x="510" y="198.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">Frequently-updating corpora</text><text xml:space="preserve" x="510" y="212.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">Cache invalidation kills the long-context economics outright.</text><text xml:space="preserve" x="510" y="260.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">High volume, low query value</text><text xml:space="preserve" x="510" y="274.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">A consumer assistant runs millions of queries; small per-query savings</text><text xml:space="preserve" x="510" y="285.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">dominate everything else.</text><text xml:space="preserve" x="510" y="322.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink)">Precision, or per-user data</text><text xml:space="preserve" x="510" y="336.28" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">Reranking hands the model a small focused context. And loading one user's</text><text xml:space="preserve" x="510" y="347.53" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="9" fill="var(--ctx-ink-muted)">data is fine; loading everyone's is not.</text><text xml:space="preserve" x="40" y="407.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink)">The common thread on the left: the value of the model seeing everything together exceeds the cost of paying for everything.</text><text xml:space="preserve" x="40" y="429.04" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="12" fill="var(--ctx-ink-muted)">And that only holds with caching. Without a stable prefix even these cases lose, which is why question two comes before question three.</text><text xml:space="preserve" x="40" y="454.12" text-anchor="start" font-family='"Excalifont","Virgil","Segoe Print","Comic Sans MS",ui-rounded,cursive' font-size="11" fill="var(--ctx-ink-subtle)">Reserve roughly thirty per cent of the window for the conversation, prompt, tools, and output before counting corpus. Illustrative, not measured.</text>
</svg>
