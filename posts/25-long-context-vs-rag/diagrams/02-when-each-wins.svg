<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Where long context wins and where RAG wins</title>
  <desc id="d">A hand-drawn two-panel comparison. Long context wins on single-document workflows such as a contract review or one repository, where the whole thing fits and the prefix cache amortises across a session; on few-shot tasks with fifty to two hundred in-context examples; on long coherent sessions such as a coding session that has touched many files; and on low-volume high-stakes queries where a wrong answer costs far more than the call. RAG wins on large or unbounded corpora past the practical threshold of a long-context model; on frequently-updating corpora where cache invalidation kills the economics; on high query volume with low per-query value; and where precision matters or the data is per-user, since loading one user's data is fine but loading everyone's is not. Captions note the common thread on the left holds only with caching, and that roughly thirty per cent of the window should be reserved before counting corpus.</desc>

