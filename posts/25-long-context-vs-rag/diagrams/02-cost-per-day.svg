<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ctx-02-cost-per-day-title" aria-describedby="ctx-02-cost-per-day-desc">
<title id="ctx-02-cost-per-day-title">Caching cuts the corpus bill; retrieval removes it</title>
<desc id="ctx-02-cost-per-day-desc">Four horizontal bars of dollars per day for 1,000 queries over a 200,000-token corpus on Claude Opus 4.6, prices as of early 2026, every size illustrative and every segment dashed. Long context, uncached: 1,013.00, past a broken axis. Long context, cached, with 10 cache writes a day: 124.50, of which 25.50 is paid in full (the writes, the questions and the answers) and 99.00 is read from the cache. Hybrid, 10% of queries on long context: 57.45, made of 13.80 in full, 9.00 from the cache and 34.65 of RAG calls. RAG alone: 38.50. A note gives the prefill before the first token, uncached, at post 04's illustrative rates: 80.04 seconds for the corpus and 2.00 seconds for a RAG call.</desc>
<style>
