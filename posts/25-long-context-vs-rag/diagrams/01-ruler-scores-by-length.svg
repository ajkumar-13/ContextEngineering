<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="ctx-01-ruler-scores-by-length-title" aria-describedby="ctx-01-ruler-scores-by-length-desc">
<title id="ctx-01-ruler-scores-by-length-title">Most scores cross the threshold inside the claimed window</title>
<desc id="ctx-01-ruler-scores-by-length-desc">A line chart cited from RULER Table 3 (Hsieh et al., 2024): the 13-task average score in percent against context length on a doubling axis from 4K to 128K tokens, with a dashed reference line at the 85.6% threshold that defines effective length and the band below it shaded red. Hollow marks, one line per model: Gemini-1.5-Pro, claiming 1M, 96.7 at 4K to 94.4 at 128K, above the threshold throughout; GPT-4, claiming 128K, 96.6 to 81.2, below it after 64K; GradientAI/Llama3 (70B), claiming 1M, 95.1 to 72.1, below it after 16K; Llama3.1 (70B), claiming 128K, 96.5 to 66.6, below it after 64K; Qwen2 (72B), claiming 128K, 96.9 to 53.7, below it after 32K.</desc>
<style>
